<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#7A0F2B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Solonos" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>Solonos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet" />
<style>
:root {
  --brand: #800020; --accent: #0C4767; --accent-dk: #0a3a54;
  --on: #FAF3E9; --surface: #FAF3E9; --sunken: #F3E7DE; --bg: #EFE2D8;
  --border: #DCC6BF; --border-sub: #E6D4CD; --border-dash: #C9ABA3;
  --text: #2A1E20; --text-2: #463639; --text-3: #5A4548; --muted: #6B5457;
  --danger: #9A3B1A; --ok: #2F6B3A; --warn: #8A5A00;
}
* { box-sizing: border-box; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 4px 0 18px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 16px; font-weight: 600; color: var(--text-3); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--brand); border-bottom-color: var(--brand); }
html, body, #root { margin: 0; height: 100%; }
body { font: 14px/1.5 Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; }
h1 { font: 600 28px/1.15 Newsreader, serif; margin: 0; letter-spacing: -0.01em; }
h2 { font: 600 20px/1.2 Newsreader, serif; margin: 0; }
h3 { font: 600 14px/1.3 Inter, sans-serif; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.serif { font-family: Newsreader, serif; }

/* shell */
.shell { display: flex; min-height: 100vh; }
.sidebar { width: 216px; flex: none; background: var(--brand); color: var(--on); display: flex; flex-direction: column; padding: 20px 14px; gap: 2px; position: sticky; top: 0; height: 100vh; }
.sidebar .wordmark { font: 600 18px Newsreader, serif; padding: 4px 10px 18px; }
.sidebar a { display: flex; justify-content: space-between; align-items: center; color: var(--on); opacity: .78; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
.sidebar a:hover { opacity: 1; background: rgba(255,255,255,.08); }
.sidebar a.active { opacity: 1; background: rgba(255,255,255,.16); font-weight: 600; }
.sidebar a .soon { font-size: 10px; opacity: .6; }
.sidebar .foot { margin-top: auto; padding: 10px; font-size: 12px; opacity: .8; }
.sidebar .foot button { background: none; border: 1px solid rgba(255,255,255,.35); color: var(--on); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; margin-top: 8px; }
.main { flex: 1; min-width: 0; padding: 28px 32px 60px; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.pagehead p { margin: 4px 0 0; color: var(--muted); }

/* primitives */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.card .cardhead { padding: 12px 16px; border-bottom: 1px solid var(--border-sub); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card .cardbody { padding: 14px 16px; }
.btn { border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font: 500 12px Inter, sans-serif; background: var(--sunken); color: var(--text); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--border-dash); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--on); border-color: var(--accent); padding: 8px 14px; font-weight: 600; }
.btn.primary:hover { background: var(--accent-dk); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.link { background: none; border: none; color: var(--accent); padding: 0; }
.chip { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 9px; background: var(--sunken); color: var(--text-2); white-space: nowrap; }
.chip.brand { background: var(--brand); color: var(--on); }
.chip.accent { background: var(--accent); color: var(--on); }
.chip.ok { background: #DDEBD9; color: var(--ok); }
.chip.warn { background: #F5E4C0; color: var(--warn); }
.chip.danger { background: #F1D5CB; color: var(--danger); }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 1100px) { .main .grid2, .main .grid3 { grid-template-columns: 1fr; } }
@media (max-width: 800px) { .drawer .grid2 { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--text-3); }
.field input, .field select, .field textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }

.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); margin: 0; }
.kv dd { margin: 0; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--border-sub); vertical-align: middle; }
.table tr.click { cursor: pointer; }
.table tr.click:hover td { background: var(--sunken); }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--text); font: 600 16px Newsreader, serif; margin-bottom: 4px; }
.err { background: #F1D5CB; color: var(--danger); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.note { background: var(--sunken); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--text-3); }

/* stepper */
.stepper { display: flex; gap: 0; align-items: stretch; }
.step { flex: 1; padding: 8px 10px; border-top: 3px solid var(--border-sub); font-size: 11px; color: var(--muted); }
.step.done { border-top-color: var(--accent); color: var(--text-2); }
.step.now { border-top-color: var(--brand); color: var(--brand); font-weight: 600; }
.step.declined { border-top-color: var(--danger); color: var(--danger); }
button.step { background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; font-size: 12px; }
button.step:hover { color: var(--brand); }

/* reports */
.pills { display: flex; gap: 4px; background: var(--sunken); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.pills button { border: none; background: transparent; color: var(--text-2); padding: 6px 12px; border-radius: 7px; font: 500 12px Inter, sans-serif; cursor: pointer; }
.pills button.on { background: var(--accent); color: var(--on); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.stat .lbl { font-size: 12px; color: var(--muted); }
.stat .val { font: 600 28px/1.1 Newsreader, serif; margin: 6px 0 4px; }
.stat .sub { font-size: 12px; color: var(--text-3); }
.stat.hero { background: var(--accent); border-color: var(--accent); color: var(--on); }
.stat.hero .lbl, .stat.hero .sub { color: var(--on); opacity: .8; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table tr.total td { font-weight: 700; background: var(--sunken); border-top: 2px solid var(--border); }
.table td.ghost { color: var(--warn); font-style: italic; }
.fbar { height: 14px; background: var(--accent); border-radius: 3px; min-width: 3px; transition: width .3s; }
.table td.bar { width: 34%; padding-right: 24px; }
.src { font-size: 10px; padding: 1px 7px; border-radius: 9px; color: var(--on); background: var(--text-3); vertical-align: middle; margin-left: 6px; }
.src.meta { background: var(--accent); } .src.ghl { background: var(--warn); } .src.sol { background: var(--brand); }
.modal-bg { position: fixed; inset: 0; background: rgba(42,30,32,.35); z-index: 30; display: grid; place-items: center; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; width: min(420px, 92vw); box-shadow: 0 12px 40px rgba(0,0,0,.2); }
.modal .opts { display: grid; gap: 6px; margin: 14px 0; }
.modal .opts button { text-align: left; border: 1px solid var(--border); background: var(--sunken); border-radius: 8px; padding: 9px 12px; font: 500 13px Inter, sans-serif; color: var(--text); cursor: pointer; }
.modal .opts button:hover, .modal .opts button.on { border-color: var(--accent); background: #E6EEF2; }

/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--sunken); border-radius: 12px; padding: 10px; min-height: 300px; }
.col h3 { padding: 2px 6px 10px; display: flex; justify-content: space-between; }
.col h3 span { color: var(--muted); font-weight: 400; }
.lead { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.leadrow { display: flex; justify-content: space-between; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border-sub); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.leadrow:hover { border-color: var(--border); }
.leadrow-right { text-align: right; flex: none; max-width: 46%; }
@media (max-width: 760px) { .leadrow { flex-direction: column; align-items: stretch; } .leadrow-right { text-align: left; max-width: none; } }
.lead:hover { border-color: var(--accent); }
.lead .name { font-weight: 600; }
.lead .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 4px; }

/* drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(42,30,32,.35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--surface); border-left: 1px solid var(--border); z-index: 21; overflow-y: auto; padding: 22px 24px; }
.drawer h2 { margin-bottom: 4px; }
.drawer .x { position: absolute; top: 14px; right: 16px; }
.burger, .only-sm { display: none; }
.builder-frame { margin: -28px -32px -60px; height: 100vh; }
.stagetabs { display: none; }
@media (max-width: 760px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top)); z-index: 15; }
  .sidebar .wordmark { padding: 0; font-size: 20px; }
  .sidebar .menu { display: none; }
  .sidebar.open .menu { display: flex; flex-direction: column; gap: 2px; position: absolute; top: 100%; left: 0; right: 0; background: var(--brand); padding: 8px 14px 16px; box-shadow: 0 12px 24px rgba(0,0,0,.25); max-height: calc(100dvh - 60px); overflow-y: auto; }
  .sidebar .menu a { font-size: 16px; padding: 12px 10px; }
  .sidebar .foot { margin-top: 10px; }
  .burger { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 10px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: var(--on); font-size: 20px; cursor: pointer; }
  .only-sm { display: initial; }
  .hide-sm { display: none !important; }
  .main { padding: 14px 12px 40px; }
  .pagehead { flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .pagehead h1 { font-size: 26px; }
  .kv { grid-template-columns: 108px 1fr; }
  .cardbody { overflow-x: auto; }
  .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
  /* leads board: one stage per screen, swipe sideways, scroll inside the stage, stage title stays on top */
  .stagetabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .stagetabs::-webkit-scrollbar { display: none; }
  .stagetabs button { flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 6px 12px; font: 500 13px Inter, sans-serif; }
  .stagetabs button.on { background: var(--accent); border-color: var(--accent); color: var(--on); font-weight: 600; }
  .board { grid-auto-columns: calc(100vw - 24px); gap: 12px; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; height: calc(100dvh - 190px); padding-bottom: 0; scrollbar-width: none; }
  .board::-webkit-scrollbar { display: none; }
  .col { scroll-snap-align: start; overflow-y: auto; min-height: 0; height: 100%; padding-top: 0; -webkit-overflow-scrolling: touch; }
  .col h3 { position: sticky; top: 0; z-index: 2; background: var(--sunken); margin: 0 -10px 8px; padding: 14px 16px 10px; font-size: 16px; border-bottom: 1px solid var(--border-sub); }
  .drawer { width: 100vw; padding: 0 16px 40px; border-left: none; }
  .drawer .drawer-top { position: sticky; top: 0; background: var(--surface); z-index: 3; margin: 0 -16px 8px; padding: calc(14px + env(safe-area-inset-top)) 60px 10px 16px; border-bottom: 1px solid var(--border-sub); }
  .drawer .x { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 4; width: 40px; height: 40px; }
  .drawer h2 { font-size: 20px; }
  /* nothing may push the page wider than the phone */
  body { overflow-x: clip; }
  .builder-frame { margin: -14px -12px -40px; height: calc(100dvh - 62px); }
  .main .grid2, .main .grid3 { grid-template-columns: minmax(0, 1fr); }
  .grid2 > *, .grid3 > *, .stack > * { min-width: 0; }
  .row { flex-wrap: wrap; }
  .card .cardhead { flex-wrap: wrap; }
  .card, .cardbody { overflow-wrap: anywhere; }
  input, select, textarea { max-width: 100%; }
  /* engagement stepper: a strip you can swipe, current stage scrolled into view */
  .stepper { overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; scroll-snap-type: x proximity; }
  .stepper::-webkit-scrollbar { display: none; }
  .step { flex: none; min-width: 96px; font-size: 12px; scroll-snap-align: start; }
  .pagehead > div:last-child { flex-wrap: wrap; }
}

/* feed */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-sub); font-size: 12px; }
.feed li:last-child { border-bottom: none; }
.feed .when { color: var(--muted); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--on); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.toast.error { background: var(--danger); }

/* docx preview */
.docx { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 32px 40px; max-height: 70vh; overflow-y: auto; font-family: "Times New Roman", serif; color: #111; }
.docx p { margin: 0 0 8px; }
.docx table { border-collapse: collapse; }
.docx td { border: 1px solid #ccc; padding: 4px 6px; }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; background: var(--brand); color: var(--on); }
.login .box { width: 380px; }
.login h1 { color: var(--on); font-size: 34px; }
.login p { opacity: .8; }
.login input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.08); color: var(--on); font: inherit; }
.login .btn.primary { width: 100%; margin-top: 10px; padding: 11px; font-size: 14px; }

@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(30px); opacity: 0; } } }
@media (max-width: 800px) { .sidebar.portal-nav { display: none; } }

</style>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

</head>

<script type="text/babel" data-type="module" data-presets="react">
// =====================================================================
// SOLONOS — single-file app. Only two things you ever change here:
const SUPABASE_URL = "https://uirbiqfkgnfnfugfclmu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hrhOfXXHVMivsY0rritFKQ_WhQE2TIl";
const TURNSTILE_SITE_KEY = "0x4AAAAAAEybfN1dVcW9utbF";   // Cloudflare Turnstile (empty = no captcha)
const APP_VERSION = "3.26";   // major = big build, minor = small change; shown bottom-left
// =====================================================================

import React, { Fragment, createContext, useCallback, useContext, useEffect, useRef, useState } from "https://esm.sh/react@18.3.1";
import ReactDOM from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
import { BrowserRouter, NavLink, Navigate, Route, Routes, useNavigate, useParams, useLocation, Link } from "https://esm.sh/react-router-dom@6.26.2?deps=react@18.3.1,react-dom@18.3.1";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

// ===================== lib/stages.js =====================
// Engagement stages in order, with what the trainee sees and what unlocks the next one.
const ENGAGEMENT_STAGES = [
  { key: "nda_pending",     label: "Invited",            next: "docs_pending",     nextLabel: "Move to documents", gate: "NDA signed on the portal (moves on its own)" },
  { key: "docs_pending",    label: "Documents pending",  next: "review_pending",   nextLabel: "Move to review",    gate: "every required document uploaded (moves on its own)" },
  { key: "review_pending",  label: "Documents in",       next: "proposal",         nextLabel: "Move to proposal",  gate: "nothing; use this when you're preparing the letter" },
  { key: "proposal",        label: "Letter sent",        next: "engaged",          nextLabel: "Move to engaged",   gate: "engagement letter signed and fee set (moves on its own)" },
  { key: "engaged",         label: "Engaged",            next: "valuation_active", nextLabel: "Start valuation",   gate: "Invoice 1 paid and €1,000 deposit received" },
  { key: "valuation_active",label: "Valuation active",   next: null },
  { key: "completed",       label: "Completed",          next: null },
  { key: "declined",        label: "Declined",           next: null },
  { key: "deposit_pending", label: "Not sent",           next: "nda_pending",      nextLabel: "Mark as sent", gate: "" },
];
const stageIndex = (key) => ENGAGEMENT_STAGES.findIndex((s) => s.key === key);
const stageLabel = (key) => ENGAGEMENT_STAGES.find((s) => s.key === key)?.label ?? key;
const LIVE_STAGES = ["deposit_pending","nda_pending","docs_pending","review_pending","proposal","engaged","valuation_active"];

const APPROACHES = [
  { key: "dcf", label: "Income approach (DCF)" },
  { key: "cca", label: "Market approach: comparable companies" },
  { key: "pt",  label: "Market approach: precedent transactions" },
  { key: "nav", label: "Asset-based approach (NAV)" },
];

const INVOICE_NAMES = { 0: "Deposit (€1,000)", 1: "Invoice 1 (on signing)", 2: "Invoice 2 (before final report)" };
const invoiceName = (i) => i.description || INVOICE_NAMES[i.seq] || `Invoice ${i.seq}`;
/** Engagement types (same list as the OneDrive project folders). Valuations keep the full funnel flow; the rest are simple. */
const ENG_TYPES = [["valuation", "Business Valuation"], ["sell_side", "Sell-side M&A"]];
/** The client-facing process for each type of engagement. Kyriacos moves the project along; the client sees where it is. */
const PROCESS = {
  valuation: ["Engagement", "Your documents", "Valuation draft", "Review", "Completion"],
  sell_side: ["Value and prepare", "Go to market", "Offers", "Negotiate and complete"],
  default: ["Engagement", "Your documents", "Work in progress", "Review", "Completion"],
};
const processFor = (t) => PROCESS[t || "valuation"] ?? PROCESS.default;
const typeLabel = (t) => ENG_TYPES.find(([k]) => k === (t || "valuation"))?.[1] ?? "Project";
const isSimple = (e) => (e?.engagement_type || "valuation") !== "valuation";
/** Stage shown for an engagement: valuations use the funnel stages; simple engagements are Open, Project active, Completed or Declined. */
const engStageLabel = (e) => !isSimple(e) ? stageLabel(e.stage) : e.stage === "valuation_active" ? "In progress" : e.stage === "completed" ? "Completed" : e.stage === "declined" ? "Did not go ahead" : "Open";

const PORTAL_URL = window.location.origin + "/portal";

const eur = (n) => new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(Number(n || 0));
const money = (n, ccy = "EUR") => new Intl.NumberFormat("en-IE", { style: "currency", currency: ccy, maximumFractionDigits: 2 }).format(Number(n || 0));
const day = (d) => (d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "");
/** "Mon 21 Sept, 14:00" in the viewer's own time zone; with full=true also the year. */
const callWhen = (iso, full = false) => {
  const d = new Date(iso);
  const date = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", ...(full ? { year: "numeric" } : {}) });
  const time = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  return `${date}, ${time}`;
};
const ago = (d) => {
  if (!d) return "";
  const h = (Date.now() - new Date(d).getTime()) / 36e5;
  if (h < 1) return "just now";
  if (h < 24) return `${Math.floor(h)}h ago`;
  const days = Math.floor(h / 24);
  return days === 1 ? "yesterday" : `${days}d ago`;
};

// ===================== lib/supabase.js =====================
const url = SUPABASE_URL;
const key = SUPABASE_ANON_KEY;
const configured = Boolean(url && key);
const supabase = configured ? createClient(url, key, { auth: { flowType: "implicit", detectSessionInUrl: true } }) : null;

/** Call a Postgres function and turn its error into a plain message the UI can show. */
async function rpc(fn, args) {
  const { data, error } = await supabase.rpc(fn, args);
  if (error) throw new Error(cleanError(error.message));
  return data;
}

/** Sign out that always works: clear the browser session first, then reload to the right start page. */
async function logout(to) {
  try { await supabase.auth.signOut({ scope: "local" }); } catch (_) {}
  try { await supabase.auth.signOut(); } catch (_) {}
  window.location.href = to ?? (window.location.pathname.startsWith("/portal") ? "/portal" : "/");
}

/** "Gate: NDA not signed" instead of Postgres noise. */
function cleanError(msg = "") {
  return msg.replace(/^.*?(Gate:|Cannot|Staff only|Not your|Typed name|Signer email)/, "$1").trim() || "Something went wrong";
}

const ToastCtx = createContext(() => {});
function ToastProvider({ children }) {
  const [t, setT] = useState(null);
  const show = useCallback((msg, kind = "ok") => {
    setT({ msg, kind });
    setTimeout(() => setT(null), kind === "error" ? 5000 : 2600);
  }, []);
  return (
    <ToastCtx.Provider value={show}>
      {children}
      {t && <div className={`toast ${t.kind}`}>{t.msg}</div>}
    </ToastCtx.Provider>
  );
}
const useToast = () => useContext(ToastCtx);

/** Run an async action; show its error as a toast; return true on success. */
function useAction() {
  const toast = useToast();
  const [busy, setBusy] = useState(false);
  const run = useCallback(async (fn, okMsg) => {
    setBusy(true);
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) { toast(e.message, "error"); return false; }
    finally { setBusy(false); }
  }, [toast]);
  return [run, busy];
}

function Drawer({ title, sub, onClose, children }) {
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";          // page behind stays put, the drawer scrolls
    return () => { window.removeEventListener("keydown", k); document.body.style.overflow = prev; };
  }, [onClose]);
  return (
    <>
      <div className="drawer-bg" onClick={onClose} />
      <aside className="drawer" role="dialog" aria-label={title}>
        <button className="btn x" onClick={onClose} aria-label="Close">✕</button>
        <div className="drawer-top">
          <h2>{title}</h2>
          {sub && <p className="muted small" style={{ margin: 0 }}>{sub}</p>}
        </div>
        {children}
      </aside>
    </>
  );
}

function Field({ label, children }) {
  return <div className="field"><label>{label}</label>{children}</div>;
}

function Chip({ kind, children, title }) {
  return <span className={`chip ${kind ?? ""}`} title={title}>{children}</span>;
}

function Empty({ title, children }) {

/** A Card, or (bare) a titled block inside another card. */
function Section({ bare, title, right, children }) {
  if (!bare) return <Card title={title} right={right}>{children}</Card>;
  return <div style={{ paddingTop: 4 }}><div className="row between" style={{ marginBottom: 8 }}><h3 style={{ margin: 0 }}>{title}</h3>{right}</div>{children}</div>;

// ===================== captcha (Cloudflare Turnstile) =====================
const captchaOn = () => TURNSTILE_SITE_KEY && !TURNSTILE_SITE_KEY.startsWith("PASTE");
function Captcha({ onToken }) {
  const ref = React.useRef(null);
  const idRef = React.useRef(null);
  useEffect(() => {
    if (!captchaOn()) return;
    let tries = 0;
    const t = setInterval(() => {
      if (window.turnstile && ref.current && idRef.current === null) {
        idRef.current = window.turnstile.render(ref.current, { sitekey: TURNSTILE_SITE_KEY, theme: "light", callback: onToken, "expired-callback": () => onToken(null), "error-callback": () => onToken(null) });
        clearInterval(t);
      } else if (++tries > 100) clearInterval(t);
    }, 100);
    return () => { clearInterval(t); if (idRef.current !== null && window.turnstile) { try { window.turnstile.remove(idRef.current); } catch (_) {} } };
  }, []);
  if (!captchaOn()) return null;
  return <div ref={ref} style={{ margin: "10px 0" }} />;
}
const resetCaptcha = () => { try { window.turnstile && window.turnstile.reset(); } catch (_) {} };

function Login() {
  const nav = useNavigate();
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [mode, setMode] = useState("password");   // password | link | reset
  const [sent, setSent] = useState(false);
  const [code, setCode] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [captcha, setCaptcha] = useState(null);

  async function submit(e) {
    e.preventDefault();
    if (captchaOn() && !captcha) { setErr("Please tick the \"I'm not a robot\" box."); return; }
    setBusy(true); setErr("");
    let error;
    if (mode === "password") {
      ({ error } = await supabase.auth.signInWithPassword({ email, password, options: { captchaToken: captcha } }));
      if (error) setErr(error.message === "Invalid login credentials" ? "Wrong email or password." : error.message);
    } else if (mode === "link") {
      ({ error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.origin + "/", captchaToken: captcha } }));
      if (error) setErr(error.message); else setSent(true);
    } else {
      ({ error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + "/reset", captchaToken: captcha }));
      if (error) setErr(error.message); else setSent(true);
    }
    setBusy(false);
    if (error) { setCaptcha(null); resetCaptcha(); }
  }
  async function verify(e) {
    e.preventDefault(); setBusy(true); setErr("");
    const { error } = await supabase.auth.verifyOtp({ email, token: code.trim(), type: mode === "reset" ? "recovery" : "email" });
    setBusy(false);
    if (error) setErr("That code didn't work.");
    else if (mode === "reset") nav("/reset");
  }
  const sw = (m) => (x) => { x.preventDefault(); setMode(m); setErr(""); setSent(false); setCode(""); };

  return (
    <div className="login">
      <form className="box" onSubmit={sent ? verify : submit}>
        <h1>Solonos</h1>
        {sent ? (
          <>
            <p>Check {email}: click the button in the email, or type the code here.{mode === "reset" && " You'll then choose a new password."}</p>
            <input inputMode="numeric" maxLength={10} placeholder="Code from the email" value={code} onChange={(e) => setCode(e.target.value)} style={{ letterSpacing: 6, fontSize: 20, textAlign: "center" }} />
            {err && <p className="err">{err}</p>}
            <button className="btn primary" disabled={busy || code.trim().length < 6}>{busy ? "Checking…" : "Continue"}</button>
          </>
        ) : (
          <>
            <p>{mode === "password" ? "Sign in with your email and password." : mode === "link" ? "Get a one-time sign-in link and code by email." : "We'll email you a link and code to choose a new password."}</p>
            <input type="email" required placeholder="you@consortiaadvisory.com" value={email} onChange={(e) => setEmail(e.target.value)} />
            {mode === "password" && (
              <input type="password" required placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} style={{ marginTop: 8 }} />
            )}
            <Captcha onToken={setCaptcha} />
            {err && <p className="err">{err}</p>}
            <button className="btn primary" disabled={busy}>{busy ? "Working…" : mode === "password" ? "Sign in" : mode === "link" ? "Email me a link" : "Reset my password"}</button>
            <p style={{ marginTop: 14, fontSize: 13, display: "flex", gap: 14, justifyContent: "center" }}>
              {mode !== "password" && <a href="#" style={{ color: "var(--on)", opacity: .85 }} onClick={sw("password")}>Sign in with password</a>}
              {mode !== "reset" && <a href="#" style={{ color: "var(--on)", opacity: .85 }} onClick={sw("reset")}>Forgot password?</a>}
              {mode !== "link" && <a href="#" style={{ color: "var(--on)", opacity: .85 }} onClick={sw("link")}>Email me a link</a>}
            </p>
          </>
        )}
      </form>
    </div>
  );
}

/** /reset — where the password-reset link and code land. Choose a new password, then straight into the app. */
function ResetPassword() {
  const nav = useNavigate();
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  async function save(e) {
    e.preventDefault();
    if (pw.length < 8) return setErr("At least 8 characters.");
    if (pw !== pw2) return setErr("The two passwords don't match.");
    setBusy(true); setErr("");
    const { error } = await supabase.auth.updateUser({ password: pw });
    setBusy(false);
    if (error) setErr(error.message); else nav("/app/leads");
  }
  return (
    <div className="login">
      <form className="box" onSubmit={save}>
        <h1>New password</h1>
        <p>Choose a password of at least 8 characters.</p>
        <input type="password" placeholder="New password" value={pw} onChange={(e) => setPw(e.target.value)} />
        <input type="password" placeholder="Repeat it" value={pw2} onChange={(e) => setPw2(e.target.value)} style={{ marginTop: 8 }} />
        {err && <p className="err">{err}</p>}
        <button className="btn primary" disabled={busy}>{busy ? "Saving…" : "Save password and sign in"}</button>
      </form>
    </div>
  );
}

// ===================== pages/Leads.jsx =====================
function Leads() {
  const [stages, setStages] = useState([]);
  const [leads, setLeads] = useState([]);
  const [engByOpp, setEngByOpp] = useState({});
  const [lastSync, setLastSync] = useState(null);
  const [open, setOpen] = useState(null);
  const [pendingLost, setPendingLost] = useState(null);   // { id, stageId } waiting for a reason
  const boardRef = useRef(null);
  const [activeCol, setActiveCol] = useState(0);
  const [layout, setLayout] = useState(null);   // { order: [keys], hidden: [keys] } from Settings
  const [fus, setFus] = useState([]);           // open follow-ups
  const [dueToday, setDueToday] = useState({}); // opportunity_id -> first task due today or overdue
  const [onlyDue, setOnlyDue] = useState(false);
  const [view, setView] = useState(() => { try { return localStorage.getItem("solonos.leadsView") || "list"; } catch (e) { return "list"; } });   // list | board
  const [q, setQ] = useState("");
  const toast = useToast();
  const pickView = (v) => { setView(v); try { localStorage.setItem("solonos.leadsView", v); } catch (e) { /* ignore */ } };
  const loc = useLocation();
  useEffect(() => { supabase.from("app_settings").select("value").eq("key", "leads_board").maybeSingle().then(({ data }) => setLayout(data?.value ?? null)); }, []);

  const load = useCallback(async () => {
    const [s, l, e, sy, fu, dt] = await Promise.all([
      supabase.from("pipeline_stages").select("*").order("position"),
      supabase.from("leads_list").select("*").order("ghl_updated_at", { ascending: false }),
      supabase.from("engagements").select("id, opportunity_id, stage").not("opportunity_id", "is", null),
      supabase.from("sync_log").select("received_at, ok, kind").eq("ok", true).order("id", { ascending: false }).limit(1).maybeSingle(),
      supabase.from("followups").select("*").in("status", ["active", "checkin", "quiet"]).not("opportunity_id", "is", null),
      supabase.from("tasks_board").select("id, opportunity_id, kind, channel, due_on, due_time, step, steps_total, followup_id").not("opportunity_id", "is", null).lte("due_on", new Date().toISOString().slice(0, 10)).order("due_on"),
    ]);
    setStages(s.data ?? []);
    setLeads(l.data ?? []);
    setFus(fu.data ?? []);
    const d = {}; for (const t of dt.data ?? []) if (!d[t.opportunity_id]) d[t.opportunity_id] = t; setDueToday(d);
    setEngByOpp(Object.fromEntries((e.data ?? []).map((x) => [x.opportunity_id, x])));
    setLastSync(sy.data);
  }, []);

  useEffect(() => { load(); }, [load]);
  const [run, moving] = useAction();
  useEffect(() => {
    const q = new URLSearchParams(loc.search), id = q.get("open");
    if (id && leads.length) { const l = leads.find((x) => x.ghl_id === id); if (l) setOpen({ ...l, _convert: q.get("convert") === "1" }); }
  }, [loc.search, leads]);
  // keep the open drawer in step with fresh data
  useEffect(() => { if (open) { const l = leads.find((x) => x.ghl_id === open.ghl_id); if (l && l !== open) setOpen({ ...l, _convert: open._convert }); } }, [leads]);  // eslint-disable-line react-hooks/exhaustive-deps
  const fuByOpp = Object.fromEntries(fus.map((f) => [f.opportunity_id, f]));
  const fuOf = (l) => fuByOpp[l.ghl_id];

  if (stages.length === 0) return (
    <>
      <Head lastSync={lastSync} reload={load} />
      <Empty title="No pipeline yet">
        Run the first GHL pull (README step 2) and the stages appear here, in the same order as GHL.
      </Empty>
    </>
  );

  const engOf = (l) => engByOpp[l.ghl_id];
  const SENT = ["nda_pending","docs_pending","review_pending","proposal"], ENGAGED = ["engaged","valuation_active","completed"];
  const inGhl = leads.filter((l) => !engOf(l) || engOf(l).stage === "deposit_pending" || engOf(l).stage === "declined");
  const firstWithLeads = Math.min(...stages.filter((st) => inGhl.some((l) => l.stage_id === st.ghl_id)).map((st) => st.position), Infinity);
  const shownStages = stages.filter((st) => st.position >= firstWithLeads);
  const moveTo = (ghlId, stageId) => run(async () => {
    const lead = leads.find((x) => x.ghl_id === ghlId);
    const from = stages.find((x) => x.ghl_id === lead?.stage_id), to = stages.find((x) => x.ghl_id === stageId);
    const { data, error } = await supabase.functions.invoke("ghl-sync", { body: { action: "move", opportunity_id: ghlId, stage_id: stageId } });
    if (error) throw new Error((await error.context?.json?.().catch(() => null))?.error ?? error.message);
    if (data?.ok === false) throw new Error(data.error);
    // Free Call Booked -> Free Call Showed: the Buyer Discount Scorecard goes out by email, same wording for everyone
    if (lead && /booked/i.test(from?.name ?? "") && /showed/i.test(to?.name ?? "")) {
      try { await sendScorecard(lead); toast(`Moved in GHL. Scorecard emailed to ${lead.email}`); }
      catch (e) { toast(`Moved in GHL, but the scorecard email failed: ${e.message}`, "error"); }
    } else toast("Moved in GHL");
    await load();
  });
  const isLostStage = (st) => /^lost/i.test(st?.name ?? "");
  const dropTo = (id, stageId) => {
    const st = stages.find((x) => x.ghl_id === stageId);
    if (isLostStage(st)) setPendingLost({ id, stageId });      // ask why first
    else moveTo(id, stageId);
  };
  const lostWithReason = async (reason) => {
    const { id, stageId, after } = pendingLost; setPendingLost(null);
    const ok = await moveTo(id, stageId);
    if (ok && reason) await run(() => rpc("set_lost_reason", { p_opportunity_id: id, p_reason: reason }).then(load));
    if (ok && after) await after();
  };
  const col = (title, rows, stageId) => (
    <div className="col" key={title} style={{ opacity: moving ? .7 : 1 }}
      onDragOver={(ev) => { if (stageId) { ev.preventDefault(); ev.dataTransfer.dropEffect = "move"; } }}
      onDrop={(ev) => { if (!stageId) return; ev.preventDefault(); const id = ev.dataTransfer.getData("text/plain"); if (id) dropTo(id, stageId); }}>
      <h3>{title}<span>{rows.length}</span></h3>
      {rows.map((l) => <LeadCard key={l.ghl_id} l={l} eng={engOf(l)} fu={fuOf(l)} due={dueToday[l.ghl_id]} onOpen={() => setOpen(l)} draggable={!!stageId} />)}
    </div>
  );
  const allCols = [
    ...shownStages.map((st) => ({ key: st.ghl_id, title: st.name, rows: inGhl.filter((l) => l.stage_id === st.ghl_id), stageId: st.ghl_id })),
    { key: "__invited", title: "Invited", rows: leads.filter((l) => engOf(l) && SENT.includes(engOf(l).stage)) },
    { key: "__engaged", title: "Engaged", rows: leads.filter((l) => engOf(l) && ENGAGED.includes(engOf(l).stage)) },
  ];
  const matchesQ = (l) => { const t = q.trim().toLowerCase(); if (!t) return true; const hay = [l.name, l.first_name, l.last_name, l.email, l.phone, l.company, l.stage_name, l.country, l.source, l.lost_reason, engOf(l) ? stageLabel(engOf(l).stage) : "", typeof l.custom === "object" ? JSON.stringify(l.custom) : l.custom].filter(Boolean).join(" ").toLowerCase(); return t.split(/\s+/).every((w) => hay.includes(w)); };
  const cols = applyBoardLayout(allCols, layout).map((c) => ({ ...c, rows: c.rows.filter((l) => (!onlyDue || dueToday[l.ghl_id]) && matchesQ(l)) }));
  const dueCount = leads.filter((l) => dueToday[l.ghl_id]).length;
  const colNames = cols.map((c) => [c.title, c.rows.length]);
  const goCol = (i) => { const c = boardRef.current?.children[i]; if (c) boardRef.current.scrollTo({ left: c.offsetLeft - boardRef.current.offsetLeft, behavior: "smooth" }); };
  const onBoardScroll = () => {
    const b = boardRef.current; if (!b || !b.children.length) return;
    const w = b.children[0].getBoundingClientRect().width + 12;
    const i = Math.round(b.scrollLeft / w);
    if (i !== activeCol) setActiveCol(i);
  };
  return (
    <>
      <Head lastSync={lastSync} count={leads.length} reload={load} />
      <div className="row between" style={{ marginBottom: 8, flexWrap: "wrap", gap: 8 }}>
        <div className="row" style={{ gap: 6, flex: 1, minWidth: 220 }}>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search name, company, email, phone, stage…" style={{ flex: 1, maxWidth: 420, padding: "8px 10px", borderRadius: 8, border: "1px solid var(--border)", font: "inherit" }} />
          {q && <button className="btn" onClick={() => setQ("")}>Clear</button>}
          <button className={`btn${onlyDue ? " primary" : ""}`} onClick={() => setOnlyDue((v) => !v)}>Due today · {dueCount}</button>
          {onlyDue && <span className="muted small hide-sm">Only leads with a touch due today or overdue</span>}
        </div>
        <div className="row" style={{ gap: 0 }}>
          <button className={`btn${view === "list" ? " primary" : ""}`} style={{ borderRadius: "8px 0 0 8px" }} onClick={() => pickView("list")}>List</button>
          <button className={`btn${view === "board" ? " primary" : ""}`} style={{ borderRadius: "0 8px 8px 0" }} onClick={() => pickView("board")}>Board</button>
        </div>
      </div>
      {view === "list" && <LeadsList rows={(onlyDue ? leads.filter((l) => dueToday[l.ghl_id]) : leads).filter(matchesQ)} engOf={engOf} onOpen={setOpen} />}
      {view === "board" && <>
      <div className="stagetabs">
        {colNames.map(([n, c], i) => <button key={n} className={i === activeCol ? "on" : ""} onClick={() => goCol(i)}>{n} · {c}</button>)}
      </div>
      <div className="board" ref={boardRef} onScroll={onBoardScroll}>
        {cols.map((c) => col(c.title, c.rows, c.stageId))}
      </div>
      </>}
      {open && <LeadDrawer lead={open} engagement={engByOpp[open.ghl_id]} onClose={() => setOpen(null)} reload={load} fu={fuOf(open)}
        stages={shownStages} onMove={(stageId) => { const id = open.ghl_id; setOpen(null); dropTo(id, stageId); }} />}
      {pendingLost && <LostReasonDialog onPick={lostWithReason} onCancel={() => setPendingLost(null)} />}
    </>
  );
}

const LOST_REASONS = ["No reply", "Not selling now", "No-show", "Price", "Chose another firm", "Already has another broker", "Not a fit"];

/** The Buyer Discount Scorecard PDF goes to the lead the moment they move to Free Call Showed. Wording: Settings > Email templates. */
async function sendScorecard(lead) {
  if (!lead.email) throw new Error("this lead has no email address");
  const tpl = (await loadTemplates()).scorecard ?? DEFAULT_TEMPLATES.scorecard;
  const v = { first: lead.first_name || lead.name.split("|")[0].trim().split(" ")[0], company: lead.company || "your business" };
  const res = await fetch(`/Buyer-Discount-Scorecard.pdf?v=${APP_VERSION}`);
  if (!res.ok) throw new Error("the scorecard PDF is missing from the site");
  const blob = await res.blob();
  const b64 = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => bad(new Error("could not read the PDF")); r.readAsDataURL(blob); });
  await callFn("send-email", { to: lead.email, subject: fillTpl(tpl.subject, v), html: mailShell(textToHtml(fillTpl(tpl.text, v))), attachment: { filename: "Buyer Discount Scorecard.pdf", contentBase64: b64, contentType: "application/pdf" } });
  const { data: me } = await supabase.auth.getUser();
  await supabase.from("lead_notes").insert({ opportunity_id: lead.ghl_id, body: `Buyer Discount Scorecard emailed to ${lead.email}`, author: me?.user?.email ?? "staff" });
  try { await supabase.functions.invoke("ghl-sync", { body: { action: "note", opportunity_id: lead.ghl_id, body: `Solonos: Buyer Discount Scorecard emailed to ${lead.email}` } }); } catch (e) { /* best effort */ }
}

const BUCKETS = [["overdue", "Overdue"], ["today", "Due today"], ["none", "No next step"], ["future", "Coming up"], ["parked", "Parked (90-day list / quiet)"], ["closed", "Closed or in engagement"]];
/** The Leads list: one row per open lead, sorted by what needs doing. Tap a row to open the lead. */
function LeadsList({ rows, engOf, onOpen }) {
  const [showClosed, setShowClosed] = useState(false);
  // leads that are lost, won, disqualified or already engaged do not need a next step
  const bucketOf = (l) => { const eng = engOf?.(l); if (l.bucket === "overdue" || l.bucket === "today" || l.bucket === "future") return l.bucket; if (/^(lost|won|disqualif)/i.test(l.stage_name ?? "") || (eng && !["deposit_pending"].includes(eng.stage))) return "closed"; return l.bucket ?? "none"; };
  const sorted = [...rows].sort((a, b) => (a.bucket_order - b.bucket_order) || String(a.due_on ?? "9").localeCompare(String(b.due_on ?? "9")) || String(a.due_time ?? "").localeCompare(String(b.due_time ?? "")) || (b.days_since_touch ?? 0) - (a.days_since_touch ?? 0));
  const groups = BUCKETS.map(([k, label]) => [k, label, sorted.filter((l) => bucketOf(l) === k)]).filter(([, , r]) => r.length);
  const edge = (k) => k === "overdue" || k === "none" ? "var(--danger)" : k === "today" ? "var(--accent)" : k === "parked" || k === "closed" ? "var(--border-sub)" : "var(--border)";
  const next = (l) => {
    if (!l.task_id) return <span className="muted">No next step</span>;
    const what = l.task_channel === "checkin" ? (l.followup_status === "quiet" ? "Quiet check-in" : "90-day check-in") : actionWord({ kind: l.task_kind, channel: l.task_channel });
    const tag = l.followup_id && l.step > 0 ? ` · touch ${l.step} of ${l.steps_total} ${FU_KIND_LABEL[l.followup_kind] ?? ""}` : l.followup_id ? "" : ` · ${l.task_title}`;
    return <><b>{what}</b><span className="muted small">{tag}</span></>;
  };
  if (!rows.length) return <Empty title="No leads">Nothing to show.</Empty>;
  return (
    <div>
      {groups.map(([k, label, r]) => (
        <div key={k} style={{ marginBottom: 16 }}>
          <h3 style={{ margin: "0 0 6px", color: k === "overdue" ? "var(--danger)" : "inherit" }}>{label} <span className="muted small" style={{ fontWeight: 400 }}>{r.length}</span>{k === "closed" && <button className="btn" style={{ marginLeft: 10 }} onClick={() => setShowClosed((v) => !v)}>{showClosed ? "Hide" : "Show"}</button>}</h3>
          {k === "closed" && !showClosed ? null : <div className="stack" style={{ gap: 6 }}>
            {r.map((l) => {
              const eng = engOf?.(l);
              return (
                <div key={l.ghl_id} className="leadrow" onClick={() => onOpen(l)} style={{ borderLeft: `4px solid ${edge(k)}` }}>
                  <div style={{ minWidth: 0 }}>
                    <div className="row" style={{ gap: 8, alignItems: "baseline", flexWrap: "wrap" }}>
                      <span style={{ fontWeight: 700 }}>{l.name.split("|")[0].trim()}</span>
                      <span className="muted small">{l.company || [l.first_name, l.last_name].filter(Boolean).join(" ")}</span>
                    </div>
                    <div className="row" style={{ gap: 6, marginTop: 4, flexWrap: "wrap" }}>
                      {eng ? <Chip kind={eng.stage === "declined" ? "danger" : "accent"}>{stageLabel(eng.stage)}</Chip> : l.stage_name && <Chip>{l.stage_name}</Chip>}
                      {l.call_at && !isNoShow(l) && <Chip kind={new Date(l.call_at) >= new Date() ? "ok" : ""}>{callWhen(l.call_at)}</Chip>}
                      {isNoShow(l) && !l.followup_id && <Chip kind="danger">No-show</Chip>}
                      {l.builders > 0 && <Chip kind="brand">Builder sent</Chip>}
                    </div>
                  </div>
                  <div className="leadrow-right">
                    <div className="small">{next(l)}</div>
                    <div className="muted small">
                      {l.due_on ? <span style={{ color: k === "overdue" ? "var(--danger)" : "inherit", fontWeight: k === "overdue" || k === "today" ? 600 : 400 }}>{dueWord(l.due_on)}{l.due_time ? ` ${String(l.due_time).slice(0, 5)}` : ""}</span> : null}
                      {l.days_since_touch != null && <span>{l.due_on ? " · " : ""}last touch {l.days_since_touch === 0 ? "today" : `${l.days_since_touch}d ago`}</span>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>}
        </div>
      ))}
    </div>
  );
}

/** Asked once when a lead is dragged to Lost / Not Now. The reason feeds the "Why lost" column on Reports. */

/** Notes log: many per lead/engagement, each with its date, add or edit any time. Lead notes follow the lead into the engagement. */
function NotesLog({ opportunityId, engagementId, title = "My notes" }) {
  const [run, busy] = useAction();
  const [notes, setNotes] = useState([]);
  const [draft, setDraft] = useState("");
  const [editing, setEditing] = useState(null);   // { id, body }
  const load = useCallback(async () => {
    let qy = supabase.from("lead_notes").select("*").order("created_at");
    qy = engagementId ? qy.or(`engagement_id.eq.${engagementId}${opportunityId ? `,opportunity_id.eq.${opportunityId}` : ""}`) : qy.eq("opportunity_id", opportunityId);
    const { data } = await qy;
    const seen = new Set(); setNotes((data ?? []).filter((n) => !seen.has(n.id) && seen.add(n.id)));
  }, [opportunityId, engagementId]);
  useEffect(() => { load(); }, [load]);
  const add = () => run(async () => {
    const { data: me } = await supabase.auth.getUser();
    const { error } = await supabase.from("lead_notes").insert({ opportunity_id: opportunityId ?? null, engagement_id: engagementId ?? null, body: draft.trim(), author: me?.user?.email ?? "staff" });
    if (error) throw new Error(error.message);
    setDraft(""); await load();
  }, "Note posted");
  const save = () => run(async () => {
    const { error } = await supabase.from("lead_notes").update({ body: editing.body.trim() }).eq("id", editing.id);
    if (error) throw new Error(error.message);
    setEditing(null); await load();
  }, "Note updated");
  const remove = (id) => run(async () => {
    if (!window.confirm("Delete this note?")) return;
    const { error } = await supabase.from("lead_notes").delete().eq("id", id);
    if (error) throw new Error(error.message);
    await load();
  });
  const box = { width: "100%", padding: 8, borderRadius: 8, border: "1px solid var(--border)", font: "inherit" };
  return (
    <div style={{ marginTop: 22 }}>
      <h3>{title}</h3>
      <div className="stack" style={{ gap: 8, margin: "8px 0" }}>
        {notes.length === 0 && <span className="muted small">No notes yet.</span>}
        {notes.map((n) => (
          <div key={n.id} className="card" style={{ padding: "10px 12px" }}>
            {editing?.id === n.id ? (
              <div className="stack">
                <textarea rows={3} value={editing.body} onChange={(x) => setEditing({ ...editing, body: x.target.value })} style={box} />
                <div className="row"><button className="btn primary" disabled={busy || !editing.body.trim()} onClick={save}>Save</button><button className="btn" onClick={() => setEditing(null)}>Cancel</button></div>
              </div>
            ) : (
              <>
                <div className="small" style={{ whiteSpace: "pre-wrap" }}>{n.body}</div>
                <div className="row between" style={{ marginTop: 6 }}>
                  <span className="muted small">{day(n.created_at)}{n.updated_at !== n.created_at ? " · edited" : ""}</span>
                  <span className="row"><button className="btn link small" onClick={() => setEditing({ id: n.id, body: n.body })}>Edit</button><button className="btn link small" onClick={() => remove(n.id)}>Delete</button></span>
                </div>
              </>
            )}
          </div>
        ))}
      </div>
      <textarea rows={3} value={draft} onChange={(x) => setDraft(x.target.value)} placeholder="Add a note: what they said, objections, what they want…" style={box} />
      <div className="row" style={{ marginTop: 6 }}><button className="btn primary" disabled={busy || !draft.trim()} onClick={add}>Post note</button></div>
    </div>
  );
}

/** Valuation Builder PDFs attached to a lead; they follow the lead into its engagement. */
// ===================== Tasks (everything is a task) =====================
const FU_KIND_LABEL = { call1: "after Call 1", call2: "after Call 2", valuation: "after the valuation", letter: "after the engagement letter", draft: "after the draft report", checkin: "90-day check-in" };
const FU_CHANNELS = [["email", "Email"], ["voicenote", "Voice note (WhatsApp)"], ["call", "Call"], ["whatsapp", "WhatsApp message"]];
/** Plain text -> paragraphs for the emails you write yourself. */
const textToHtml = (t) => { const esc = (x) => x.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); return String(t ?? "").replace(/\r/g, "").split(/\n{2,}/).map((pp) => `<p style="margin:0 0 12px">${esc(pp).replace(/\n/g, "<br>")}</p>`).join(""); };
const mailShell = (inner) => `<div style="font-family:Inter,Arial,sans-serif;max-width:560px;padding:28px 24px;color:#2A1E20;font-size:15px;line-height:1.55"><div style="font:600 20px Georgia,serif;color:#800020;margin-bottom:18px">Consortia Advisory</div>${inner}</div>`;
/** Saved email wording (Settings > Email templates). */
async function loadTemplates() { const { data } = await supabase.from("app_settings").select("value").eq("key", "email_templates").maybeSingle(); return data?.value ?? {}; }
async function saveTemplate(key, tpl) { const cur = await loadTemplates(); const { error } = await supabase.from("app_settings").upsert({ key: "email_templates", value: { ...cur, [key]: tpl }, updated_at: new Date().toISOString() }); if (error) throw new Error(error.message); }
const DEFAULT_TEMPLATES = {
  nda: { subject: "{company} - Non Disclosure Agreement", text: "Dear {first},\n\nThank you for our call. As discussed, attached is our Mutual Non-Disclosure Agreement so you can share your financial information with full confidentiality.\n\nPlease sign it and send it back by replying to this email. Once we have it, we will send you the next steps.\n\nKind regards,\nKyriacos\nUK-Qualified Chartered Accountant (ICAEW)\nConsortia Advisory" },
  scorecard: { subject: "It was a pleasure to meet you: your Buyer Discount Scorecard", text: "Dear {first},\n\nIt was a pleasure to meet you today. As promised, attached is your Buyer Discount Scorecard: the twenty points a buyer will look at when they price {company}, so you can see where you stand before anyone else does.\n\nGo through it at your own pace. Our proposal with the next steps will follow shortly.\n\nKind regards,\nKyriacos\nUK-Qualified Chartered Accountant (ICAEW)\nConsortia Advisory" },
  builder: { subject: "{company}: your Market Example Range", text: "Hi {first},\n\nThank you for the call today. Attached is the Market Example Range for {company}, built from the figures you gave me on the call.\n\nPlease read it as a market sample, not a valuation: it shows what buyers in your sector are paying today and where {company} would sit on standard assumptions.\n\nIf you would like to go ahead, reply to this email and I will send the engagement letter and the next steps the same day.\n\nKind regards,\nKyriacos\nUK-Qualified Chartered Accountant (ICAEW)\nConsortia Advisory" },
};
const fillTpl = (t, v) => String(t ?? "").replace(/\{(\w+)\}/g, (m, k) => (v[k] ?? m));
const unfill = (t, v) => { let x = String(t ?? ""); for (const [k, val] of Object.entries(v ?? {})) if (val && String(val).length > 1) x = x.split(String(val)).join(`{${k}}`); return x; };
const TASK_KINDS = [["call", "Call"], ["whatsapp", "WhatsApp"], ["voicenote", "Voice note"], ["email", "Email"], ["meeting", "Meeting"], ["other", "Other"]];
const taskKindLabel = (k) => (TASK_KINDS.find(([v]) => v === k) ?? [k, k])[1];
const isoToday = () => new Date().toISOString().slice(0, 10);
const addDaysIso = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysFromToday = (iso) => { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((new Date(iso + "T00:00:00") - t) / 86400000); };
const dueWord = (iso) => { const n = daysFromToday(iso); return n < 0 ? `${-n}d overdue` : n === 0 ? "today" : n === 1 ? "tomorrow" : new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); };
const digitsOf = (p) => String(p ?? "").replace(/[^0-9]/g, "");
const addWorkingDays = (d, n) => { const x = new Date(d); let k = 0; while (k < n) { x.setDate(x.getDate() + 1); if (x.getDay() !== 0 && x.getDay() !== 6) k++; } return x; };
const slotText = (d, h) => `${d.toLocaleDateString("en-GB", { weekday: "short" })} ${h}:00`;
const isNoShow = (l) => /noshow|no_show/i.test(l.call_status ?? "") && l.call_at && new Date(l.call_at) < new Date();
/** Fill {first} {company} {slot1} {slot2} {concern} {point} {booking}. */
function fuFill(text, who, extra = {}, seq, kind) {
  const first = who.first_name || String(who.who ?? who.name ?? "").split("|")[0].trim().split(" ")[0];
  const company = who.company || String(who.who ?? who.name ?? "").split("|")[0].trim();
  const d1 = addWorkingDays(new Date(), 1), d2 = addWorkingDays(new Date(), 2);
  const vals = { first, company, thing: seq?.things?.[kind] || "my last message", slot1: slotText(d1, 11), slot2: slotText(d2, 16), booking: seq?.booking || "[booking link]", concern: "[their concern]", point: "[one useful point]", ...extra };
  return String(text ?? "").replace(/\{(\w+)\}/g, (m, k) => (vals[k] ?? m));
}

/** Small chip on a lead card: "Follow-up 2/4 · Thu". */
function FollowupChip({ f, due }) {
  if (due) { const n = daysFromToday(due.due_on); return <Chip kind={n < 0 ? "danger" : "warn"}>{actionWord(due)} {n < 0 ? dueWord(due.due_on) : "today"}</Chip>; }
  if (!f) return null;
  const n = f.next_due ? daysFromToday(f.next_due) : 0;
  const kind = n < 0 ? "danger" : n === 0 ? "warn" : "";
  if (f.status === "checkin") return <Chip kind={kind}>Check-in {dueWord(f.next_due)}</Chip>;
  if (f.status === "quiet") return <Chip kind={kind}>Quiet · {dueWord(f.next_due)}</Chip>;
  return <Chip kind={kind}>Follow-up {f.step}/{f.steps_total ?? "?"} · {dueWord(f.next_due)}</Chip>;
}

/** One task line with its action buttons and Done. */
function TaskRow({ t, seq, reload, compact }) {
  const [run, busy] = useAction();
  const [ask, setAsk] = useState(false);

  const [msg, setMsg] = useState(null);
  const [back, setBack] = useState("");
  const [reason, setReason] = useState("");
  const [showMsg, setShowMsg] = useState(true);
  const isTouch = !!t.followup_id;
  const isCheckin = t.channel === "checkin";
  const chans = String(t.channel ?? "").split("+");
  const text = msg ?? fuFill(t.message, t, extra, seq, t.followup_kind);
  const subject = fuFill(t.subject ?? "", t, extra, seq, t.followup_kind);
  const needs = [...String(t.message ?? "").matchAll(/\{(concern|point)\}/g)].map((m) => m[1]);
  const n = daysFromToday(t.due_on);

  const digits = digitsOf(t.phone);
  const wa = (x) => `https://wa.me/${digits}?text=${encodeURIComponent(x)}`;
  const ghlNote = async (body) => { if (!t.opportunity_id) return; try { await supabase.functions.invoke("ghl-sync", { body: { action: "note", opportunity_id: t.opportunity_id, body } }); } catch (e) { /* best effort */ } };
  const [lostWhy, setLostWhy] = useState(null);    // null | "" | reason
  const finish = (outcome, note, checkBack) => run(async () => {
    await rpc("task_done", { p_task: t.id, p_outcome: outcome, p_note: note || null, p_check_back: checkBack || null });
    if (isTouch) await ghlNote(`Solonos: ${String(t.channel).replace("+", " + ")} · ${outcome.replace("_", " ")}${note ? " · " + note : ""}`);
    if (outcome === "lost" && t.opportunity_id) {
      // move the lead to Lost / Not Now in GHL and record why
      const { data: st } = await supabase.from("pipeline_stages").select("ghl_id").ilike("name", "lost%").order("position").limit(1).maybeSingle();
      if (st) { const { data: r } = await supabase.functions.invoke("ghl-sync", { body: { action: "move", opportunity_id: t.opportunity_id, stage_id: st.ghl_id } }); if (r && r.ok === false) throw new Error(r.error || "GHL move failed"); }
      if (note) await rpc("set_lost_reason", { p_opportunity_id: t.opportunity_id, p_reason: note });
    }
    setAsk(false); setLostWhy(null); await reload();
  }, outcome === "done" ? "Done" : outcome === "replied" ? "Closed: they replied" : outcome === "lost" ? "Moved to Lost" : "Logged");
  const sendMail = () => run(async () => {

      <div className="row between" style={{ gap: 10, alignItems: "flex-start" }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontWeight: 700 }}>{who} <Chip>{isCheckin ? "Check-in" : taskKindLabel(t.kind)}</Chip>{isTouch && !isCheckin && <span className="muted small"> · touch {t.step}/{t.steps_total} · {FU_KIND_LABEL[t.followup_kind]}</span>}</div>
          <div style={{ color: "var(--text-2)" }}>{t.title}{t.note && !isTouch ? ` · ${t.note}` : ""}</div>

        </div>
        <div className="row" style={{ flexWrap: "wrap", gap: 6, justifyContent: "flex-end" }}>
          {digits && (t.kind === "call" || chans.includes("call")) && <a className="btn" href={`tel:${t.phone}`}>Call</a>}
          {digits && (t.kind === "whatsapp" || chans.includes("whatsapp")) && <a className="btn" href={isTouch ? wa(text) : `https://wa.me/${digits}`} target="_blank" rel="noreferrer">WhatsApp</a>}
          {digits && t.kind === "voicenote" && <a className="btn" href={`https://wa.me/${digits}`} target="_blank" rel="noreferrer">Open WhatsApp</a>}
          {digits && t.kind === "call" && isTouch && !chans.includes("whatsapp") && <a className="btn" href={`https://wa.me/${digits}`} target="_blank" rel="noreferrer">WhatsApp</a>}

          {t.email && !isTouch && t.kind === "email" && <a className="btn" href={`mailto:${t.email}`}>Email</a>}
          {chans.includes("letter") && link && <NavLink className="btn" to={link + "&convert=1"}>Create project + letter</NavLink>}
          {link && <NavLink className="btn" to={link}>Open</NavLink>}
          <button className="btn primary" disabled={busy} onClick={() => isTouch ? setAsk((a) => !a) : finish("done")}>Done</button>

          <div className="row wrap" style={{ marginBottom: 6 }}>{(seq?.checkin_reasons ?? []).map((r) => <button key={r} className={`btn${reason === r ? " primary" : ""}`} onClick={() => setReason(r)}>{r}</button>)}</div>
          <input value={reason} onChange={(x) => setReason(x.target.value)} placeholder="Reason" style={{ width: "100%", marginBottom: 6 }} />
          <div className="row wrap">
            <button className="btn primary" disabled={busy || !reason.trim()} onClick={() => finish("checkin", reason)}>Done, next in {t.followup_status === "quiet" ? (seq?.quiet_days ?? 30) : (seq?.checkin_days ?? 90)} days</button>
            <button className="btn" disabled={busy} onClick={() => finish("replied", reason)}>They replied</button>
            <button className="btn" disabled={busy} onClick={() => setLostWhy((w) => (w === null ? "" : null))}>Said no</button>
          </div>

            </div>
          )}
        </div>
      )}

  );
}

/** Quick add: your own task. */
function AddTask({ opportunityId, engagementId, onAdded, compact }) {
  const [run, busy] = useAction();
  const [open, setOpen] = useState(!compact);
  const [f, setF] = useState({ title: "", kind: "call", due_on: isoToday(), due_time: "10:00" });
  const add = () => run(async () => {
    if (!f.title.trim()) throw new Error("What is the task?");
    const { data: me } = await supabase.auth.getUser();
    const { error } = await supabase.from("lead_tasks").insert({ opportunity_id: opportunityId ?? null, engagement_id: engagementId ?? null, title: f.title.trim(), kind: f.kind, due_on: f.due_on, due_time: f.due_time || "09:00", created_by: me?.user?.email ?? "staff" });

    setF({ title: "", kind: "call", due_on: isoToday(), due_time: "10:00" }); if (compact) setOpen(false); await onAdded?.();

    <div className="row wrap" style={{ gap: 6 }}>

      <select value={f.kind} onChange={(x) => setF({ ...f, kind: x.target.value })}>{TASK_KINDS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>

async function loadTasks(untilIso) {
  const [{ data: t }, { data: s }, { data: sg }] = await Promise.all([
    supabase.from("tasks_board").select("*").lte("due_on", untilIso).order("due_on"),
    supabase.from("app_settings").select("value").eq("key", "followups").maybeSingle(),
    supabase.from("followup_suggestions").select("*"),
  ]);
  return { rows: t ?? [], seq: s?.value ?? null, suggestions: sg ?? [] };
}

/** The action word for a task, for the glance lists and the board chip. */
const actionWord = (t) => { const ch = String(t.channel ?? ""); if (t.channel === "checkin") return "Check-in"; if (ch.includes("call")) return "Call"; if (ch === "letter") return "Letter"; return taskKindLabel(t.kind); };

/** On the lead: the follow-up status, one Start button, the lead's tasks. */
function LeadTasks({ lead, fu, reload, engagement }) {
  const [run, busy] = useAction();
  const [tasks, setTasks] = useState([]);
  const [seq, setSeq] = useState(null);
  const [pick, setPick] = useState(false);
  const [nextStep, setNextStep] = useState(lead.next_step_at ?? "");
  const load = useCallback(async () => {
    const [{ data: t }, { data: s }] = await Promise.all([
      (engagement ? supabase.from("tasks_board").select("*").or(`engagement_id.eq.${engagement.id}${lead.ghl_id ? `,opportunity_id.eq.${lead.ghl_id}` : ""}`) : supabase.from("tasks_board").select("*").eq("opportunity_id", lead.ghl_id)).order("due_on"),
      supabase.from("app_settings").select("value").eq("key", "followups").maybeSingle(),
    ]);
    setTasks(t ?? []); setSeq(s?.value ?? null);
  }, [lead.ghl_id, engagement?.id]);
  useEffect(() => { load(); }, [load, fu?.status, fu?.step]);
  const both = async () => { await load(); await reload(); };
  const total = seq?.chase?.steps?.length ?? 5, gap = seq?.gap_days ?? 3;
  const start = (kind) => run(async () => {
    await rpc("followup_start", { p_opportunity: lead.ghl_id || null, p_kind: kind, p_engagement: engagement?.id ?? null });
    if (lead.ghl_id) { try { await supabase.functions.invoke("ghl-sync", { body: { action: "note", opportunity_id: lead.ghl_id, body: `Solonos: follow-up started (${FU_KIND_LABEL[kind]})` } }); } catch (e) { /* best effort */ } }
    setPick(false); await both();
  }, kind === "checkin" ? "On the 90-day list" : `Follow-up started: ${total} touches, every ${gap} working days. First one next working day.`);
  const stop = () => run(async () => { await rpc("followup_cancel", { p_followup: fu.id }); await both(); }, "Follow-up stopped");
  const saveNextStep = (v) => run(async () => { const { error } = await supabase.from("opportunities").update({ next_step_at: v || null }).eq("ghl_id", lead.ghl_id); if (error) throw new Error(error.message); await reload(); }, v ? "Next step date saved" : "Cleared");
  const n = fu?.next_due ? daysFromToday(fu.next_due) : null;
  return (
    <>
      <h3>Follow-up</h3>
      {fu ? (
        <div className="row between" style={{ marginBottom: 10, padding: "8px 10px", background: n < 0 ? "#FBF1EE" : "var(--sunken)", borderRadius: 8 }}>
          <span><b>{fu.status === "checkin" ? "On the 90-day list" : fu.status === "quiet" ? "Quiet client" : `Follow-up ${FU_KIND_LABEL[fu.kind]} · touch ${fu.step}/${fu.steps_total ?? total}`}</b><div className="muted small">next {fu.next_due ? `${day(fu.next_due)} (${dueWord(fu.next_due)})` : "…"}{fu.status === "active" ? ` · every ${gap} working days, ${total} touches, then the 90-day list` : ""}</div></span>
          <button className="btn" disabled={busy} onClick={stop}>Stop</button>
        </div>
      ) : (
        <div style={{ marginBottom: 10 }}>
          {isNoShow(lead) && <div className="small" style={{ color: "var(--danger)", fontWeight: 600, marginBottom: 6 }}>No-show on {callWhen(lead.call_at)}.</div>}
          {!pick ? <button className="btn primary" disabled={busy} onClick={() => setPick(true)}>Start follow-up</button> : (<>
            <div className="row wrap">
              {(engagement ? ["draft", "letter"] : ["call1", "valuation", "letter"]).map((k) => <button key={k} className="btn primary" disabled={busy} onClick={() => start(k)}>{FU_KIND_LABEL[k][0].toUpperCase() + FU_KIND_LABEL[k].slice(1)}</button>)}
              <button className="btn" disabled={busy} onClick={() => start("checkin")}>90-day list</button>
              <button className="btn" onClick={() => setPick(false)}>Cancel</button>
            </div>
            <div className="muted small" style={{ marginTop: 6 }}>{total} touches: first one the next working day, then every {gap} working days. No reply after the last one: {engagement ? "the client goes Quiet" : "90-day list"}.</div>
          </>)}
          {!engagement && <label className="small row" style={{ gap: 6, marginTop: 8 }}>Next step agreed for <input type="date" value={nextStep} onChange={(x) => setNextStep(x.target.value)} onBlur={() => nextStep !== (lead.next_step_at ?? "") && saveNextStep(nextStep)} /><span className="muted">(silence after this date flags them as a ghost)</span></label>}
        </div>
      )}
      {(() => {
        const due = tasks.filter((t) => daysFromToday(t.due_on) <= 0);
        const later = tasks.filter((t) => daysFromToday(t.due_on) > 0);
        return (
          <>
            {due.length > 0 && <div className="small" style={{ fontWeight: 700, margin: "4px 0 6px", color: "var(--accent)" }}>{due.length === 1 ? "To do now" : `To do now (${due.length})`}</div>}
            <div className="stack" style={{ gap: 6, marginBottom: 10 }}>{due.map((t) => <TaskRow key={t.id} t={t} seq={seq} reload={both} />)}</div>
            {later.length > 0 && (
              <div className="small" style={{ marginBottom: 10 }}>
                <div className="muted" style={{ marginBottom: 4 }}>Planned</div>
                {later.map((t) => <div key={t.id} className="row between" style={{ padding: "3px 0", borderBottom: "1px solid var(--border-sub)" }}><span>{day(t.due_on)} · {actionWord(t)} · {t.title}</span><span className="muted">{dueWord(t.due_on)}</span></div>)}
              </div>
            )}
            {tasks.length === 0 && <p className="muted small" style={{ margin: "0 0 8px" }}>Nothing planned for this lead.</p>}
            <div style={{ margin: "0 0 16px" }}><AddTask opportunityId={engagement ? null : lead.ghl_id} engagementId={engagement?.id} onAdded={load} compact /></div>
          </>
        );
      })()}
    </>
  );
}

// ===================== Push notifications (installable app) =====================
const VAPID_PUBLIC_KEY = "BJCXjNCjPI7EahDNh7MjN3Q_A6BQ3glaidaSLHO0S3AtM5kj7GeB-BshAG6KFy-L-OPmve9FTkJEna1aGBKyMxw";
const b64ToU8 = (b) => { const p = "=".repeat((4 - b.length % 4) % 4); const r = (b + p).replace(/-/g, "+").replace(/_/g, "/"); const raw = atob(r); return Uint8Array.from([...raw].map((c) => c.charCodeAt(0))); };
async function registerSw() { if (!("serviceWorker" in navigator)) return null; try { return await navigator.serviceWorker.register("/sw.js", { scope: "/" }); } catch (e) { console.warn("sw", e); return null; } }
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent);

/** Turn notifications on for this device and store the subscription. */
function NotificationsCard() {
  const [run, busy] = useAction();
  const [state, setState] = useState("checking");   // checking | unsupported | install | off | on | denied
  const refresh = useCallback(async () => {
    if (!pushSupported()) return setState(isIOS() && !isStandalone() ? "install" : "unsupported");
    if (Notification.permission === "denied") return setState("denied");
    const reg = await registerSw(); const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (!sub) return setState("off");
    const { data } = await supabase.from("push_subscriptions").select("id").eq("endpoint", sub.endpoint).maybeSingle();
    setState(data ? "on" : "off");
  }, []);
  useEffect(() => { refresh(); }, [refresh]);
  const enable = () => run(async () => {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { setState("denied"); throw new Error("Notifications were not allowed"); }
    const reg = await registerSw(); if (!reg) throw new Error("Service worker could not start");
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC_KEY) });
    const j = sub.toJSON(); const { data: me } = await supabase.auth.getUser();
    const { error } = await supabase.from("push_subscriptions").upsert({ user_id: me.user.id, endpoint: sub.endpoint, keys: j.keys, user_agent: navigator.userAgent }, { onConflict: "endpoint" });
    if (error) throw new Error(error.message);
    await reg.showNotification("Solonos", { body: "Notifications are on for this device.", icon: "/icon-192.png" });
    await refresh();
  }, "Notifications on");
  const disable = () => run(async () => {
    const reg = await registerSw(); const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) { await supabase.from("push_subscriptions").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
    await refresh();
  }, "Notifications off for this device");
  const text = {
    checking: "Checking this device…",
    unsupported: "This browser cannot receive push notifications. Use Chrome, Edge or Safari on a phone.",
    install: "On iPhone, add Solonos to your Home Screen first: tap Share, then \"Add to Home Screen\", open it from there and come back here.",
    off: "Get the morning digest (who to contact today, weekdays at 08:30) and a ping for each task at its time. Weekdays 08:00 to 20:00 only. The digest also goes to info@ by email.",
    on: "This device gets the morning digest (weekdays at 08:30) and a ping for each task at its time. Weekdays 08:00 to 20:00 only. The digest also goes to info@ by email.",
    denied: "Notifications are blocked for this site in the browser settings. Allow them there, then try again.",
  }[state];
  return (
    <Card title="Notifications on this device" right={state === "on" ? <span className="chip ok">On</span> : state === "off" ? <span className="chip">Off</span> : null}>
      <p className="muted small" style={{ margin: "0 0 10px" }}>{text}</p>
      {state === "off" && <button className="btn primary" disabled={busy} onClick={enable}>Turn on notifications</button>}
      {state === "on" && <button className="btn" disabled={busy} onClick={disable}>Turn off on this device</button>}
      {state === "denied" && <button className="btn" disabled={busy} onClick={refresh}>Try again</button>}
    </Card>
  );
}

        <h3 style={{ margin: "14px 0 6px" }}>The {seq.chase.steps.length} touches</h3>
