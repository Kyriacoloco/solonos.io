          <div key={i} className="card" style={{ padding: 10, background: "var(--sunken)", marginTop: 8 }}>
            <div className="row wrap" style={{ marginBottom: 6 }}>
              <b className="small" style={{ width: 60 }}>Touch {i + 1}</b>
              <select value={st.channel} onChange={(x) => upd((c) => { c.chase.steps[i].channel = x.target.value; })}>
                {FU_CHANNELS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
              </select>
              <input style={{ flex: 1, minWidth: 180 }} value={st.title ?? ""} onChange={(x) => upd((c) => { c.chase.steps[i].title = x.target.value; })} placeholder="What this touch is" />
            </div>
            {st.channel === "email" && <input style={{ ...inp, marginBottom: 6 }} value={st.subject ?? ""} onChange={(x) => upd((c) => { c.chase.steps[i].subject = x.target.value; })} placeholder="Email subject" />}
            <textarea rows="3" style={inp} value={st.text ?? ""} onChange={(x) => upd((c) => { c.chase.steps[i].text = x.target.value; })} placeholder={st.channel === "voicenote" ? "What to say in the voice note" : "Message"} />
          </div>
        ))}
        <h3 style={{ margin: "16px 0 6px" }}>What {"{thing}"} means, per situation</h3>
        <div className="grid2">
          {["call1", "valuation", "letter", "draft"].map((k) => <Field key={k} label={FU_KIND_LABEL[k][0].toUpperCase() + FU_KIND_LABEL[k].slice(1)}><input value={seq.things?.[k] ?? ""} onChange={(x) => upd((c) => { c.things = { ...(c.things ?? {}), [k]: x.target.value }; })} /></Field>)}
        </div>
        <h3 style={{ margin: "16px 0 6px" }}>First touch after Call 1 <span className="muted small" style={{ fontWeight: 400 }}>(the first email is different after a call; leave empty to use touch 1 above)</span></h3>
        <input style={{ ...inp, marginBottom: 6 }} value={seq.first_touch?.call1?.subject ?? ""} onChange={(x) => upd((c) => { c.first_touch = c.first_touch ?? {}; c.first_touch.call1 = { ...(c.first_touch.call1 ?? {}), subject: x.target.value }; })} placeholder="Email subject" />
        <textarea rows="4" style={inp} value={seq.first_touch?.call1?.text ?? ""} onChange={(x) => upd((c) => { c.first_touch = c.first_touch ?? {}; c.first_touch.call1 = { ...(c.first_touch.call1 ?? {}), text: x.target.value }; })} />
        <div className="row" style={{ marginTop: 12 }}><button className="btn primary" disabled={busy || !dirty} onClick={save}>Save</button>{dirty && <span className="muted small">Unsaved changes</span>}<button className="btn" disabled={busy} onClick={showDigest}>Preview today's digest</button></div>
        {preview && <pre className="small" style={{ marginTop: 10, whiteSpace: "pre-wrap", background: "var(--sunken)", padding: 10, borderRadius: 8 }}>{preview.empty ? "Nothing due and nothing overdue: no digest would be sent today." : `${preview.n_today} to contact today, ${preview.n_overdue} overdue\n` + (preview.rows ?? []).map((r) => `${r.overdue ? "OVERDUE " : ""}${r.time} ${taskKindLabel(r.kind)} ${r.who}${r.step > 0 ? ` · touch ${r.step} of ${r.steps_total}` : ""}`).join("\n") + ((preview.events ?? []).length ? `\nOvernight: ${preview.events.map((e) => `${e.who}: ${e.action}`).join("; ")}` : "")}</pre>}
      </Card>
      <div style={{ height: 18 }} />
      <EmailTemplates />
    </>
  );
}

/** Settings: the default wording of the emails you write yourself. Sending one with "keep as default" ticked updates these. */
function EmailTemplates() {
  const [run, busy] = useAction();
  const [t, setT] = useState(null);
  const [dirty, setDirty] = useState(false);
  useEffect(() => { loadTemplates().then((v) => setT({ scorecard: v.scorecard ?? DEFAULT_TEMPLATES.scorecard, nda: v.nda ?? DEFAULT_TEMPLATES.nda, builder: v.builder ?? DEFAULT_TEMPLATES.builder })); }, []);
  const upd = (k, f, v) => { setT({ ...t, [k]: { ...t[k], [f]: v } }); setDirty(true); };
  const save = () => run(async () => {
    const { error } = await supabase.from("app_settings").upsert({ key: "email_templates", value: t, updated_at: new Date().toISOString() });
    if (error) throw new Error(error.message); setDirty(false);
  }, "Email templates saved");
  if (!t) return null;
  return (
    <Card title="Email templates" right={<span className="muted small">Placeholders: {"{first} {company}"}</span>}>
      {[["scorecard", "Scorecard email (sent when a lead moves from Free Call Booked to Free Call Showed)"], ["nda", "NDA email (from the lead)"], ["builder", "Valuation email (Send to client)"]].map(([k, label]) => (
        <div key={k} style={{ marginBottom: 14 }}>
          <h3 style={{ margin: "0 0 6px" }}>{label}</h3>
          <input style={{ width: "100%", marginBottom: 6 }} value={t[k].subject} onChange={(x) => upd(k, "subject", x.target.value)} placeholder="Subject" />
          <textarea rows="7" style={{ width: "100%" }} value={t[k].text} onChange={(x) => upd(k, "text", x.target.value)} />
        </div>
      ))}
      <div className="row"><button className="btn primary" disabled={busy || !dirty} onClick={save}>Save templates</button>{dirty && <span className="muted small">Unsaved changes</span>}</div>
    </Card>
  );
}

/** NDA made on the lead, before any engagement. Generate it (and optionally email it), then upload the signed copy.
 *  Both follow the lead into the engagement on conversion, where the signed copy marks the NDA signed. */
function LeadNda({ lead }) { return <NdaMaker lead={lead} />; }

/** The same NDA maker on a lead or on an engagement (engagement: no follow-up starts, files stay on the engagement). */
function NdaMaker({ lead: leadIn, engagement }) {
  const lead = leadIn ?? { ghl_id: null, company: engagement.company_name || "", first_name: engagement.client_name || "", last_name: "", email: engagement.client_email || "", country: engagement.company_country || "", name: engagement.company_name || engagement.client_name || "" };
  const onEng = !!engagement;
  const [run, busy] = useAction();
  const [docs, setDocs] = useState([]);
  const [form, setForm] = useState(null);
  const load = useCallback(async () => {
    const q = supabase.from("documents").select("*").eq("kind", "nda").order("created_at", { ascending: false });
    const { data } = await (onEng ? q.eq("engagement_id", engagement.id) : q.eq("opportunity_id", lead.ghl_id));
    setDocs(data ?? []);
  }, [onEng, engagement?.id, lead.ghl_id]);  // eslint-disable-line react-hooks/exhaustive-deps
  useEffect(() => { load(); }, [load]);
  const last = docs.find((d) => !d.meta?.signed)?.meta;
  const openForm = () => setForm({
    is_individual: last?.is_individual ?? false,
    party_name: last?.party_name ?? (lead.company || ""),
    signatory_name: last?.signatory_name ?? [lead.first_name, lead.last_name].filter(Boolean).join(" "),
    signatory_title: last?.signatory_title ?? (engagement?.client_title || "Director"),
    email: last?.email ?? (lead.email || ""),
    address: last?.address ?? (engagement?.company_address || ""),
    country: last?.country ?? (lead.country === "CY" ? "" : (lead.country || "")),
  });
  const set = (k) => (x) => setForm({ ...form, [k]: x.target.type === "checkbox" ? x.target.checked : x.target.value });
  const [mail, setMail] = useState(null);   // the email being written
  const generate = (send, m) => run(async () => {
    const party = form.is_individual ? form.signatory_name : form.party_name;
    await callFn("engagement-send", { kind: "lead_nda", ...(onEng ? { engagement_id: engagement.id } : { opportunity_id: lead.ghl_id }), ...form, party_name: party, send, email: m?.to ?? form.email, email_subject: m?.subject, email_text: m?.text });
    if (send && m?.saveTpl) { try { await saveTemplate("nda", { subject: unfill(m.subject, mail?.vars), text: unfill(m.text, mail?.vars) }); } catch (e) { /* best effort */ } }
    if (send && !onEng) { try { await rpc("followup_start", { p_opportunity: lead.ghl_id, p_kind: "call1" }); } catch (e) { console.warn("follow-up", e); } }
    setMail(null); setForm(null); await load();
  }, send ? (onEng ? "NDA emailed" : "NDA emailed. Follow-up starts next working day") : "NDA generated. Nothing was emailed");
  const writeMail = async () => {
    const tpl = (await loadTemplates()).nda ?? DEFAULT_TEMPLATES.nda;
    const party = form.is_individual ? form.signatory_name : form.party_name;
    const v = { first: String(form.signatory_name || party).trim().split(/\s+/)[0], company: party };
    setMail({ to: form.email || lead.email || "", subject: fillTpl(tpl.subject, v), text: fillTpl(tpl.text, v), vars: v, title: `${party} - Non Disclosure Agreement` });
  };
  const uploadSigned = (file, src) => { if (!file) return; run(async () => {
    const party = src?.meta?.party_name || lead.company || lead.name.split("|")[0].trim();
    const title = `${party} - Non Disclosure Agreement - signed`;
    const ext = (file.name.match(/\.[A-Za-z0-9]+$/) || [".pdf"])[0];
    const path = `${onEng ? `engagements/${engagement.id}` : `leads/${lead.ghl_id}`}/${Date.now()}-${title.replace(/[^A-Za-z0-9.]+/g, "-")}${ext}`;
    const { error } = await supabase.storage.from("deliverables").upload(path, file);
    if (error) throw new Error(error.message);
    const meta = { ...(src?.meta ?? {}), signed: true, signed_on: new Date().toISOString().slice(0, 10) };
    const { error: e2 } = await supabase.from("documents").insert({ ...(onEng ? { engagement_id: engagement.id } : { opportunity_id: lead.ghl_id }), kind: "nda", name: title, storage_path: `deliverables/${path}`, visibility: "internal", uploaded_by: "staff", meta });
    if (e2) throw new Error(e2.message);
    await load();
  }, onEng ? "Signed NDA saved" : "Signed NDA saved on the lead"); };
  const open = async (d) => window.open(await signedUrl(d.storage_path), "_blank");
  const hasSigned = docs.some((d) => d.meta?.signed);
  return (
    <>
      {!onEng && <h3>NDA</h3>}
      {docs.length === 0 && !form && <p className="muted small" style={{ margin: "0 0 8px" }}>{onEng ? "No NDA yet. Generate it, then download it or email it with your own text." : "No NDA yet. Create one here before converting; it follows the lead into the engagement."}</p>}
      {docs.map((d) => (
        <div key={d.id} className="row between small" style={{ marginBottom: 6 }}>
          <span>{d.name}{d.meta?.signed ? <span style={{ color: "var(--ok)" }}> ✓</span> : null}<div className="muted">{ago(d.created_at)}{d.meta?.sent_at ? ` · emailed to ${d.meta.email}` : ""}</div></span>
          <span className="row">
            {!d.meta?.signed && !hasSigned && <label className="btn" style={{ cursor: "pointer" }}>Upload signed copy<input type="file" accept=".pdf,image/*" style={{ display: "none" }} onChange={(x) => { uploadSigned(x.target.files?.[0], d); x.target.value = ""; }} /></label>}
            <button className="btn" onClick={() => open(d)}>Open</button>
          </span>
        </div>
      ))}
      {mail && <EmailDialog title={`Send the NDA to ${mail.vars.first}`} to={mail.to} subject={mail.subject} text={mail.text} attached={`${mail.title}.pdf`} then={onEng ? undefined : "Follow-up starts: first touch next working day, then every 3 working days"} busy={busy} onSend={(m) => generate(true, m)} onCancel={() => setMail(null)} />}
      {!form ? (
        !hasSigned && <button className="btn" disabled={busy} onClick={openForm} style={{ marginBottom: 16 }}>{docs.length ? "Create a new NDA" : "Create NDA"}</button>
      ) : (
        <div className="card" style={{ padding: 12, background: "var(--sunken)", marginBottom: 16 }}>
          <div className="stack" style={{ gap: 10 }}>
            <label className="check"><input type="checkbox" checked={form.is_individual} onChange={set("is_individual")} />Signing as an individual, not a company</label>
            {!form.is_individual && <Field label="Company name (the party on the NDA)"><input value={form.party_name} onChange={set("party_name")} /></Field>}
            <div className="grid2">
              <Field label="Signatory full name"><input value={form.signatory_name} onChange={set("signatory_name")} /></Field>
              <Field label="Title"><input value={form.signatory_title} onChange={set("signatory_title")} placeholder="Director" /></Field>
            </div>
            <Field label={form.is_individual ? "Home address" : "Registered address"}><input value={form.address} onChange={set("address")} placeholder="Street, city, postcode" /></Field>
            <div className="grid2">
              {!form.is_individual && <Field label="Country of incorporation"><input value={form.country} onChange={set("country")} placeholder="e.g. Italy" /></Field>}
              <Field label="Email (you can change it before sending)"><input type="email" value={form.email} onChange={set("email")} /></Field>
            </div>
            <div className="row">
              <button className="btn primary" disabled={busy || !form.address || (form.is_individual ? !form.signatory_name : !(form.party_name && form.country))} onClick={() => generate(false)}>Generate NDA</button>
              <button className="btn" disabled={busy || !form.address || (form.is_individual ? !form.signatory_name : !(form.party_name && form.country))} onClick={writeMail}>Generate and email to client</button>
              <button className="btn" disabled={busy} onClick={() => setForm(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

/** The email you write yourself: To, Subject and the full text are editable. What you send becomes the default for next time. */
function EmailDialog({ title, to, subject, text, attached, then, onSend, onCancel, busy }) {
  const [f, setF] = useState({ to: to || "", subject: subject || "", text: text || "" });
  const [saveTpl, setSaveTpl] = useState(true);
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onCancel();
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [onCancel]);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const ok = /\S+@\S+\.\S+/.test(f.to) && f.subject.trim() && f.text.trim();
  return (
    <div className="modal-bg" onClick={onCancel}>
      <div className="modal" style={{ width: "min(640px, 94vw)" }} role="dialog" aria-label={title} onClick={(e) => e.stopPropagation()}>
        <h2>{title}</h2>
        <div className="stack" style={{ gap: 10, margin: "12px 0" }}>
          <Field label="To"><input type="email" value={f.to} onChange={set("to")} /></Field>
          <Field label="Subject"><input value={f.subject} onChange={set("subject")} /></Field>
          <Field label="Email"><textarea rows={12} value={f.text} onChange={set("text")} style={{ width: "100%", fontFamily: "inherit" }} /></Field>
          <dl className="kv" style={{ margin: 0 }}>
            {attached && <><dt>Attached</dt><dd>{attached}</dd></>}
            {then && <><dt>Then</dt><dd>{then}</dd></>}
          </dl>
          <label className="check small"><input type="checkbox" checked={saveTpl} onChange={(e) => setSaveTpl(e.target.checked)} />Keep this wording as the default for next time</label>
        </div>
        <div className="row" style={{ justifyContent: "flex-end", marginTop: 8 }}>
          <button className="btn" onClick={onCancel}>Cancel</button>
          <button className="btn primary" disabled={busy || !ok} onClick={() => onSend({ to: f.to.trim(), subject: f.subject.trim(), text: f.text.trim(), saveTpl })}>Send email</button>
        </div>
      </div>
    </div>
  );
}

function LeadBuilders({ lead, reload }) {
  const [run, busy] = useAction();
  const [docs, setDocs] = useState([]);
  const load = useCallback(async () => {
    const { data } = await supabase.from("documents").select("*").eq("opportunity_id", lead.ghl_id).eq("kind", "valuation_builder").order("created_at", { ascending: false });
    setDocs(data ?? []);
  }, [lead.ghl_id]);
  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const ch = new BroadcastChannel("solonos");
    ch.onmessage = (m) => { if (m.data?.type === "builder-saved" && m.data.lead === lead.ghl_id) { load(); reload?.(); } };
    return () => ch.close();
  }, [lead.ghl_id, load]);
  const open = async (path) => window.open(await signedUrl(path), "_blank");
  async function upload(file) {
    await run(async () => {
      const path = `leads/${lead.ghl_id}/${Date.now()}-${file.name}`;
      const { error } = await supabase.storage.from("deliverables").upload(path, file);
      if (error) throw new Error(error.message);
      const { error: e2 } = await supabase.from("documents").insert({ opportunity_id: lead.ghl_id, kind: "valuation_builder", name: `${lead.company || lead.name.split("|")[0].trim()} - Market Example Range`, storage_path: `deliverables/${path}`, visibility: "internal", uploaded_by: "staff" });
      if (e2) throw new Error(e2.message);
      await load(); await reload?.();
    }, "Valuation Builder saved on this lead");
  }
  const [sending, setSending] = useState(null);   // the document about to be emailed
  const [draft, setDraft] = useState(null);      // { to, subject, text } for the dialog
  const openSend = async (d) => {
    const tpl = (await loadTemplates()).builder ?? DEFAULT_TEMPLATES.builder;
    const company = d.name.replace(/ - Market Example Range$/, "");
    const first = lead.first_name || lead.name.split("|")[0].trim().split(" ")[0];
    const v = { first, company };
    setDraft({ to: lead.email || "", subject: fillTpl(tpl.subject, v), text: fillTpl(tpl.text, v), vars: v });
    setSending(d);
  };
  async function sendToClient(d, m) {
    setSending(null);
    await run(async () => {
      const blob = await (await fetch(await signedUrl(d.storage_path))).blob();
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("Could not read the PDF")); r.readAsDataURL(blob); });
      const company = d.name.replace(/ - Market Example Range$/, "");
      await callFn("send-email", {
        to: m.to, subject: m.subject,
        html: mailShell(textToHtml(m.text)),
        attachment: { filename: `${company} - Market Example Range.pdf`, contentBase64: b64, contentType: "application/pdf" },
      });
      if (m.saveTpl) { try { await saveTemplate("builder", { subject: unfill(m.subject, draft?.vars), text: unfill(m.text, draft?.vars) }); } catch (e) { /* best effort */ } }
      await supabase.from("documents").update({ sent_at: new Date().toISOString() }).eq("id", d.id);
      const { data: me } = await supabase.auth.getUser();
      await supabase.from("lead_notes").insert({ opportunity_id: lead.ghl_id, body: `Market Example Range emailed to ${m.to}`, author: me?.user?.email ?? "staff" });
      // the follow-up starts by itself: touch 1 the next working day, then every 3 working days
      try { await rpc("followup_start", { p_opportunity: lead.ghl_id, p_kind: "valuation" }); } catch (e) { console.warn("follow-up", e); }
      // the offer is out: the lead moves to Full Offer Made in GHL
      const { data: st } = await supabase.from("pipeline_stages").select("ghl_id").ilike("name", "full offer%").maybeSingle();
      if (st && lead.stage_id !== st.ghl_id) {
        const { data, error } = await supabase.functions.invoke("ghl-sync", { body: { action: "move", opportunity_id: lead.ghl_id, stage_id: st.ghl_id } });
        if (error) throw new Error("Email sent, but the move to Full Offer Made failed: " + ((await error.context?.json?.().catch(() => null))?.error ?? error.message));
        if (data?.ok === false) throw new Error("Email sent, but the move to Full Offer Made failed: " + data.error);
      }
      await load(); await reload?.();
    }, "Sent. Lead moved to Full Offer Made; follow-up starts next working day");
  }
  const remove = (d) => run(async () => {
    await supabase.storage.from("deliverables").remove([d.storage_path.replace(/^deliverables\//, "")]);
    const { error } = await supabase.from("documents").delete().eq("id", d.id);
    if (error) throw new Error(error.message);
    await load(); await reload?.();
  }, "Removed");
  return (
    <>
      <h3>Valuation Builder</h3>
      <div className="stack" style={{ margin: "8px 0 18px", gap: 6 }}>
        {docs.length === 0 && <span className="muted small">None yet. Open the builder for this lead, press Print when done: the PDF is saved here automatically. It moves with the lead into the engagement and the client sees it on their page.</span>}
        {docs.map((d) => (
          <div key={d.id} className="row between small">
            <span>{d.name}<div className="muted">{ago(d.created_at)}{d.sent_at && <> · <span style={{ color: "var(--ok)" }}>sent {day(d.sent_at)}</span></>}</div></span>
            <span className="row">
              <button className="btn primary" disabled={busy} onClick={() => openSend(d)}>{d.sent_at ? "Send again" : "Send to client"}</button>
              <button className="btn" onClick={() => open(d.storage_path)}>Open</button>
              <button className="btn" disabled={busy} onClick={() => remove(d)}>Remove</button>
            </span>
          </div>
        ))}
        {sending && draft && <EmailDialog title={`Send to ${lead.first_name || lead.name.split("|")[0].trim()}`} to={draft.to} subject={draft.subject} text={draft.text} attached={`${sending.name}.pdf`} then="Lead moves to Full Offer Made and the follow-up starts (first touch next working day)" busy={busy} onSend={(m) => sendToClient(sending, m)} onCancel={() => setSending(null)} />}
        <div className="row">
          <a className="btn primary" href={`/ConsortiaValuationBuilder.html?lead=${encodeURIComponent(lead.ghl_id)}&v=${Date.now()}`} target="_blank" rel="noreferrer">Open Valuation Builder for this lead</a>
          <label className="btn" style={{ cursor: "pointer" }}>{busy ? "Uploading…" : "Attach a PDF"}<input type="file" accept=".pdf" style={{ display: "none" }} disabled={busy} onChange={(x) => x.target.files[0] && upload(x.target.files[0])} /></label>
        </div>
      </div>
    </>
  );
}

function LeadCard({ l, eng, fu, due, onOpen, draggable }) {

    <div className="lead" onClick={onOpen} draggable={draggable} onDragStart={(ev) => { ev.dataTransfer.setData("text/plain", l.ghl_id); ev.dataTransfer.effectAllowed = "move"; }}>
      <div className="name">{l.name}</div>
      <div className="meta">
        <span>{l.company || [l.first_name, l.last_name].filter(Boolean).join(" ")}</span>
        <span title="Came in">{l.ghl_created_at ? day(l.ghl_created_at) : ago(l.ghl_updated_at)}</span>
      </div>
      <div className="row" style={{ marginTop: 6, gap: 6 }}>
        {l.monetary_value > 0 && <Chip>{eur(l.monetary_value)}</Chip>}
        {l.recordings > 0 && <Chip>Fathom ×{l.recordings}</Chip>}
        {l.builders > 0 && <Chip kind="brand">Builder sent</Chip>}
        {l.lost_reason && <Chip kind="danger">{l.lost_reason}</Chip>}
        {l.call_at && !isNoShow(l) && <Chip kind={new Date(l.call_at) >= new Date() ? "ok" : ""} title={l.call_title || "Call"}>{callWhen(l.call_at)}</Chip>}

  );
}

/** Convert a lead: what you know from the call. The client fills address, tax number and industry on their page. */
function ConvertForm({ lead, onCancel }) {
  const nav = useNavigate();
  const [run, busy] = useAction();
  const c = lead.custom ?? {};
  const [f, setF] = useState({
    client_name: [lead.first_name, lead.last_name].filter(Boolean).join(" "),
    client_title: "Director",
    client_email: lead.email ?? "",
    company_name: lead.company ?? "",
    company_country: lead.country === "CY" ? "" : (lead.country ?? ""),
    company_industry: Object.entries(c).find(([k]) => /industry/i.test(k))?.[1] ?? "",
    is_individual: false,
    fee: "", approaches: ["dcf", "cca", "pt"], type: "valuation",
  });
  const set = (k) => (x) => setF({ ...f, [k]: x.target.type === "checkbox" ? x.target.checked : x.target.value });
  const toggleA = (k) => setF((f) => ({ ...f, approaches: f.approaches.includes(k) ? f.approaches.filter((x) => x !== k) : [...f.approaches, k] }));
  // an NDA made on the lead fills the form and, if it came back signed, carries over as signed
  const [ndaDocs, setNdaDocs] = useState([]);
  useEffect(() => {
    supabase.from("documents").select("*").eq("opportunity_id", lead.ghl_id).eq("kind", "nda").order("created_at", { ascending: false })
      .then(({ data }) => {
        setNdaDocs(data ?? []);
        const m = (data ?? []).find((d) => d.meta)?.meta;
        if (m) setF((cur) => ({ ...cur, client_name: m.signatory_name || cur.client_name, client_title: m.signatory_title || cur.client_title,
          client_email: m.email || cur.client_email, company_name: m.is_individual ? cur.company_name : (m.party_name || cur.company_name),
          company_country: m.country || cur.company_country, is_individual: !!m.is_individual }));
      });
  }, [lead.ghl_id]);
  async function create() {
    await run(async () => {
      const e = await rpc("staff_create_engagement", { p_opportunity: lead.ghl_id, p_client_name: f.client_name, p_client_email: f.client_email, p_deposit: false });
      const ndaMeta = ndaDocs.find((d) => d.meta)?.meta;
      const signedNda = ndaDocs.find((d) => d.meta?.signed);
      const { error } = await supabase.from("engagements").update({
        client_title: f.client_title || null, company_name: f.is_individual ? null : (f.company_name || null),
        company_country: f.company_country || null, company_industry: f.company_industry || null, is_individual: f.is_individual,
        fee: f.fee ? Number(f.fee) : null, approaches: f.approaches, engagement_type: f.type,
        ...(ndaMeta?.address ? { company_address: ndaMeta.address } : {}),
      }).eq("id", e.id);
      if (error) throw new Error(error.message);
      if (signedNda) {
        await rpc("staff_record_nda_offline", { p_engagement: e.id, p_signed_pdf_path: signedNda.storage_path, p_signed_on: signedNda.meta.signed_on || new Date().toISOString().slice(0, 10) });
        if (ndaMeta?.address && (f.company_country || f.is_individual)) await rpc("staff_confirm_details", { p_engagement: e.id }).catch(() => null);
      }
      nav(`/app/projects/${e.id}`);
    });
  }
  const ready = f.client_name && f.client_email;
  return (
    <div className="stack">
      <h3>Create project</h3>
      <p className="muted small" style={{ margin: 0 }}>Only the name and email are needed. The client completes the company details on their own page; everything else follows from that.</p>
      <Field label="Type"><select value={f.type} onChange={set("type")}>{ENG_TYPES.map(([k, l]) => <option key={k} value={k}>{l}</option>)}</select></Field>
      {ndaDocs.some((d) => d.meta?.signed) && <div className="note small" style={{ color: "var(--ok)" }}>✓ Signed NDA on this lead: the engagement starts with the NDA signed and the details confirmed.</div>}
      <Field label="Signatory full name (as it will appear on the NDA and letter)"><input value={f.client_name} onChange={set("client_name")} /></Field>
      <div className="grid2">
        <Field label="Title"><input value={f.client_title} onChange={set("client_title")} placeholder="Director" /></Field>
        <Field label="Email (their portal login)"><input type="email" value={f.client_email} onChange={set("client_email")} /></Field>
      </div>
      <label className="check"><input type="checkbox" checked={f.is_individual} onChange={set("is_individual")} />Contracting as an individual, not a company</label>
      <div className="grid2">
        {!f.is_individual && <Field label="Company name"><input value={f.company_name} onChange={set("company_name")} /></Field>}
        <Field label="Country (optional, the client confirms it)"><input value={f.company_country} onChange={set("company_country")} placeholder="e.g. United Kingdom" /></Field>
      </div>
      <div className="grid2">
        <Field label="Fee agreed on the call (EUR, no VAT)"><input type="number" min="0" step="100" value={f.fee} onChange={set("fee")} placeholder="e.g. 5000" /></Field>
        <div className="stack" style={{ gap: 4 }}>
          <span className="small" style={{ color: "var(--text-3)" }}>Approaches</span>
          {APPROACHES.map((a) => <label key={a.key} className="check"><input type="checkbox" checked={f.approaches.includes(a.key)} onChange={() => toggleA(a.key)} />{a.label}</label>)}
        </div>
      </div>
      <div className="note">Invoiced by: <strong>{f.company_country ? entityFor(f.company_country) : "decided by the country the client confirms"}</strong>. The engagement letter is generated with this fee once the client confirms details and signs the NDA.</div>
      <div className="row">
        <button className="btn primary" disabled={!ready || busy} onClick={create}>Create project</button>
        <button className="btn" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function Head({ lastSync, count, reload }) {
  const [run, busy] = useAction();
  const toast = useToast();
  async function sync() {
    await run(async () => {
      const { data, error } = await supabase.functions.invoke("ghl-sync?mode=full", { body: {} });
      if (error) throw new Error((await error.context?.json?.().catch(() => null))?.error ?? error.message);
      if (data?.ok === false) throw new Error(data.error);
      toast(`Synced ${data?.opportunities ?? 0} leads from "${data?.pipeline ?? "GHL"}"`);
      await reload?.();
    });
  }
  return (
    <div className="pagehead">
      <div><h1>Leads</h1><p className="hide-sm">Who needs you next. The board view mirrors GHL: drag a card to another column and it moves there too.</p></div>

          {count != null && `${count} open · `}
          {lastSync ? `last sync ${ago(lastSync.received_at)}` : "never synced"}

}

function LeadDrawer({ lead, engagement, onClose, reload, stages, onMove, fu }) {
  const nav = useNavigate();
  const [run, busy] = useAction();
  const [recs, setRecs] = useState([]);
  const [fathom, setFathom] = useState("");
  const [callNo, setCallNo] = useState(1);
  const [convert, setConvert] = useState(!!lead._convert);
  const [name, setName] = useState([lead.first_name, lead.last_name].filter(Boolean).join(" "));
  const [email, setEmail] = useState(lead.email ?? "");
  const [edit, setEdit] = useState(null);   // { first_name, last_name, email, phone, company } while editing the contact
  const startEdit = () => setEdit({ first_name: lead.first_name ?? "", last_name: lead.last_name ?? "", email: lead.email ?? "", phone: lead.phone ?? "", company: lead.company ?? "" });
  const saveEdit = () => run(async () => {
    const { data, error } = await supabase.functions.invoke("ghl-sync", { body: { action: "contact", opportunity_id: lead.ghl_id, fields: edit } });
    if (error) throw new Error((await error.context?.json?.().catch(() => null))?.error ?? error.message);
    if (data?.ok === false) throw new Error(data.error);
    setEdit(null); setName([edit.first_name, edit.last_name].filter(Boolean).join(" ")); setEmail(edit.email); await reload();
  }, "Saved here and in GHL");

  const loadRecs = useCallback(async () => {
    const { data } = await supabase.from("call_recordings").select("*").eq("opportunity_id", lead.ghl_id).order("call_no");
    setRecs(data ?? []);
  }, [lead.ghl_id]);
  useEffect(() => { loadRecs(); }, [loadRecs]);

  async function addFathom() {
    await run(async () => {
      const { error } = await supabase.from("call_recordings").insert({ opportunity_id: lead.ghl_id, call_no: callNo, fathom_url: fathom, recorded_at: new Date().toISOString() });
      if (error) throw new Error(error.message);
      setFathom(""); await loadRecs(); await reload();
    }, "Recording attached");
  }

  async function doConvert() {
    await run(async () => {
      const e = await rpc("staff_create_engagement", { p_opportunity: lead.ghl_id, p_client_name: name, p_client_email: email });
      nav(`/app/projects/${e.id}`);
    });
  }

  return (
    <Drawer title={lead.name} sub={lead.stage_name} onClose={onClose}>
      {!engagement && stages?.length > 0 && onMove && (
        <label className="row small" style={{ gap: 8, margin: "12px 0 0" }}>
          <span className="muted">Move to</span>
          <select value={lead.stage_id ?? ""} onChange={(ev) => ev.target.value && ev.target.value !== lead.stage_id && onMove(ev.target.value)} style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: "1px solid var(--border)", background: "var(--surface)", font: "inherit" }}>
            {stages.map((st) => <option key={st.ghl_id} value={st.ghl_id}>{st.name}</option>)}
          </select>
        </label>
      )}
      {edit ? (
        <div className="card" style={{ padding: 12, background: "var(--sunken)", margin: "14px 0" }}>
          <div className="grid2">
            <Field label="First name"><input value={edit.first_name} onChange={(e) => setEdit({ ...edit, first_name: e.target.value })} /></Field>
            <Field label="Last name"><input value={edit.last_name} onChange={(e) => setEdit({ ...edit, last_name: e.target.value })} /></Field>
            <Field label="Email"><input type="email" value={edit.email} onChange={(e) => setEdit({ ...edit, email: e.target.value })} /></Field>
            <Field label="Phone"><input value={edit.phone} onChange={(e) => setEdit({ ...edit, phone: e.target.value })} placeholder="+357…" /></Field>
          </div>
          <Field label="Company"><input value={edit.company} onChange={(e) => setEdit({ ...edit, company: e.target.value })} /></Field>
          <div className="row" style={{ marginTop: 8 }}>
            <button className="btn primary" disabled={busy} onClick={saveEdit}>Save (updates GHL too)</button>
            <button className="btn" disabled={busy} onClick={() => setEdit(null)}>Cancel</button>
          </div>
        </div>
      ) : (
      <dl className="kv" style={{ margin: "14px 0" }}>
        <dt>Contact</dt><dd>{[lead.first_name, lead.last_name].filter(Boolean).join(" ") || "—"} <button className="btn" style={{ marginLeft: 8, padding: "2px 8px" }} onClick={startEdit}>Edit</button></dd>
        <dt>Company</dt><dd>{lead.company || "—"}</dd>
        <dt>Email</dt><dd>{lead.email || "—"}</dd>
        <dt>Phone</dt><dd>{lead.phone || "—"}</dd>
        {lead.call_at && <><dt>Call</dt><dd>{callWhen(lead.call_at, true)}{lead.call_status && <span className="muted"> · {lead.call_status.replace(/_/g, " ")}</span>}</dd></>}
        {lead.lost_at && <><dt>Why lost</dt><dd>
          <select value={lead.lost_reason ?? ""} disabled={busy}
            onChange={(ev) => run(() => rpc("set_lost_reason", { p_opportunity_id: lead.ghl_id, p_reason: ev.target.value }).then(reload), "Reason saved")}>
            <option value="">Not set</option>
            {[...LOST_REASONS, "Disqualified"].map((r) => <option key={r} value={r}>{r}</option>)}
          </select>
        </dd></>}
        <dt>Country</dt><dd>{lead.country || "—"}</dd>
        <dt>Source</dt><dd>{lead.source || "—"}</dd>
        <dt>Owner</dt><dd>{lead.assigned_to || "—"}</dd>
        <dt>Came in</dt><dd>{lead.ghl_created_at ? `${day(lead.ghl_created_at)} (${ago(lead.ghl_created_at)})` : "—"}</dd>
      </dl>
      )}

      <Intake custom={lead.custom} />
      {!engagement && <LeadTasks lead={lead} fu={fu} reload={reload} />}
      <LeadNda lead={lead} />
      <LeadBuilders lead={lead} reload={reload} />

      <h3>Call recordings</h3>
      <div className="stack" style={{ margin: "8px 0 18px" }}>
        {recs.length === 0 && <span className="muted small">None yet. Paste the Fathom link after each call.</span>}
        {recs.map((r) => <div key={r.id} className="row between small"><span>Call {r.call_no}</span><a href={r.fathom_url} target="_blank" rel="noreferrer">Open in Fathom</a></div>)}
        <div className="row">
          <select value={callNo} onChange={(e) => setCallNo(Number(e.target.value))} style={{ padding: 8, borderRadius: 8, border: "1px solid var(--border)" }}>
            <option value={1}>Call 1</option><option value={2}>Call 2</option>
          </select>
          <input placeholder="https://fathom.video/…" value={fathom} onChange={(e) => setFathom(e.target.value)} style={{ flex: 1, padding: 8, borderRadius: 8, border: "1px solid var(--border)" }} />
          <button className="btn" disabled={!fathom || busy} onClick={addFathom}>Attach</button>
        </div>
      </div>

      {engagement ? (
        <div className="note">
          This lead already has a project. <button className="btn link" onClick={() => nav(`/app/projects/${engagement.id}`)}>Open it</button>
        </div>
      ) : convert ? (
        <ConvertForm lead={lead} onCancel={() => setConvert(false)} />
      ) : (
        <button className="btn primary" onClick={() => setConvert(true)}>Create project</button>
      )}
      <NotesLog opportunityId={lead.ghl_id} />
    </Drawer>
  );
}

const chipKind = (s) => (s === "declined" ? "danger" : s === "completed" ? "ok" : s === "valuation_active" ? "accent" : "");

function Engagements() {
  const nav = useNavigate();
  const [rows, setRows] = useState(null);
  const [quiet, setQuiet] = useState([]);
  const [filter, setFilter] = useState("live");

  useEffect(() => {
    supabase.from("engagements").select("id, stage, engagement_type, client_name, client_email, company_name, company_country, fee, updated_at, created_at, sent_at, last_client_activity_at")
      .order("updated_at", { ascending: false })
      .then(({ data }) => setRows(data ?? []));
    supabase.from("engagements_quiet").select("id").then(({ data }) => setQuiet((data ?? []).map((x) => x.id)));
  }, []);

  const shown = (rows ?? []).filter((r) => filter === "all" ? true : filter === "live" ? LIVE_STAGES.includes(r.stage) : filter === "quiet" ? quiet.includes(r.id) : r.stage === filter);

  return (

        <button className={`btn ${filter === "live" ? "primary" : ""}`} onClick={() => setFilter("live")}>Live</button>
        {ENGAGEMENT_STAGES.filter((s) => counts[s.key] > 0).map((s) => (
          <button key={s.key} className={`btn ${filter === s.key ? "primary" : ""}`} onClick={() => setFilter(s.key)}>{s.label} · {counts[s.key]}</button>
        ))}
        <button className={`btn ${filter === "quiet" ? "primary" : ""}`} onClick={() => setFilter("quiet")} title="No client activity for 7+ days">Quiet · {quiet.length}</button>
        <button className={`btn ${filter === "all" ? "primary" : ""}`} onClick={() => setFilter("all")}>All</button>
      </div>
      <div className="card">
        {rows === null ? null : shown.length === 0 ? (
          <Empty title="Nothing here">Click New project, or press Create project on a lead.</Empty>
        ) : (
          <table className="table">
            <thead><tr><th>Client</th><th>Company</th><th>Type</th><th>Stage</th><th>Fee</th><th>Last activity</th></tr></thead>
            <tbody>
              {shown.map((r) => (
                <tr key={r.id} className="click" onClick={() => nav(`/app/projects/${r.id}`)}>
                  <td><strong>{r.client_name}</strong><div className="muted small">{r.client_email}</div></td>
                  <td>{r.company_name || "—"}<div className="muted small">{r.company_country}</div></td>
                  <td className="small">{typeLabel(r.engagement_type)}</td>
                  <td><Chip kind={chipKind(r.stage)}>{engStageLabel(r)}</Chip></td>
                  <td>{r.fee ? eur(r.fee) : <span className="muted">not set</span>}</td>
                  <td className="muted">{r.last_client_activity_at ? `client ${ago(r.last_client_activity_at)}` : r.sent_at ? `sent ${ago(r.sent_at)}` : ago(r.updated_at)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </>
  );
}

/** Follow-up on an engagement that has not been signed yet (they said yes, then went quiet). */
function EngagementFollowup({ e }) {
  const [lead, setLead] = useState(null);
  const [fu, setFu] = useState(null);
  const load = useCallback(async () => {
    const [{ data: l }, { data: f }] = await Promise.all([
      supabase.from("leads_board").select("*").eq("ghl_id", e.opportunity_id).maybeSingle(),
      supabase.from("followups").select("*").or(`engagement_id.eq.${e.id}${e.opportunity_id ? `,opportunity_id.eq.${e.opportunity_id}` : ""}`).in("status", ["active", "checkin", "quiet"]).order("created_at", { ascending: false }).limit(1).maybeSingle(),
    ]);
    setLead(l ?? { ghl_id: e.opportunity_id, name: e.company_name || e.client_name, first_name: (e.client_name || "").split(" ")[0], company: e.company_name, phone: "", email: e.client_email });
    setFu(f ?? null);
  }, [e.id, e.opportunity_id, e.company_name, e.client_name, e.client_email]);
  useEffect(() => { load(); }, [load]);
  if (!lead) return null;

}

/** Tasks on a project (kept on the project's task list, which is made the first time a task is added). */
function ProjectTasks({ e }) {
  const [run, busy] = useAction();
  const [pid, setPid] = useState(undefined);
  const [tasks, setTasks] = useState([]);
  const [team, setTeam] = useState([]);
  const [nt, setNt] = useState({ title: "", assignee_id: "", due: "" });
  const load = useCallback(async () => {
    const { data: pr } = await supabase.from("projects").select("id").eq("engagement_id", e.id).order("started_at").limit(1).maybeSingle();
    setPid(pr?.id ?? null);
    if (pr?.id) { const { data: t } = await supabase.from("tasks").select("*").eq("project_id", pr.id).order("created_at"); setTasks(t ?? []); } else setTasks([]);
  }, [e.id]);
  useEffect(() => { load(); supabase.from("staff").select("user_id, full_name").then(({ data }) => setTeam(data ?? [])); }, [load]);
  const add = () => run(async () => {
    let id = pid;
    if (!id) id = (await rpc("staff_create_project", { p_engagement: e.id })).id;
    const { error } = await supabase.from("tasks").insert({ project_id: id, title: nt.title.trim(), assignee_id: nt.assignee_id || null, due_at: nt.due ? `${nt.due}T17:00:00` : null });
    if (error) throw new Error(error.message);
    setNt({ title: "", assignee_id: nt.assignee_id, due: "" }); await load();
  });
  const toggle = (t) => run(async () => { const { error } = await supabase.from("tasks").update({ status: t.status === "done" ? "todo" : "done" }).eq("id", t.id); if (error) throw new Error(error.message); await load(); });
  const remove = (t) => run(async () => { const { error } = await supabase.from("tasks").delete().eq("id", t.id); if (error) throw new Error(error.message); await load(); }, "Task removed");
  const who = (uid) => team.find((m) => m.user_id === uid)?.full_name ?? "";
  const open = tasks.filter((t) => t.status !== "done"), done = tasks.filter((t) => t.status === "done");
  const row = (t) => (
    <div key={t.id} className="row between small" style={{ gap: 8 }}>
      <label className="check" style={{ flex: 1, minWidth: 0 }}><input type="checkbox" checked={t.status === "done"} onChange={() => toggle(t)} /><span style={{ textDecoration: t.status === "done" ? "line-through" : "none" }}>{t.title}</span></label>
      <span className="muted" style={{ flex: "none" }}>{[who(t.assignee_id), t.due_at && day(t.due_at)].filter(Boolean).join(" · ")}</span>
      <button className="btn" disabled={busy} onClick={() => remove(t)} title="Remove task">✕</button>
    </div>
  );
  return (
    <Card title={`Tasks${tasks.length ? ` · ${open.length} open` : ""}`}>
      <div className="stack" style={{ gap: 8 }}>
        {pid !== undefined && tasks.length === 0 && <span className="muted small">No tasks yet.</span>}
        {open.map(row)}
        {done.length > 0 && <div className="muted small" style={{ marginTop: 6 }}>Done</div>}
        {done.map(row)}
        <div className="row wrap" style={{ gap: 6, marginTop: 4 }}>
          <input style={{ flex: 1, minWidth: 160 }} value={nt.title} onChange={(x) => setNt({ ...nt, title: x.target.value })} onKeyDown={(x) => x.key === "Enter" && nt.title.trim() && add()} placeholder="New task, e.g. Prepare teaser" />

/** The OneDrive page: a live window into the Consortia OneDrive and the Common library. Click a folder to go in, a file to open it in OneDrive. */
const fileIcon = (it) => it.folder ? "📁" : /\.(xlsx?|xlsm|csv)$/i.test(it.name) ? "📊" : /\.(docx?)$/i.test(it.name) ? "📝" : /\.(pptx?)$/i.test(it.name) ? "📽" : /\.pdf$/i.test(it.name) ? "📕" : /\.(png|jpe?g|gif|webp)$/i.test(it.name) ? "🖼" : "📄";
const fileSize = (n) => n == null ? "" : n < 1024 ? `${n} B` : n < 1048576 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`;
function OneDrivePage() {
  const [run, busy] = useAction();
  const [roots, setRoots] = useState(null);
  const [note, setNote] = useState("");
  const [trail, setTrail] = useState([]);        // [{ drive, id, name, url }]
  const [items, setItems] = useState(null);
  const [q, setQ] = useState("");
  const [found, setFound] = useState(null);
  const here = trail[trail.length - 1];
  useEffect(() => { run(async () => { const r = await callFn("onedrive", { action: "roots" }); setRoots(r.roots); setNote(r.note || ""); }); }, []);  // eslint-disable-line react-hooks/exhaustive-deps
  const go = (t) => run(async () => { setFound(null); const r = await callFn("onedrive", { action: "browse", drive: t[t.length - 1].drive, item: t[t.length - 1].id }); setTrail(t); setItems(r.items); });
  const openItem = (it) => (it.folder ? go([...trail, { drive: it.drive, id: it.id, name: it.name, url: it.url }]) : window.open(it.url, "_blank", "noopener"));
  const search = () => run(async () => { const r = await callFn("onedrive", { action: "search", q, drive: here?.drive }); setFound(r.items); });
  const [newName, setNewName] = useState(null);
  const create = () => run(async () => { await callFn("onedrive", { action: "mkdir", drive: here.drive, item: here.id, name: newName }); setNewName(null); await go(trail); }, "Folder created");
  const upload = (files) => run(async () => {
    for (const f of files) {
      if (f.size > 25 * 1048576) throw new Error(`${f.name} is over 25 MB; drop big files into OneDrive directly`);
      const b64 = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => bad(new Error("could not read the file")); r.readAsDataURL(f); });
      await callFn("onedrive", { action: "upload", drive: here.drive, item: here.id, name: f.name, contentBase64: b64 });
    }
    await go(trail);
  }, files.length === 1 ? "Uploaded" : `${files.length} files uploaded`);
  const rows = found ?? items;
  return (
    <>
      <div className="pagehead">
        <div><h1>OneDrive</h1><p className="hide-sm">Live view of Common and your Consortia OneDrive. Click a folder to open it, a file to open it in OneDrive.</p></div>
        <div className="row" style={{ gap: 6 }}>
          <input value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === "Enter" && search()} placeholder={here ? `Search in ${trail[0].name}…` : "Search all files…"} style={{ width: 240, padding: "8px 10px", borderRadius: 8, border: "1px solid var(--border)", font: "inherit" }} />
          <button className="btn" disabled={busy || q.trim().length < 2} onClick={search}>Search</button>
          {found && <button className="btn" onClick={() => { setFound(null); setQ(""); }}>Clear</button>}
        </div>
      </div>
      {note && !roots?.some((r) => r.name === "Common") && <div className="note" style={{ marginBottom: 12 }}>Common is not reachable yet: add the Sites.Read.All permission to the Solonos Mail app in Microsoft Entra and grant admin consent. Your own OneDrive works already.</div>}
      <div className="row" style={{ gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
        <button className="btn" onClick={() => { setTrail([]); setItems(null); setFound(null); }}>OneDrive</button>
        {trail.map((t, i) => <React.Fragment key={t.id}><span className="muted">›</span><button className="btn" onClick={() => go(trail.slice(0, i + 1))}>{t.name}</button></React.Fragment>)}
        {here && <span style={{ marginLeft: "auto" }} className="row">
          <a className="btn" href={here.url} target="_blank" rel="noreferrer">Open this folder in OneDrive</a>
          {newName === null ? <button className="btn" onClick={() => setNewName("")}>New folder</button> : <><input autoFocus value={newName} onChange={(e) => setNewName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && newName.trim() && create()} placeholder="Folder name" style={{ padding: "7px 9px", borderRadius: 8, border: "1px solid var(--border)", font: "inherit" }} /><button className="btn primary" disabled={busy || !newName.trim()} onClick={create}>Create</button><button className="btn" onClick={() => setNewName(null)}>Cancel</button></>}
          <label className="btn" style={{ cursor: "pointer" }}>Upload<input type="file" multiple style={{ display: "none" }} onChange={(e) => { const fs = [...(e.target.files ?? [])]; e.target.value = ""; if (fs.length) upload(fs); }} /></label>
        </span>}
      </div>
      {!roots ? <span className="muted small">{busy ? "Connecting to OneDrive…" : "Could not reach OneDrive."}</span> : !here && !found ? (
        <div className="stack" style={{ gap: 8 }}>
          {roots.map((r) => <div key={r.id} className="leadrow" onClick={() => go([{ drive: r.drive, id: r.id, name: r.name, url: r.url }])}><span style={{ fontWeight: 700 }}>☁ {r.name}</span><span className="muted small">Open</span></div>)}
        </div>
      ) : (
        <div onDragOver={(e) => { if (here) e.preventDefault(); }} onDrop={(e) => { if (!here) return; e.preventDefault(); const fs = [...(e.dataTransfer.files ?? [])]; if (fs.length) upload(fs); }}>
          {busy && !rows ? <span className="muted small">Loading…</span> : !rows?.length ? <Empty title={found ? "Nothing found" : "Empty folder"}>{found ? "Try another word." : "Drop files here to upload them."}</Empty> : (
            <div className="stack" style={{ gap: 4, opacity: busy ? .6 : 1 }}>
              {rows.map((it) => (
                <div key={it.id} className="leadrow" onClick={() => openItem(it)} title={it.folder ? "Open folder" : "Open in OneDrive"}>
                  <span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileIcon(it)} <span style={{ fontWeight: it.folder ? 600 : 500 }}>{it.name}</span>{found && it.path && <span className="muted small"> · {decodeURIComponent(String(it.path).replace(/^.*root:/, "")) || "/"}</span>}</span>
                  <span className="muted small" style={{ flex: "none" }}>{it.folder ? `${it.count ?? ""} item${it.count === 1 ? "" : "s"}` : fileSize(it.size)}{it.modified ? ` · ${day(it.modified)}` : ""}</span>
                </div>
              ))}
            </div>
          )}
          {here && <p className="muted small" style={{ marginTop: 10 }}>Tip: drag files from your computer onto this list to upload them here.</p>}
        </div>
      )}
    </>
  );
}

function EngagementDetail() {
  const { id } = useParams();
  const [e, setE] = useState(null);
  const [deposit, setDeposit] = useState(null);
  const [invoices, setInvoices] = useState([]);
  const [docs, setDocs] = useState([]);
  const [agreements, setAgreements] = useState([]);
  const [feed, setFeed] = useState([]);
  const [contact, setContact] = useState(null);

  const load = useCallback(async () => {
    const [a, b, c, d, f, g] = await Promise.all([
      supabase.from("engagements").select("*").eq("id", id).single(),
      supabase.from("deposits").select("*").eq("engagement_id", id).order("created_at", { ascending: false }).limit(1).maybeSingle(),
      supabase.from("engagement_invoices").select("*").eq("engagement_id", id).order("seq"),
      supabase.from("client_documents").select("*").eq("engagement_id", id).order("created_at"),
      supabase.from("agreements").select("id, kind, version, status, sent_at, signed_at").eq("engagement_id", id).order("created_at"),
      supabase.from("activity_log").select("*").eq("engagement_id", id).order("created_at", { ascending: false }).limit(40),
    ]);
    setE(a.data); setDeposit(b.data); setInvoices(c.data ?? []); setDocs(d.data ?? []); setAgreements(f.data ?? []); setFeed(g.data ?? []);
    if (a.data?.contact_id) {
      const { data: ct } = await supabase.from("contacts").select("custom, phone").eq("ghl_id", a.data.contact_id).maybeSingle();
      setContact(ct);
    }
  }, [id]);
  useEffect(() => { load(); }, [load]);

  if (!e) return null;
  if (isSimple(e)) return <SimpleEngagement e={e} invoices={invoices} feed={feed} contact={contact} reload={load} />;
  return <ValuationProject e={e} deposit={deposit} invoices={invoices} docs={docs} agreements={agreements} feed={feed} contact={contact} reload={load} />;
}

/** The process line. Staff click a step to move the project there; the client sees the same line, read only. */
function ProcessBar({ e, reload, readOnly }) {
  const [run, busy] = useAction();
  const steps = processFor(e.engagement_type);
  const at = Math.min(Math.max(Number(e.process_step ?? 0), 0), steps.length);   // steps.length = all done
  const move = (i) => run(async () => {
    const to = i === at ? i + 1 : i;          // clicking the current step marks it done
    const { error } = await supabase.from("engagements").update({ process_step: to }).eq("id", e.id);
    if (error) throw new Error(error.message);
    await reload?.();
  }, "Process updated");
  return (
    <div className="stack" style={{ gap: 6, marginBottom: 16 }}>
      <div className="stepper">
        {steps.map((label, i) => {
          const cls = i < at ? "done" : i === at ? "now" : "";
          return readOnly
            ? <div key={label} className={`step ${cls}`}>{i < at ? "✓ " : ""}{label}</div>
            : <button key={label} type="button" disabled={busy} className={`step ${cls}`} onClick={() => move(i)} style={{ cursor: "pointer", font: "inherit" }} title={i === at ? "Click to mark this step done" : "Click to move the project to this step"}>{i < at ? "✓ " : ""}{label}</button>;
        })}
      </div>
      {!readOnly && <span className="muted small">{at >= steps.length ? "All steps done. The client sees this on their page." : `Now: ${steps[at]}. Click it when it's done, or click another step to move there. The client sees this line.`}</span>}
    </div>
  );
}

/** Invoiced / paid / owed, per currency. */

  return (

/** The project's OneDrive folder, live: click a folder to go in, a file to open it in OneDrive, upload, new folder. */
function ProjectOneDrive({ e, reload }) {
  const [run, busy] = useAction();
  const toast = useToast();
  const start = e.onedrive_folder_id ? { drive: e.onedrive_drive_id, id: e.onedrive_folder_id, name: String(e.onedrive_path || "").split(" / ").pop() || "Project folder", url: e.onedrive_url } : null;
  const [trail, setTrail] = useState(start ? [start] : []);
  const [items, setItems] = useState(null);
  const here = trail[trail.length - 1];
  const go = (t) => run(async () => { const r = await callFn("onedrive", { action: "browse", engagement_id: e.id, drive: t[t.length - 1].drive, item: t[t.length - 1].id }); setTrail(t); setItems(r.items); });
  useEffect(() => { if (start) go([start]); }, [e.onedrive_folder_id]);  // eslint-disable-line react-hooks/exhaustive-deps
  if (!start) return <OneDriveCard e={e} reload={reload} />;
  const openItem = (it) => (it.folder ? go([...trail, { drive: it.drive, id: it.id, name: it.name, url: it.url }]) : window.open(it.url, "_blank", "noopener"));
  const upload = (files) => run(async () => {
    for (const f of files) {
      if (f.size > 25 * 1048576) throw new Error(`${f.name} is over 25 MB: drop it into OneDrive directly`);
      const b64 = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => bad(new Error("could not read the file")); r.readAsDataURL(f); });
      await callFn("onedrive", { action: "upload", engagement_id: e.id, drive: here.drive, item: here.id, name: f.name, contentBase64: b64 });
    }
    await go(trail);
  }, files.length === 1 ? "Uploaded to OneDrive" : `${files.length} files uploaded to OneDrive`);
  const sync = () => run(async () => { const r = await callFn("onedrive", { action: "sync", engagement_id: e.id }); toast(`Synced: ${r.uploaded ?? 0} to OneDrive, ${r.downloaded ?? 0} to Solonos`); await go(trail); });
  return (
    <Card title={<span>{e.onedrive_path || "OneDrive"}</span>} right={<span className="row"><button className="btn" disabled={busy} onClick={sync} title="Solonos copies NDAs, letters and invoices here by itself every 15 minutes">Sync now</button><a className="btn" href={here?.url || e.onedrive_url} target="_blank" rel="noreferrer">Open in OneDrive</a></span>}>
      <div className="row wrap" style={{ gap: 6, marginBottom: 10 }}>
        {trail.map((t, i) => <React.Fragment key={t.id}>{i > 0 && <span className="muted">›</span>}<button className="btn" onClick={() => go(trail.slice(0, i + 1))}>{t.name}</button></React.Fragment>)}
        <span style={{ marginLeft: "auto" }} className="row">
        </span>
      </div>
      <div onDragOver={(x) => x.preventDefault()} onDrop={(x) => { x.preventDefault(); const fs = [...(x.dataTransfer.files ?? [])]; if (fs.length) upload(fs); }}>
        {items === null ? <span className="muted small">{busy ? "Opening the folder…" : "Could not open the folder."}</span> : items.length === 0 ? <Empty title="Empty folder">Drop files here to upload them.</Empty> : (
          <div className="stack" style={{ gap: 4, opacity: busy ? .6 : 1 }}>
            {items.map((it) => (
              <div key={it.id} className="leadrow" onClick={() => openItem(it)} title={it.folder ? "Open folder" : "Open in OneDrive"}>
                <span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileIcon(it)} <span style={{ fontWeight: it.folder ? 600 : 500 }}>{it.name}</span></span>
                <span className="muted small" style={{ flex: "none" }}>{it.folder ? `${it.count ?? ""} item${it.count === 1 ? "" : "s"}` : fileSize(it.size)}{it.modified ? ` · ${day(it.modified)}` : ""}</span>
              </div>
            ))}
          </div>
        )}
        {trail.length > 1 ? (
          <div style={{ marginTop: 12 }}><DropZone busy={busy} onFiles={(fs) => upload([...fs])} label={`Drop files here to upload them into ${here.name}, or click to choose (up to 25 MB each; bigger files: Open in OneDrive)`} /></div>
        ) : <p className="muted small" style={{ marginTop: 10 }}>Open a folder (for example 4. Uploads), then drag files onto it. NDAs, letters and invoices made in Solonos land in these folders by themselves.</p>}
      </div>
    </Card>
  );
}

/** Engagement letter for projects that are not valuations: write it in Word, upload it, email it, upload the signed copy. */
function LetterSlot({ e }) { return <DocSlot e={e} kind="engagement_letter" title="Engagement letter" docName="Engagement Letter" what="our engagement letter" />; }

/** Upload a document, email it, upload the signed copy. Used for the NDA and the engagement letter. */
function DocSlot({ e, kind, title, docName, what, extra }) {
  const [run, busy] = useAction();
  const [docs, setDocs] = useState([]);
  const [mail, setMail] = useState(null);
  const load = useCallback(async () => {
    const { data } = await supabase.from("documents").select("*").eq("engagement_id", e.id).eq("kind", kind).order("created_at", { ascending: false });
    setDocs(data ?? []);
  }, [e.id, kind]);
  useEffect(() => { load(); }, [load]);
  const who = e.company_name || e.client_name;
  const up = (file, signed) => { if (!file) return; run(async () => {
    const name = `${who} - ${docName}${signed ? " - signed" : ""}`;
    const ext = (file.name.match(/\.[A-Za-z0-9]+$/) || [".pdf"])[0];
    const path = `${e.id}/${Date.now()}-${name.replace(/[^A-Za-z0-9.]+/g, "-")}${ext}`;
    const { error } = await supabase.storage.from("deliverables").upload(path, file);
    if (error) throw new Error(error.message);
    const { error: e2 } = await supabase.from("documents").insert({ engagement_id: e.id, kind, name, storage_path: `deliverables/${path}`, visibility: "internal", uploaded_by: "staff", meta: { signed, signed_on: signed ? new Date().toISOString().slice(0, 10) : null } });
    if (e2) throw new Error(e2.message);
    await load();
  }, signed ? "Signed copy saved" : "Saved. Nothing was emailed"); };
  const open = async (d) => window.open(await signedUrl(d.storage_path), "_blank");
  const write = (d) => { const first = String(e.client_name || "").trim().split(/\s+/)[0]; setMail({ d, to: e.client_email || "", subject: d.name, text: `Dear ${first},\n\nPlease find attached ${what}. Please sign it and send it back by replying to this email.\n\nKind regards,\nKyriacos\nUK-Qualified Chartered Accountant (ICAEW)\nConsortia Advisory` }); };
  const send = (m) => run(async () => { await callFn("engagement-send", { kind: "project_email", engagement_id: e.id, to: m.to, subject: m.subject, text: m.text, files: [mail.d.storage_path] }); setMail(null); }, "Emailed");
  const signed = docs.some((d) => d.meta?.signed);
  const remove = (d) => { if (!window.confirm(`Remove "${d.name}" from Solonos? (The copy in OneDrive, if any, stays.)`)) return; run(async () => {
    const { error } = await supabase.from("documents").delete().eq("id", d.id);
    if (error) throw new Error(error.message);
    const [bucket, ...rest] = String(d.storage_path).split("/");
    await supabase.storage.from(bucket).remove([rest.join("/")]);
    await load();
  }, "Removed"); };
  const inpRef = useRef(null);
  const [pickSigned, setPickSigned] = useState(false);
  const pick = (label, isSigned) => <button type="button" className="btn" disabled={busy} onClick={() => { setPickSigned(isSigned); inpRef.current?.click(); }}>{busy ? "Uploading…" : label}</button>;
  return (
    <Card title={title} right={signed ? <Chip kind="ok">Signed</Chip> : null}>
      <div className="stack" style={{ gap: 6 }}>
        {docs.length === 0 && <span className="muted small">Nothing yet. Upload it here, then email it.</span>}
        {docs.map((d) => (
          <div key={d.id} className="row between small">
            <span>{d.name}{d.meta?.signed ? <span style={{ color: "var(--ok)" }}> ✓</span> : null}<div className="muted">{ago(d.created_at)}</div></span>
            <span className="row">{!d.meta?.signed && <button className="btn" disabled={busy} onClick={() => write(d)}>Email…</button>}<button className="btn" onClick={() => open(d)}>Open</button><button className="btn" disabled={busy} onClick={() => remove(d)} title="Remove">✕</button></span>
          </div>
        ))}
        <input ref={inpRef} type="file" accept=".pdf,.doc,.docx" style={{ display: "none" }} onChange={(x) => { up(x.target.files?.[0], pickSigned); x.target.value = ""; }} />
        {!signed && <div className="row wrap" style={{ marginTop: 6 }}>{pick(docs.length ? "Upload a new version" : `Upload ${title === "NDA" ? "NDA" : title.toLowerCase()}`, false)}{pick("Upload signed copy", true)}{extra}</div>}
        {signed && <span className="muted small">Signed. To replace it, remove the signed copy first.</span>}
      </div>
      {mail && <EmailDialog title={`Email the ${title === "NDA" ? "NDA" : title.toLowerCase()}`} to={mail.to} subject={mail.subject} text={mail.text} attached={`${mail.d.name}`} busy={busy} onSend={send} onCancel={() => setMail(null)} />}
    </Card>
  );
}

/** Invoices of any amount. Creating one makes the PDF only; you email it yourself with your own text. */
function SimpleInvoices({ e, invoices, reload, bare }) {
  const [run, busy] = useAction();
  const [form, setForm] = useState(null);
  const [mail, setMail] = useState(null);
  const create = () => run(async () => {
    const inv = await rpc("staff_add_invoice", { p_engagement: e.id, p_amount: Number(form.amount), p_description: form.description, p_currency: form.currency });
    await callFn("engagement-send", { kind: "invoice_pdf", invoice_id: inv.id, email: false });

  }, "Invoice created. Nothing was emailed");

  const paid = (i) => run(async () => { await rpc("staff_mark_invoice_paid", { p_invoice: i.id }); await reload(); }, "Marked paid");
  const receipt = (i) => run(() => callFn("engagement-send", { kind: "receipt", invoice_id: i.id, email: false }).then(reload), "Receipt created. Nothing was emailed");
  const no = (i) => (i.invoice_no ? `${i.issuing_entity}-${String(i.invoice_no).padStart(4, "0")}` : "");
  const write = (i) => {
    const first = String(e.client_name || "").trim().split(/\s+/)[0];
    setMail({ inv: i, to: e.client_email || "", subject: `Invoice ${no(i)} - ${e.company_name || e.client_name}`,
      text: `Dear ${first},\n\nPlease find attached invoice ${no(i)} for ${money(i.amount, i.currency)}: ${invoiceName(i)}. The bank details are on the invoice.\n\nKind regards,\nKyriacos\nUK-Qualified Chartered Accountant (ICAEW)\nConsortia Advisory` });
  };
  const send = (m) => run(async () => { await callFn("engagement-send", { kind: "invoice_email", invoice_id: mail.inv.id, to: m.to, subject: m.subject, text: m.text }); setMail(null); await reload(); }, "Invoice emailed");
  const issue = (i) => run(async () => { await callFn("engagement-send", { kind: "invoice_pdf", invoice_id: i.id, email: false }); await reload(); }, "Invoice numbered and PDF made. Nothing was emailed");
  return (
    <Section bare={bare} title="Invoices" right={!form && <button className="btn primary" onClick={() => setForm({ description: `${typeLabel(e.engagement_type)}${e.company_name ? ` - ${e.company_name}` : ""}`, amount: "", currency: "EUR" })}>New invoice</button>}>
      {form && (
        <div className="card" style={{ padding: 12, background: "var(--sunken)", marginBottom: 12 }}>
          <div className="stack" style={{ gap: 10 }}>
            <Field label="What it is for (shown on the invoice)"><input value={form.description} onChange={(x) => setForm({ ...form, description: x.target.value })} /></Field>
            <div className="row wrap" style={{ gap: 6 }}>{["Deposit", "First instalment (50%)", "Final instalment", "Retainer", "Success fee", "Additional work"].map((t) => <button key={t} className="btn" type="button" onClick={() => setForm({ ...form, description: `${typeLabel(e.engagement_type)}${e.company_name ? ` - ${e.company_name}` : ""} - ${t}` })}>{t}</button>)}</div>
            <div className="grid2">
              <Field label="Amount (no VAT)"><input type="number" min="0" step="50" value={form.amount} onChange={(x) => setForm({ ...form, amount: x.target.value })} placeholder="e.g. 2500" /></Field>
              <Field label="Currency"><select value={form.currency} onChange={(x) => setForm({ ...form, currency: x.target.value })}><option>EUR</option><option>GBP</option></select></Field>
            </div>
            <p className="muted small" style={{ margin: 0 }}>Made out to the details in "Invoice to" above. It gets its number now; nothing is emailed until you press Email.</p>
            <div className="row">
              <button className="btn primary" disabled={busy || !(Number(form.amount) > 0) || !form.description.trim()} onClick={create}>Create invoice</button>
              <button className="btn" onClick={() => setForm(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
      {invoices.length === 0 ? !form && <span className="muted small">No invoices.</span> : (
        <table className="table"><tbody>
          {invoices.map((i) => (
            <tr key={i.id}>
              <td><div>{invoiceName(i)}</div><div className="muted small">{no(i) || "not issued yet"}{i.due_at && ` · due ${day(i.due_at)}`}</div>
                {i.client_claimed_at && i.status === "issued" && <div className="small" style={{ color: "var(--accent)", fontWeight: 600 }}>Client says paid {ago(i.client_claimed_at)}{i.client_reference ? ` · ref ${i.client_reference}` : ""}. Check the bank, then Mark paid.</div>}</td>
              <td style={{ textAlign: "right" }}>{money(i.amount, i.currency)}</td>
              <td style={{ textAlign: "right" }}>
                <span className="row" style={{ justifyContent: "flex-end" }}>
                  {i.pdf_path && <button className="btn" onClick={() => open(i.pdf_path)}>PDF</button>}
                  {i.invoice_no && i.status !== "void" && <button className="btn" disabled={busy} onClick={() => write(i)}>Email…</button>}
                  {i.receipt_path && <button className="btn" onClick={() => open(i.receipt_path)}>Receipt</button>}
                  {i.status === "paid" && !i.receipt_path && <button className="btn" disabled={busy} onClick={() => receipt(i)}>Create receipt</button>}
                  {i.status === "scheduled" && <button className="btn primary" disabled={busy} onClick={() => issue(i)}>Issue</button>}
                  {i.status === "issued" ? <button className="btn" disabled={busy} onClick={() => paid(i)}>Mark paid</button> : i.status !== "scheduled" && <Chip kind={i.status === "paid" ? "ok" : ""}>{i.status}</Chip>}
                </span>
              </td>
            </tr>
          ))}
        </tbody></table>
      )}
      {mail && <EmailDialog title={`Email invoice ${no(mail.inv)}`} to={mail.to} subject={mail.subject} text={mail.text} attached={`Invoice ${no(mail.inv)}.pdf`} busy={busy} onSend={send} onCancel={() => setMail(null)} />}
    </Section>
  );
}

function Stepper({ stage }) {
  const idx = stageIndex(stage);
  const steps = ENGAGEMENT_STAGES.slice(0, 7);
  const ref = useRef(null);
  useEffect(() => {        // on a phone, bring the current stage into view
    const b = ref.current, now = b?.querySelector(".step.now");
    if (b && now && b.scrollWidth > b.clientWidth) b.scrollLeft = Math.max(0, now.offsetLeft - b.offsetLeft - 24);
  }, [stage]);
  return (
    <div className="stepper" ref={ref}>
      {steps.map((s, i) => {
        const cls = stage === "declined" ? (i < 7 ? "declined" : "") : i < idx ? "done" : i === idx ? "now" : "";
        return <div key={s.key} className={`step ${cls}`}>{s.label}</div>;
      })}
    </div>
  );
}

/* ---------------------------------------------------------------- next step by stage */
function NextStep({ e, st, deposit, docs, invoices, agreements, reload }) {
  const [run, busy] = useAction();
  const toast = useToast();

  const advance = (to) => run(() => rpc("staff_advance_engagement", { p_id: e.id, p_to: to }).then(reload), `Moved to ${stageLabel(to)}`);

  const body = (() => {
    switch (e.stage) {
      case "deposit_pending":
      case "nda_pending": return <SendNdaStep e={e} agreements={agreements} reload={reload} />;
      case "docs_pending":
      case "review_pending":
      case "proposal": return <SendNdaStep e={e} agreements={agreements} reload={reload} />;
      case "engaged": return (
        <p className="small" style={{ margin: 0 }}>
          Letter signed, Invoice 1 issued (right). When the transfer lands, mark it paid there, then start the valuation.
        </p>
      );
      case "valuation_active": return <p className="small" style={{ margin: 0 }}>Valuation under way. Tasks and emails are below.</p>;
      case "completed": return <p className="small" style={{ margin: 0 }}>Done. Invoice 2 paid, final report delivered.</p>;
      case "declined": return <p className="small" style={{ margin: 0 }}>Declined{e.declined_reason ? `: ${e.declined_reason}` : ""}. Deposit kept.</p>;
      default: return null;
    }
  })();

  return (
    <Card title={`Now: ${stageLabel(e.stage)}`} right={st?.next && (
      <button className="btn primary" disabled={busy} onClick={() => advance(st.next)}>{st.nextLabel}</button>
    )}>
      {body}
      {st?.next && <p className="muted small" style={{ margin: "12px 0 0" }}>Unlocks when: {st.gate}.</p>}
    </Card>
  );
}

async function callFn(name, body) {
  const { data, error } = await supabase.functions.invoke(name, { body });
  if (error) throw new Error((await error.context?.json?.().catch(() => null))?.error ?? error.message);
  if (data?.ok === false) throw new Error(data.error);
  return data;
}

function SendNdaStep({ e, agreements, reload }) {
  const [run, busy] = useAction();
  const nda = agreements.filter((a) => a.kind === "nda" && a.status !== "void").at(-1);
  const stamp = () => run(() => callFn("engagement-send", { kind: "stamp", agreement_id: nda.id, force: true }).then(reload), "Signed copy created and emailed");
  const open = async (path) => window.open(await signedUrl(path), "_blank");
  const invite = () => run(() => callFn("engagement-send", { engagement_id: e.id, kind: "invite" }).then(reload), e.sent_at ? "Invitation resent" : "Invitation sent");
  return (
    <div className="stack">
      {e.sent_at ? <div className="small">Invitation sent {day(e.sent_at)}{e.deposit_required ? " with the deposit invoice" : ""}.</div>
        : <p className="small" style={{ margin: 0 }}>One click emails the client from info@ with the link to their Solonos page{e.deposit_required ? " and the €1,000 deposit invoice" : ""}. They confirm their company details, the NDA is generated for them to sign, then the engagement letter follows.</p>}
      {nda ? (
        <div className="row wrap small">NDA v{nda.version} <Chip kind={nda.status === "signed" ? "ok" : "warn"}>{nda.status}</Chip> sent {day(nda.sent_at)}{nda.signed_at && ` · signed ${day(nda.signed_at)}`}
          {(nda.signed_pdf_path ?? nda.pdf_path) && <button className="btn" onClick={() => open(nda.signed_pdf_path ?? nda.pdf_path)}>Open PDF</button>}
          {nda.status === "signed" && !nda.signed_pdf_path && <button className="btn" disabled={busy} onClick={stamp}>Create signed copy</button>}
        </div>
      ) : e.sent_at ? <div className="muted small">NDA will be generated as soon as the client confirms their company details.</div> : null}
      <div className="row">
        <button className="btn primary" disabled={busy} onClick={invite}>{e.sent_at ? "Resend invitation" : "Send invitation"}</button>
        <a className="btn" href={`${PORTAL_URL}?as=${e.id}`} target="_blank" rel="noreferrer">Preview client's page</a>
      </div>
      {nda?.status !== "signed" && <OfflineNda e={e} reload={reload} />}
    </div>
  );
}

/** Staff vouch for the details (offline clients); the engagement letter needs them confirmed before it goes out. */
function ConfirmDetailsBtn({ e, reload }) {
  const [run, busy] = useAction();
  const can = !!e.company_address && !!e.company_country;
  return <button className="btn" disabled={busy || !can} title={can ? "Use these details for the engagement letter" : "Fill in address and country first (Edit)"} onClick={() => run(() => rpc("staff_confirm_details", { p_engagement: e.id }).then(reload), "Details confirmed")}>Confirm details myself</button>;
}

/** The client signed the NDA on paper or by email: store the signed PDF and move on as if signed on the portal. */
function OfflineNda({ e, reload }) {
  const [run, busy] = useAction();
  const [openF, setOpenF] = useState(false);
  const [file, setFile] = useState(null);
  const [on, setOn] = useState(new Date().toISOString().slice(0, 10));
  if (!openF) return <button className="linklike small" style={{ alignSelf: "flex-start", background: "none", border: "none", padding: 0, color: "var(--accent)", cursor: "pointer" }} onClick={() => setOpenF(true)}>NDA signed outside Solonos? Upload it here</button>;
  const save = () => run(async () => {
    if (!file) throw new Error("Choose the signed NDA file");
    const title = `${e.company_name || e.client_name} - Non Disclosure Agreement - signed`;
    const ext = (file.name.match(/\.[A-Za-z0-9]+$/) || [".pdf"])[0];
    const path = `${e.id}/${Date.now()}-${title.replace(/[^A-Za-z0-9.]+/g, "-")}${ext}`;
    const { error } = await supabase.storage.from("agreements").upload(path, file, { upsert: true });
    if (error) throw new Error(error.message);
    await rpc("staff_record_nda_offline", { p_engagement: e.id, p_signed_pdf_path: `agreements/${path}`, p_signed_on: on });
    setOpenF(false); setFile(null); await reload();
  }, "NDA recorded as signed. The engagement moved to Documents pending.");
  return (
    <div className="card" style={{ padding: 12, background: "var(--sunken)" }}>
      <div className="small" style={{ fontWeight: 600, marginBottom: 6 }}>NDA signed outside Solonos</div>
      <p className="muted small" style={{ margin: "0 0 10px" }}>Upload the signed copy. Solonos marks the NDA signed, puts the copy on the client's page and moves the engagement to Documents pending, exactly as if they had signed on the portal.</p>
      <div className="row wrap">
        <input type="file" accept=".pdf,image/*" onChange={(x) => setFile(x.target.files?.[0] ?? null)} />
        <label className="small row" style={{ gap: 6 }}>Signed on <input type="date" value={on} max={new Date().toISOString().slice(0, 10)} onChange={(x) => setOn(x.target.value)} /></label>
      </div>
      <div className="row" style={{ marginTop: 10 }}>
        <button className="btn primary" disabled={busy || !file} onClick={save}>Record signed NDA</button>
        <button className="btn" disabled={busy} onClick={() => setOpenF(false)}>Cancel</button>
      </div>
    </div>
  );
}

/** The €1,000 deposit is not set at conversion; staff ask for it here when the time is right. */

  const open = ["nda_pending", "docs_pending", "review_pending", "proposal"].includes(e.stage);
