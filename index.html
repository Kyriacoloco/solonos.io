<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solonos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet" />
<style>
:root {
  --brand: #800020; --accent: #0C4767; --accent-dk: #0a3a54;
  --on: #FAF3E9; --surface: #FAF3E9; --sunken: #F3E7DE; --bg: #EFE2D8;
  --border: #DCC6BF; --border-sub: #E6D4CD; --border-dash: #C9ABA3;
  --text: #2A1E20; --text-2: #463639; --text-3: #5A4548; --muted: #6B5457;
  --danger: #9A3B1A; --ok: #2F6B3A; --warn: #8A5A00;
}
* { box-sizing: border-box; }
html, body, #root { margin: 0; height: 100%; }
body { font: 14px/1.5 Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; }
h1 { font: 600 28px/1.15 Newsreader, serif; margin: 0; letter-spacing: -0.01em; }
h2 { font: 600 20px/1.2 Newsreader, serif; margin: 0; }
h3 { font: 600 14px/1.3 Inter, sans-serif; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.serif { font-family: Newsreader, serif; }

/* shell */
.shell { display: flex; min-height: 100vh; }
.sidebar { width: 216px; flex: none; background: var(--brand); color: var(--on); display: flex; flex-direction: column; padding: 20px 14px; gap: 2px; position: sticky; top: 0; height: 100vh; }
.sidebar .wordmark { font: 600 18px Newsreader, serif; padding: 4px 10px 18px; }
.sidebar a { display: flex; justify-content: space-between; align-items: center; color: var(--on); opacity: .78; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
.sidebar a:hover { opacity: 1; background: rgba(255,255,255,.08); }
.sidebar a.active { opacity: 1; background: rgba(255,255,255,.16); font-weight: 600; }
.sidebar a .soon { font-size: 10px; opacity: .6; }
.sidebar .foot { margin-top: auto; padding: 10px; font-size: 12px; opacity: .8; }
.sidebar .foot button { background: none; border: 1px solid rgba(255,255,255,.35); color: var(--on); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; margin-top: 8px; }
.main { flex: 1; min-width: 0; padding: 28px 32px 60px; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.pagehead p { margin: 4px 0 0; color: var(--muted); }

/* primitives */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.card .cardhead { padding: 12px 16px; border-bottom: 1px solid var(--border-sub); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card .cardbody { padding: 14px 16px; }
.btn { border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font: 500 12px Inter, sans-serif; background: var(--sunken); color: var(--text); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--border-dash); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--on); border-color: var(--accent); padding: 8px 14px; font-weight: 600; }
.btn.primary:hover { background: var(--accent-dk); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.link { background: none; border: none; color: var(--accent); padding: 0; }
.chip { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 9px; background: var(--sunken); color: var(--text-2); white-space: nowrap; }
.chip.brand { background: var(--brand); color: var(--on); }
.chip.accent { background: var(--accent); color: var(--on); }
.chip.ok { background: #DDEBD9; color: var(--ok); }
.chip.warn { background: #F5E4C0; color: var(--warn); }
.chip.danger { background: #F1D5CB; color: var(--danger); }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 1100px) { .main .grid2, .main .grid3 { grid-template-columns: 1fr; } }
@media (max-width: 800px) { .drawer .grid2 { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--text-3); }
.field input, .field select, .field textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }

.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); margin: 0; }
.kv dd { margin: 0; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--border-sub); vertical-align: middle; }
.table tr.click { cursor: pointer; }
.table tr.click:hover td { background: var(--sunken); }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--text); font: 600 16px Newsreader, serif; margin-bottom: 4px; }
.err { background: #F1D5CB; color: var(--danger); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.note { background: var(--sunken); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--text-3); }

/* stepper */
.stepper { display: flex; gap: 0; align-items: stretch; }
.step { flex: 1; padding: 8px 10px; border-top: 3px solid var(--border-sub); font-size: 11px; color: var(--muted); }
.step.done { border-top-color: var(--accent); color: var(--text-2); }
.step.now { border-top-color: var(--brand); color: var(--brand); font-weight: 600; }
.step.declined { border-top-color: var(--danger); color: var(--danger); }

/* reports */
.pills { display: flex; gap: 4px; background: var(--sunken); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.pills button { border: none; background: transparent; color: var(--text-2); padding: 6px 12px; border-radius: 7px; font: 500 12px Inter, sans-serif; cursor: pointer; }
.pills button.on { background: var(--accent); color: var(--on); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.stat .lbl { font-size: 12px; color: var(--muted); }
.stat .val { font: 600 28px/1.1 Newsreader, serif; margin: 6px 0 4px; }
.stat .sub { font-size: 12px; color: var(--text-3); }
.stat.hero { background: var(--accent); border-color: var(--accent); color: var(--on); }
.stat.hero .lbl, .stat.hero .sub { color: var(--on); opacity: .8; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table tr.total td { font-weight: 700; background: var(--sunken); border-top: 2px solid var(--border); }
.table td.ghost { color: var(--warn); font-style: italic; }
.fbar { height: 14px; background: var(--accent); border-radius: 3px; min-width: 3px; transition: width .3s; }
.table td.bar { width: 34%; padding-right: 24px; }
.src { font-size: 10px; padding: 1px 7px; border-radius: 9px; color: var(--on); background: var(--text-3); vertical-align: middle; margin-left: 6px; }
.src.meta { background: var(--accent); } .src.ghl { background: var(--warn); } .src.sol { background: var(--brand); }
.modal-bg { position: fixed; inset: 0; background: rgba(42,30,32,.35); z-index: 30; display: grid; place-items: center; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; width: min(420px, 92vw); box-shadow: 0 12px 40px rgba(0,0,0,.2); }
.modal .opts { display: grid; gap: 6px; margin: 14px 0; }
.modal .opts button { text-align: left; border: 1px solid var(--border); background: var(--sunken); border-radius: 8px; padding: 9px 12px; font: 500 13px Inter, sans-serif; color: var(--text); cursor: pointer; }
.modal .opts button:hover, .modal .opts button.on { border-color: var(--accent); background: #E6EEF2; }

/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--sunken); border-radius: 12px; padding: 10px; min-height: 300px; }
.col h3 { padding: 2px 6px 10px; display: flex; justify-content: space-between; }
.col h3 span { color: var(--muted); font-weight: 400; }
.lead { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.lead:hover { border-color: var(--accent); }
.lead .name { font-weight: 600; }
.lead .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 4px; }

/* drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(42,30,32,.35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--surface); border-left: 1px solid var(--border); z-index: 21; overflow-y: auto; padding: 22px 24px; }
.drawer h2 { margin-bottom: 4px; }
.drawer .x { position: absolute; top: 14px; right: 16px; }

/* feed */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-sub); font-size: 12px; }
.feed li:last-child { border-bottom: none; }
.feed .when { color: var(--muted); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--on); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.toast.error { background: var(--danger); }

/* docx preview */
.docx { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 32px 40px; max-height: 70vh; overflow-y: auto; font-family: "Times New Roman", serif; color: #111; }
.docx p { margin: 0 0 8px; }
.docx table { border-collapse: collapse; }
.docx td { border: 1px solid #ccc; padding: 4px 6px; }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; background: var(--brand); color: var(--on); }
.login .box { width: 380px; }
.login h1 { color: var(--on); font-size: 34px; }
.login p { opacity: .8; }
.login input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.08); color: var(--on); font: inherit; }
.login .btn.primary { width: 100%; margin-top: 10px; padding: 11px; font-size: 14px; }

@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(30px); opacity: 0; } } }
@media (max-width: 800px) { .sidebar { display: none; } .main { padding: 18px; } }

</style>

<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
// =====================================================================
// SOLONOS — single-file app. Only two things you ever change here:
const SUPABASE_URL = "https://uirbiqfkgnfnfugfclmu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hrhOfXXHVMivsY0rritFKQ_WhQE2TIl";
const TURNSTILE_SITE_KEY = "0x4AAAAAAEybfN1dVcW9utbF";   // Cloudflare Turnstile (empty = no captcha)
const APP_VERSION = "2.4";   // major = big build, minor = small change; shown bottom-left
// =====================================================================

import React, { Fragment, createContext, useCallback, useContext, useEffect, useState } from "https://esm.sh/react@18.3.1";
import ReactDOM from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
import { BrowserRouter, NavLink, Navigate, Route, Routes, useNavigate, useParams, useLocation, Link } from "https://esm.sh/react-router-dom@6.26.2?deps=react@18.3.1,react-dom@18.3.1";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

// ===================== lib/stages.js =====================
// Engagement stages in order, with what the trainee sees and what unlocks the next one.
const ENGAGEMENT_STAGES = [
  { key: "nda_pending",     label: "Invited",            next: "docs_pending",     nextLabel: "Move to documents", gate: "NDA signed on the portal (moves on its own)" },
  { key: "docs_pending",    label: "Documents pending",  next: "review_pending",   nextLabel: "Move to review",    gate: "every required document uploaded (moves on its own)" },
  { key: "review_pending",  label: "Documents in",       next: "proposal",         nextLabel: "Move to proposal",  gate: "nothing; use this when you're preparing the letter" },
  { key: "proposal",        label: "Letter sent",        next: "engaged",          nextLabel: "Move to engaged",   gate: "engagement letter signed and fee set (moves on its own)" },
  { key: "engaged",         label: "Engaged",            next: "valuation_active", nextLabel: "Start valuation",   gate: "Invoice 1 paid and €1,000 deposit received" },
  { key: "valuation_active",label: "Valuation active",   next: null },
  { key: "completed",       label: "Completed",          next: null },
  { key: "declined",        label: "Declined",           next: null },
  { key: "deposit_pending", label: "Not sent",           next: "nda_pending",      nextLabel: "Mark as sent", gate: "" },
];
const stageIndex = (key) => ENGAGEMENT_STAGES.findIndex((s) => s.key === key);
const stageLabel = (key) => ENGAGEMENT_STAGES.find((s) => s.key === key)?.label ?? key;
const LIVE_STAGES = ["deposit_pending","nda_pending","docs_pending","review_pending","proposal","engaged","valuation_active"];

const APPROACHES = [
  { key: "dcf", label: "Income approach (DCF)" },
  { key: "cca", label: "Market approach: comparable companies" },
  { key: "pt",  label: "Market approach: precedent transactions" },
  { key: "nav", label: "Asset-based approach (NAV)" },
];

const INVOICE_NAMES = { 0: "Deposit (€1,000)", 1: "Invoice 1 (on signing)", 2: "Invoice 2 (before final report)" };
const PORTAL_URL = window.location.origin + "/portal";

const eur = (n) => new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(Number(n || 0));
const money = (n, ccy = "EUR") => new Intl.NumberFormat("en-IE", { style: "currency", currency: ccy, maximumFractionDigits: 2 }).format(Number(n || 0));
const day = (d) => (d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "");
/** "Mon 21 Sept, 14:00" in the viewer's own time zone; with full=true also the year. */
const callWhen = (iso, full = false) => {
  const d = new Date(iso);
  const date = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", ...(full ? { year: "numeric" } : {}) });
  const time = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  return `${date}, ${time}`;
};
const ago = (d) => {
  if (!d) return "";
  const h = (Date.now() - new Date(d).getTime()) / 36e5;
  if (h < 1) return "just now";
  if (h < 24) return `${Math.floor(h)}h ago`;
  const days = Math.floor(h / 24);
  return days === 1 ? "yesterday" : `${days}d ago`;
};

// ===================== lib/supabase.js =====================
const url = SUPABASE_URL;
const key = SUPABASE_ANON_KEY;
const configured = Boolean(url && key);
const supabase = configured ? createClient(url, key, { auth: { flowType: "implicit", detectSessionInUrl: true } }) : null;

/** Call a Postgres function and turn its error into a plain message the UI can show. */
async function rpc(fn, args) {
  const { data, error } = await supabase.rpc(fn, args);
  if (error) throw new Error(cleanError(error.message));
  return data;
}

/** Sign out that always works: clear the browser session first, then reload to the right start page. */
async function logout(to) {
  try { await supabase.auth.signOut({ scope: "local" }); } catch (_) {}
  try { await supabase.auth.signOut(); } catch (_) {}
  window.location.href = to ?? (window.location.pathname.startsWith("/portal") ? "/portal" : "/");
}

/** "Gate: NDA not signed" instead of Postgres noise. */
function cleanError(msg = "") {
  return msg.replace(/^.*?(Gate:|Cannot|Staff only|Not your|Typed name|Signer email)/, "$1").trim() || "Something went wrong";
}

// ===================== components/ui.jsx =====================
const ToastCtx = createContext(() => {});
function ToastProvider({ children }) {
  const [t, setT] = useState(null);
  const show = useCallback((msg, kind = "ok") => {
    setT({ msg, kind });
    setTimeout(() => setT(null), kind === "error" ? 5000 : 2600);
  }, []);
  return (
    <ToastCtx.Provider value={show}>
      {children}
      {t && <div className={`toast ${t.kind}`}>{t.msg}</div>}
    </ToastCtx.Provider>
  );
}
const useToast = () => useContext(ToastCtx);

/** Run an async action; show its error as a toast; return true on success. */
function useAction() {
  const toast = useToast();
  const [busy, setBusy] = useState(false);
  const run = useCallback(async (fn, okMsg) => {
    setBusy(true);
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) { toast(e.message, "error"); return false; }
    finally { setBusy(false); }
  }, [toast]);
  return [run, busy];
}

function Drawer({ title, sub, onClose, children }) {
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [onClose]);
  return (
    <>
      <div className="drawer-bg" onClick={onClose} />
      <aside className="drawer" role="dialog" aria-label={title}>
        <button className="btn x" onClick={onClose} aria-label="Close">✕</button>
        <h2>{title}</h2>
        {sub && <p className="muted small" style={{ marginTop: 0 }}>{sub}</p>}
        {children}
      </aside>
    </>
  );
}

function Field({ label, children }) {
  return <div className="field"><label>{label}</label>{children}</div>;
}

function Chip({ kind, children, title }) {
  return <span className={`chip ${kind ?? ""}`} title={title}>{children}</span>;
}

function Empty({ title, children }) {
  return <div className="empty"><strong>{title}</strong>{children}</div>;
}

function Card({ title, right, children, style }) {
  return (
    <section className="card" style={style}>
      {title && <div className="cardhead"><h3>{title}</h3>{right}</div>}
      <div className="cardbody">{children}</div>
    </section>
  );
}

// ===================== captcha (Cloudflare Turnstile) =====================
const captchaOn = () => TURNSTILE_SITE_KEY && !TURNSTILE_SITE_KEY.startsWith("PASTE");
function Captcha({ onToken }) {
  const ref = React.useRef(null);
  const idRef = React.useRef(null);
  useEffect(() => {
    if (!captchaOn()) return;
    let tries = 0;
    const t = setInterval(() => {
      if (window.turnstile && ref.current && idRef.current === null) {
        idRef.current = window.turnstile.render(ref.current, { sitekey: TURNSTILE_SITE_KEY, theme: "light", callback: onToken, "expired-callback": () => onToken(null), "error-callback": () => onToken(null) });
        clearInterval(t);
      } else if (++tries > 100) clearInterval(t);
    }, 100);
    return () => { clearInterval(t); if (idRef.current !== null && window.turnstile) { try { window.turnstile.remove(idRef.current); } catch (_) {} } };
  }, []);
  if (!captchaOn()) return null;
  return <div ref={ref} style={{ margin: "10px 0" }} />;
}
const resetCaptcha = () => { try { window.turnstile && window.turnstile.reset(); } catch (_) {} };

// ===================== pages/Login.jsx =====================
function Login() {
  const nav = useNavigate();
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [mode, setMode] = useState("password");   // password | link | reset
  const [sent, setSent] = useState(false);
  const [code, setCode] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [captcha, setCaptcha] = useState(null);

  async function submit(e) {
    e.preventDefault();
    if (captchaOn() && !captcha) { setErr("Please tick the \"I'm not a robot\" box."); return; }
    setBusy(true); setErr("");
    let error;
    if (mode === "password") {
      ({ error } = await supabase.auth.signInWithPassword({ email, password, options: { captchaToken: captcha } }));
      if (error) setErr(error.message === "Invalid login credentials" ? "Wrong email or password." : error.message);
    } else if (mode === "link") {
      ({ error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.origin + "/", captchaToken: captcha } }));
      if (error) setErr(error.message); else setSent(true);
    } else {
      ({ error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + "/reset", captchaToken: captcha }));
      if (error) setErr(error.message); else setSent(true);
    }
    setBusy(false);
    if (error) { setCaptcha(null); resetCaptcha(); }
  }
  async function verify(e) {
    e.preventDefault(); setBusy(true); setErr("");
    const { error } = await supabase.auth.verifyOtp({ email, token: code.trim(), type: mode === "reset" ? "recovery" : "email" });
    setBusy(false);
    if (error) setErr("That code didn't work.");
    else if (mode === "reset") nav("/reset");
  }
  const sw = (m) => (x) => { x.preventDefault(); setMode(m); setErr(""); setSent(false); setCode(""); };

  return (
    <div className="login">
      <form className="box" onSubmit={sent ? verify : submit}>
        <h1>Solonos</h1>
        {sent ? (
          <>
            <p>Check {email}: click the button in the email, or type the code here.{mode === "reset" && " You'll then choose a new password."}</p>

            )}

            {err && <p className="err">{err}</p>}
            <button className="btn primary" disabled={busy}>{busy ? "Working…" : mode === "password" ? "Sign in" : mode === "link" ? "Email me a link" : "Reset my password"}</button>

              {mode !== "link" && <a href="#" style={{ color: "var(--on)", opacity: .85 }} onClick={sw("link")}>Email me a link</a>}
            </p>
          </>
        )}
      </form>
    </div>
  );
}

/** /reset — where the password-reset link and code land. Choose a new password, then straight into the app. */
function ResetPassword() {
  const nav = useNavigate();
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  async function save(e) {
    e.preventDefault();
    if (pw.length < 8) return setErr("At least 8 characters.");
    if (pw !== pw2) return setErr("The two passwords don't match.");
    setBusy(true); setErr("");
    const { error } = await supabase.auth.updateUser({ password: pw });
    setBusy(false);
    if (error) setErr(error.message); else nav("/app/leads");
  }
  return (
    <div className="login">
      <form className="box" onSubmit={save}>
        <h1>New password</h1>
        <p>Choose a password of at least 8 characters.</p>
        <input type="password" placeholder="New password" value={pw} onChange={(e) => setPw(e.target.value)} />
        <input type="password" placeholder="Repeat it" value={pw2} onChange={(e) => setPw2(e.target.value)} style={{ marginTop: 8 }} />
        {err && <p className="err">{err}</p>}
        <button className="btn primary" disabled={busy}>{busy ? "Saving…" : "Save password and sign in"}</button>
      </form>
    </div>
  );
}

function Leads() {
  const [stages, setStages] = useState([]);
  const [leads, setLeads] = useState([]);
  const [engByOpp, setEngByOpp] = useState({});
  const [lastSync, setLastSync] = useState(null);
  const [open, setOpen] = useState(null);
  const [pendingLost, setPendingLost] = useState(null);   // { id, stageId } waiting for a reason

  const load = useCallback(async () => {
    const [s, l, e, sy] = await Promise.all([
      supabase.from("pipeline_stages").select("*").order("position"),
      supabase.from("leads_board").select("*").order("ghl_updated_at", { ascending: false }),
      supabase.from("engagements").select("id, opportunity_id, stage").not("opportunity_id", "is", null),
      supabase.from("sync_log").select("received_at, ok, kind").eq("ok", true).order("id", { ascending: false }).limit(1).maybeSingle(),
    ]);
    setStages(s.data ?? []);
    setLeads(l.data ?? []);
    setEngByOpp(Object.fromEntries((e.data ?? []).map((x) => [x.opportunity_id, x])));
    setLastSync(sy.data);
  }, []);

  useEffect(() => { load(); }, [load]);
  const [run, moving] = useAction();

  if (stages.length === 0) return (
    <>
      <Head lastSync={lastSync} reload={load} />
      <Empty title="No pipeline yet">
        Run the first GHL pull (README step 2) and the stages appear here, in the same order as GHL.
      </Empty>
    </>
  );

  const engOf = (l) => engByOpp[l.ghl_id];
  const SENT = ["nda_pending","docs_pending","review_pending","proposal"], ENGAGED = ["engaged","valuation_active","completed"];
  const inGhl = leads.filter((l) => !engOf(l) || engOf(l).stage === "deposit_pending" || engOf(l).stage === "declined");
  const firstWithLeads = Math.min(...stages.filter((st) => inGhl.some((l) => l.stage_id === st.ghl_id)).map((st) => st.position), Infinity);
  const shownStages = stages.filter((st) => st.position >= firstWithLeads);
  const moveTo = (ghlId, stageId) => run(async () => {
    const { data, error } = await supabase.functions.invoke("ghl-sync", { body: { action: "move", opportunity_id: ghlId, stage_id: stageId } });
    if (error) throw new Error((await error.context?.json?.().catch(() => null))?.error ?? error.message);
    if (data?.ok === false) throw new Error(data.error);
    await load();
  }, "Moved in GHL");
  const isLostStage = (st) => /^lost/i.test(st?.name ?? "");
  const dropTo = (id, stageId) => {
    const st = stages.find((x) => x.ghl_id === stageId);
    if (isLostStage(st)) setPendingLost({ id, stageId });      // ask why first
    else moveTo(id, stageId);
  };
  const lostWithReason = async (reason) => {
    const { id, stageId } = pendingLost; setPendingLost(null);
    const ok = await moveTo(id, stageId);
    if (ok && reason) await run(() => rpc("set_lost_reason", { p_opportunity_id: id, p_reason: reason }).then(load));
  };
  const col = (title, rows, stageId) => (
    <div className="col" key={title} style={{ opacity: moving ? .7 : 1 }}
      onDragOver={(ev) => { if (stageId) { ev.preventDefault(); ev.dataTransfer.dropEffect = "move"; } }}
      onDrop={(ev) => { if (!stageId) return; ev.preventDefault(); const id = ev.dataTransfer.getData("text/plain"); if (id) dropTo(id, stageId); }}>
      <h3>{title}<span>{rows.length}</span></h3>
      {rows.map((l) => <LeadCard key={l.ghl_id} l={l} eng={engOf(l)} onOpen={() => setOpen(l)} draggable={!!stageId} />)}
    </div>
  );
  return (
    <>
      <Head lastSync={lastSync} count={leads.length} reload={load} />
      <div className="board">
        {shownStages.map((st) => col(st.name, inGhl.filter((l) => l.stage_id === st.ghl_id), st.ghl_id))}
        {col("Invited", leads.filter((l) => engOf(l) && SENT.includes(engOf(l).stage)))}
        {col("Engaged", leads.filter((l) => engOf(l) && ENGAGED.includes(engOf(l).stage)))}
      </div>
      {open && <LeadDrawer lead={open} engagement={engByOpp[open.ghl_id]} onClose={() => setOpen(null)} reload={load} />}
      {pendingLost && <LostReasonDialog onPick={lostWithReason} onCancel={() => setPendingLost(null)} />}
    </>
  );
}

/** Notes log: many per lead/engagement, each with its date, add or edit any time. Lead notes follow the lead into the engagement. */
function NotesLog({ opportunityId, engagementId, title = "My notes" }) {
  const [run, busy] = useAction();
  const [notes, setNotes] = useState([]);
  const [draft, setDraft] = useState("");
  const [editing, setEditing] = useState(null);   // { id, body }
  const load = useCallback(async () => {
    let qy = supabase.from("lead_notes").select("*").order("created_at");
    qy = engagementId ? qy.or(`engagement_id.eq.${engagementId}${opportunityId ? `,opportunity_id.eq.${opportunityId}` : ""}`) : qy.eq("opportunity_id", opportunityId);
    const { data } = await qy;
    const seen = new Set(); setNotes((data ?? []).filter((n) => !seen.has(n.id) && seen.add(n.id)));
  }, [opportunityId, engagementId]);
  useEffect(() => { load(); }, [load]);
  const add = () => run(async () => {
    const { data: me } = await supabase.auth.getUser();
    const { error } = await supabase.from("lead_notes").insert({ opportunity_id: opportunityId ?? null, engagement_id: engagementId ?? null, body: draft.trim(), author: me?.user?.email ?? "staff" });
    if (error) throw new Error(error.message);
    setDraft(""); await load();
  }, "Note posted");
  const save = () => run(async () => {
    const { error } = await supabase.from("lead_notes").update({ body: editing.body.trim() }).eq("id", editing.id);
    if (error) throw new Error(error.message);
    setEditing(null); await load();
  }, "Note updated");
  const remove = (id) => run(async () => {
    if (!window.confirm("Delete this note?")) return;
    const { error } = await supabase.from("lead_notes").delete().eq("id", id);
    if (error) throw new Error(error.message);
    await load();
  });
  const box = { width: "100%", padding: 8, borderRadius: 8, border: "1px solid var(--border)", font: "inherit" };
  return (
    <div style={{ marginTop: 22 }}>
      <h3>{title}</h3>
      <div className="stack" style={{ gap: 8, margin: "8px 0" }}>
        {notes.length === 0 && <span className="muted small">No notes yet.</span>}
        {notes.map((n) => (
          <div key={n.id} className="card" style={{ padding: "10px 12px" }}>
            {editing?.id === n.id ? (
              <div className="stack">
                <textarea rows={3} value={editing.body} onChange={(x) => setEditing({ ...editing, body: x.target.value })} style={box} />
                <div className="row"><button className="btn primary" disabled={busy || !editing.body.trim()} onClick={save}>Save</button><button className="btn" onClick={() => setEditing(null)}>Cancel</button></div>
              </div>
            ) : (
              <>
                <div className="small" style={{ whiteSpace: "pre-wrap" }}>{n.body}</div>
                <div className="row between" style={{ marginTop: 6 }}>
                  <span className="muted small">{day(n.created_at)}{n.updated_at !== n.created_at ? " · edited" : ""}</span>
                  <span className="row"><button className="btn link small" onClick={() => setEditing({ id: n.id, body: n.body })}>Edit</button><button className="btn link small" onClick={() => remove(n.id)}>Delete</button></span>
                </div>
              </>
            )}
          </div>
        ))}
      </div>
      <textarea rows={3} value={draft} onChange={(x) => setDraft(x.target.value)} placeholder="Add a note: what they said, objections, what they want…" style={box} />
      <div className="row" style={{ marginTop: 6 }}><button className="btn primary" disabled={busy || !draft.trim()} onClick={add}>Post note</button></div>
    </div>
  );
}

function LeadBuilders({ lead, reload }) {
  const [run, busy] = useAction();
  const [docs, setDocs] = useState([]);
  const load = useCallback(async () => {
    const { data } = await supabase.from("documents").select("*").eq("opportunity_id", lead.ghl_id).eq("kind", "valuation_builder").order("created_at", { ascending: false });
    setDocs(data ?? []);
  }, [lead.ghl_id]);
  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const ch = new BroadcastChannel("solonos");
    ch.onmessage = (m) => { if (m.data?.type === "builder-saved" && m.data.lead === lead.ghl_id) { load(); reload?.(); } };
    return () => ch.close();
  }, [lead.ghl_id, load]);
  const open = async (path) => window.open(await signedUrl(path), "_blank");
  async function upload(file) {
    await run(async () => {
      const path = `leads/${lead.ghl_id}/${Date.now()}-${file.name}`;
      const { error } = await supabase.storage.from("deliverables").upload(path, file);
      if (error) throw new Error(error.message);
      const { error: e2 } = await supabase.from("documents").insert({ opportunity_id: lead.ghl_id, kind: "valuation_builder", name: `${lead.company || lead.name.split("|")[0].trim()} - Market Example Range`, storage_path: `deliverables/${path}`, visibility: "internal", uploaded_by: "staff" });
      if (e2) throw new Error(e2.message);
      await load(); await reload?.();
    }, "Valuation Builder saved on this lead");
  }
  const [sending, setSending] = useState(null);   // the document about to be emailed
  async function sendToClient(d, personal) {
    setSending(null);
    await run(async () => {
      if (!lead.email) throw new Error("This lead has no email address in GHL");
      const blob = await (await fetch(await signedUrl(d.storage_path))).blob();
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("Could not read the PDF")); r.readAsDataURL(blob); });
      const company = d.name.replace(/ - Market Example Range$/, "");
      const first = lead.first_name || lead.name.split("|")[0].trim().split(" ")[0];
      await callFn("send-email", {
        to: lead.email, subject: `${company}: your Market Example Range`,
        html: builderEmail({ first, company, personal }),
        attachment: { filename: `${company} - Market Example Range.pdf`, contentBase64: b64, contentType: "application/pdf" },
      });
      await supabase.from("documents").update({ sent_at: new Date().toISOString() }).eq("id", d.id);
      const { data: me } = await supabase.auth.getUser();
      await supabase.from("lead_notes").insert({ opportunity_id: lead.ghl_id, body: `Market Example Range emailed to ${lead.email}`, author: me?.user?.email ?? "staff" });
      // the offer is out: the lead moves to Full Offer Made in GHL
      const { data: st } = await supabase.from("pipeline_stages").select("ghl_id").ilike("name", "full offer%").maybeSingle();
      if (st && lead.stage_id !== st.ghl_id) {
        const { data, error } = await supabase.functions.invoke("ghl-sync", { body: { action: "move", opportunity_id: lead.ghl_id, stage_id: st.ghl_id } });
        if (error) throw new Error("Email sent, but the move to Full Offer Made failed: " + ((await error.context?.json?.().catch(() => null))?.error ?? error.message));
        if (data?.ok === false) throw new Error("Email sent, but the move to Full Offer Made failed: " + data.error);
      }
      await load(); await reload?.();
    }, "Sent to the client and moved to Full Offer Made");
  }
  const remove = (d) => run(async () => {
    await supabase.storage.from("deliverables").remove([d.storage_path.replace(/^deliverables\//, "")]);
    const { error } = await supabase.from("documents").delete().eq("id", d.id);
    if (error) throw new Error(error.message);
    await load(); await reload?.();
  }, "Removed");
  return (
    <>
      <h3>Valuation Builder</h3>
      <div className="stack" style={{ margin: "8px 0 18px", gap: 6 }}>
        {docs.length === 0 && <span className="muted small">None yet. Open the builder for this lead, press Print when done: the PDF is saved here automatically. It moves with the lead into the engagement and the client sees it on their page.</span>}
        {docs.map((d) => (
          <div key={d.id} className="row between small">
            <span>{d.name}<div className="muted">{ago(d.created_at)}{d.sent_at && <> · <span style={{ color: "var(--ok)" }}>sent {day(d.sent_at)}</span></>}</div></span>
            <span className="row">
              <button className="btn primary" disabled={busy || !lead.email} title={lead.email ? `Email to ${lead.email}` : "No email on this lead"} onClick={() => setSending(d)}>{d.sent_at ? "Send again" : "Send to client"}</button>
              <button className="btn" onClick={() => open(d.storage_path)}>Open</button>
              <button className="btn" disabled={busy} onClick={() => remove(d)}>Remove</button>
            </span>
          </div>
        ))}
        {sending && <SendBuilderDialog doc={sending} lead={lead} onSend={(personal) => sendToClient(sending, personal)} onCancel={() => setSending(null)} />}
        <div className="row">
          <a className="btn primary" href={`/ConsortiaValuationBuilder.html?lead=${encodeURIComponent(lead.ghl_id)}&v=${Date.now()}`} target="_blank" rel="noreferrer">Open Valuation Builder for this lead</a>
          <label className="btn" style={{ cursor: "pointer" }}>{busy ? "Uploading…" : "Attach a PDF"}<input type="file" accept=".pdf" style={{ display: "none" }} disabled={busy} onChange={(x) => x.target.files[0] && upload(x.target.files[0])} /></label>
        </div>
      </div>
    </>
  );
}

function ConvertForm({ lead, onCancel }) {
  const nav = useNavigate();
  const [run, busy] = useAction();
  const c = lead.custom ?? {};
  const [f, setF] = useState({
    client_name: [lead.first_name, lead.last_name].filter(Boolean).join(" "),

    fee: "", approaches: ["dcf", "cca", "pt"],
  });
  const set = (k) => (x) => setF({ ...f, [k]: x.target.type === "checkbox" ? x.target.checked : x.target.value });
  const toggleA = (k) => setF((f) => ({ ...f, approaches: f.approaches.includes(k) ? f.approaches.filter((x) => x !== k) : [...f.approaches, k] }));
  async function create() {
    await run(async () => {
      const e = await rpc("staff_create_engagement", { p_opportunity: lead.ghl_id, p_client_name: f.client_name, p_client_email: f.client_email, p_deposit: f.deposit });
      const { error } = await supabase.from("engagements").update({
        client_title: f.client_title || null, company_name: f.is_individual ? null : (f.company_name || null),
        company_country: f.company_country || null, company_industry: f.company_industry || null, is_individual: f.is_individual,
        fee: f.fee ? Number(f.fee) : null, approaches: f.approaches,
      }).eq("id", e.id);
      if (error) throw new Error(error.message);
      nav(`/app/engagements/${e.id}`);
    });
  }
  const ready = f.client_name && f.client_email;
  return (
    <div className="stack">
      <h3>Convert to engagement</h3>
      <p className="muted small" style={{ margin: 0 }}>Only the name and email are needed. The client completes the company details on their own page; everything else follows from that.</p>
      <Field label="Signatory full name (as it will appear on the NDA and letter)"><input value={f.client_name} onChange={set("client_name")} /></Field>
      <div className="grid2">
        <Field label="Title"><input value={f.client_title} onChange={set("client_title")} placeholder="Director" /></Field>
        <Field label="Email (their portal login)"><input type="email" value={f.client_email} onChange={set("client_email")} /></Field>
      </div>
      <label className="check"><input type="checkbox" checked={f.is_individual} onChange={set("is_individual")} />Contracting as an individual, not a company</label>
      <div className="grid2">
        {!f.is_individual && <Field label="Company name"><input value={f.company_name} onChange={set("company_name")} /></Field>}
        <Field label="Country (optional, the client confirms it)"><input value={f.company_country} onChange={set("company_country")} placeholder="e.g. United Kingdom" /></Field>
      </div>
      <div className="card" style={{ padding: 12, background: "var(--sunken)" }}>
        <label className="check" style={{ fontWeight: 600 }}><input type="checkbox" checked={f.deposit} onChange={set("deposit")} />Take a €1,000 deposit</label>
        <div className="muted small" style={{ marginTop: 4 }}>{f.deposit ? (f.company_country ? "The deposit invoice goes out with the invitation and is credited against Invoice 1." : "The deposit invoice is issued as soon as the client confirms their country (it decides which company invoices), and is credited against Invoice 1.") : "No deposit. Invoice 1 will be the full first instalment (50%, capped at €5,000)."}</div>
      </div>
      <div className="grid2">
        <Field label="Fee agreed on the call (EUR, no VAT)"><input type="number" min="0" step="100" value={f.fee} onChange={set("fee")} placeholder="e.g. 5000" /></Field>
        <div className="stack" style={{ gap: 4 }}>
          <span className="small" style={{ color: "var(--text-3)" }}>Approaches</span>
          {APPROACHES.map((a) => <label key={a.key} className="check"><input type="checkbox" checked={f.approaches.includes(a.key)} onChange={() => toggleA(a.key)} />{a.label}</label>)}
        </div>
      </div>
      <div className="note">Invoiced by: <strong>{f.company_country ? entityFor(f.company_country) : "decided by the country the client confirms"}</strong>. The engagement letter is generated with this fee once the client confirms details and signs the NDA.</div>
      <div className="row">
        <button className="btn primary" disabled={!ready || busy} onClick={create}>Create engagement</button>
        <button className="btn" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function Head({ lastSync, count, reload }) {
  const [run, busy] = useAction();
  const toast = useToast();
  async function sync() {
    await run(async () => {
      const { data, error } = await supabase.functions.invoke("ghl-sync?mode=full", { body: {} });
      if (error) throw new Error((await error.context?.json?.().catch(() => null))?.error ?? error.message);
      if (data?.ok === false) throw new Error(data.error);
      toast(`Synced ${data?.opportunities ?? 0} leads from "${data?.pipeline ?? "GHL"}"`);
      await reload?.();
    });
  }
  return (
    <div className="pagehead">
      <div><h1>Leads</h1><p>Your GHL pipeline. Drag a card to another column and it moves in GHL too. Convert a lead to start an engagement.</p></div>
      <div className="row">
        <span className="muted small">
          {count != null && `${count} open · `}
          {lastSync ? `last sync ${ago(lastSync.received_at)}` : "never synced"}
        </span>
        <button className="btn" disabled={busy} onClick={sync}>{busy ? "Syncing…" : "Sync from GHL"}</button>
      </div>
    </div>
  );
}

  }, [lead.ghl_id]);

        <dt>Source</dt><dd>{lead.source || "—"}</dd>
        <dt>Owner</dt><dd>{lead.assigned_to || "—"}</dd>
        <dt>Came in</dt><dd>{lead.ghl_created_at ? `${day(lead.ghl_created_at)} (${ago(lead.ghl_created_at)})` : "—"}</dd>

        {recs.length === 0 && <span className="muted small">None yet. Paste the Fathom link after each call.</span>}

        <div className="row">

const chipKind = (s) => (s === "declined" ? "danger" : s === "completed" ? "ok" : s === "valuation_active" ? "accent" : "");

function Engagements() {
  const nav = useNavigate();
  const [rows, setRows] = useState(null);
  const [quiet, setQuiet] = useState([]);
  const [filter, setFilter] = useState("live");

  useEffect(() => {
    supabase.from("engagements").select("id, stage, client_name, client_email, company_name, company_country, fee, updated_at, created_at, sent_at, last_client_activity_at")
      .order("updated_at", { ascending: false })
      .then(({ data }) => setRows(data ?? []));
    supabase.from("engagements_quiet").select("id").then(({ data }) => setQuiet((data ?? []).map((x) => x.id)));
  }, []);

  const shown = (rows ?? []).filter((r) => filter === "all" ? true : filter === "live" ? LIVE_STAGES.includes(r.stage) : filter === "quiet" ? quiet.includes(r.id) : r.stage === filter);
  const counts = Object.fromEntries(ENGAGEMENT_STAGES.map((s) => [s.key, (rows ?? []).filter((r) => r.stage === s.key).length]));

  return (
    <>
      <div className="pagehead">
        <div><h1>Engagements</h1><p>Everyone between Call 1 and "valuation started". Click one to move it along.</p></div>
      </div>
      <div className="row wrap" style={{ marginBottom: 14 }}>
        <button className={`btn ${filter === "live" ? "primary" : ""}`} onClick={() => setFilter("live")}>Live</button>
        {ENGAGEMENT_STAGES.filter((s) => counts[s.key] > 0).map((s) => (
          <button key={s.key} className={`btn ${filter === s.key ? "primary" : ""}`} onClick={() => setFilter(s.key)}>{s.label} · {counts[s.key]}</button>
        ))}
        <button className={`btn ${filter === "quiet" ? "primary" : ""}`} onClick={() => setFilter("quiet")} title="No client activity for 7+ days">Quiet · {quiet.length}</button>
        <button className={`btn ${filter === "all" ? "primary" : ""}`} onClick={() => setFilter("all")}>All</button>
      </div>
      <div className="card">
        {rows === null ? null : shown.length === 0 ? (
          <Empty title="Nothing here">Convert a lead from the Leads board to start an engagement.</Empty>
        ) : (
          <table className="table">
            <thead><tr><th>Client</th><th>Company</th><th>Stage</th><th>Fee</th><th>Last activity</th></tr></thead>
            <tbody>
              {shown.map((r) => (
                <tr key={r.id} className="click" onClick={() => nav(`/app/engagements/${r.id}`)}>
                  <td><strong>{r.client_name}</strong><div className="muted small">{r.client_email}</div></td>
                  <td>{r.company_name || "—"}<div className="muted small">{r.company_country}</div></td>
                  <td><Chip kind={chipKind(r.stage)}>{stageLabel(r.stage)}</Chip></td>
                  <td>{r.fee ? eur(r.fee) : <span className="muted">not set</span>}</td>
                  <td className="muted">{r.last_client_activity_at ? `client ${ago(r.last_client_activity_at)}` : r.sent_at ? `sent ${ago(r.sent_at)}` : ago(r.updated_at)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </>
  );
}

// ===================== pages/EngagementDetail.jsx =====================
function EngagementDetail() {
  const { id } = useParams();
  const [e, setE] = useState(null);
  const [deposit, setDeposit] = useState(null);
  const [invoices, setInvoices] = useState([]);
  const [docs, setDocs] = useState([]);
  const [agreements, setAgreements] = useState([]);
  const [feed, setFeed] = useState([]);
  const [contact, setContact] = useState(null);

  const load = useCallback(async () => {
    const [a, b, c, d, f, g] = await Promise.all([
      supabase.from("engagements").select("*").eq("id", id).single(),
      supabase.from("deposits").select("*").eq("engagement_id", id).order("created_at", { ascending: false }).limit(1).maybeSingle(),
      supabase.from("engagement_invoices").select("*").eq("engagement_id", id).order("seq"),
      supabase.from("client_documents").select("*").eq("engagement_id", id).order("created_at"),
      supabase.from("agreements").select("id, kind, version, status, sent_at, signed_at").eq("engagement_id", id).order("created_at"),
      supabase.from("activity_log").select("*").eq("engagement_id", id).order("created_at", { ascending: false }).limit(40),
    ]);
    setE(a.data); setDeposit(b.data); setInvoices(c.data ?? []); setDocs(d.data ?? []); setAgreements(f.data ?? []); setFeed(g.data ?? []);
    if (a.data?.contact_id) {
      const { data: ct } = await supabase.from("contacts").select("custom, phone").eq("ghl_id", a.data.contact_id).maybeSingle();
      setContact(ct);
    }
  }, [id]);
  useEffect(() => { load(); }, [load]);

  if (!e) return null;
  const idx = stageIndex(e.stage);
  const st = ENGAGEMENT_STAGES[idx];
  const canDecline = !["engaged", "valuation_active", "completed", "declined"].includes(e.stage);

  return (
    <>
      <div className="pagehead">
        <div>
          <div className="muted small"><Link to="/app/engagements">Engagements</Link> / {e.company_name || e.client_name}</div>
          <h1>{e.company_name || e.client_name}</h1>
          <p>{e.client_name}{e.client_title ? `, ${e.client_title}` : ""} · {e.client_email}</p>
        </div>
        <div className="row">
          <a className="btn" href={`${PORTAL_URL}?as=${e.id}`} target="_blank" rel="noreferrer">Preview client's page</a>
          <Chip kind={e.stage === "declined" ? "danger" : e.stage === "completed" ? "ok" : "brand"}>{stageLabel(e.stage)}</Chip>
        </div>
      </div>

      <Stepper stage={e.stage} />

      <div className="grid2" style={{ marginTop: 18 }}>
        <div className="stack" style={{ gap: 16 }}>
          <NextStep e={e} st={st} deposit={deposit} docs={docs} invoices={invoices} agreements={agreements} reload={load} />
          {!["declined"].includes(e.stage) && <LetterCard e={e} reload={load} agreements={agreements} />}
          <Checklist e={e} docs={docs} reload={load} />
          <ShareDocCard e={e} docs={docs} reload={load} />
          {canDecline && <DeclineBox e={e} reload={load} />}
        </div>
        <div className="stack" style={{ gap: 16 }}>
          <ClientDetails e={e} reload={load} />
          <NotesCard e={e} contact={contact} reload={load} />
          {e.deposit_required && <DepositCard e={e} deposit={deposit} reload={load} />}
          <Invoices invoices={invoices} deposit={deposit} reload={load} />
          <Card title="Activity">
            {feed.length === 0 ? <span className="muted small">Nothing yet.</span> : (
              <ul className="feed">
                {feed.map((f) => (
                  <li key={f.id}><span className="when">{ago(f.created_at)}</span><span>{describe(f, e.client_name)}</span></li>
                ))}
              </ul>
            )}
          </Card>
        </div>
      </div>
    </>
  );
}

function Stepper({ stage }) {
  const idx = stageIndex(stage);
  const steps = ENGAGEMENT_STAGES.slice(0, 7);
  return (
    <div className="stepper">
      {steps.map((s, i) => {
        const cls = stage === "declined" ? (i < 7 ? "declined" : "") : i < idx ? "done" : i === idx ? "now" : "";
        return <div key={s.key} className={`step ${cls}`}>{s.label}</div>;
      })}
    </div>
  );
}

/* ---------------------------------------------------------------- next step by stage */
function NextStep({ e, st, deposit, docs, invoices, agreements, reload }) {
  const [run, busy] = useAction();
  const toast = useToast();

  const advance = (to) => run(() => rpc("staff_advance_engagement", { p_id: e.id, p_to: to }).then(reload), `Moved to ${stageLabel(to)}`);

  const body = (() => {
    switch (e.stage) {
      case "deposit_pending":
      case "nda_pending": return <SendNdaStep e={e} agreements={agreements} reload={reload} />;
      case "docs_pending":
      case "review_pending":
      case "proposal": return <SendNdaStep e={e} agreements={agreements} reload={reload} />;
      case "engaged": return (
        <p className="small" style={{ margin: 0 }}>
          Letter signed, Invoice 1 issued (right). When the transfer lands, mark it paid there, then start the valuation.
        </p>
      );
      case "valuation_active": return <p className="small" style={{ margin: 0 }}>Project created. The Projects screen arrives in the next slice.</p>;
      case "completed": return <p className="small" style={{ margin: 0 }}>Done. Invoice 2 paid, final report delivered.</p>;
      case "declined": return <p className="small" style={{ margin: 0 }}>Declined{e.declined_reason ? `: ${e.declined_reason}` : ""}. Deposit kept.</p>;
      default: return null;
    }
  })();

  return (
    <Card title={`Now: ${stageLabel(e.stage)}`} right={st?.next && (
      <button className="btn primary" disabled={busy} onClick={() => advance(st.next)}>{st.nextLabel}</button>
    )}>
      {body}
      {st?.next && <p className="muted small" style={{ margin: "12px 0 0" }}>Unlocks when: {st.gate}.</p>}
    </Card>
  );
}

async function callFn(name, body) {
  const { data, error } = await supabase.functions.invoke(name, { body });
  if (error) throw new Error((await error.context?.json?.().catch(() => null))?.error ?? error.message);
  if (data?.ok === false) throw new Error(data.error);
  return data;
}

function SendNdaStep({ e, agreements, reload }) {
  const [run, busy] = useAction();
  const nda = agreements.filter((a) => a.kind === "nda" && a.status !== "void").at(-1);
  const stamp = () => run(() => callFn("engagement-send", { kind: "stamp", agreement_id: nda.id, force: true }).then(reload), "Signed copy created and emailed");
  const open = async (path) => window.open(await signedUrl(path), "_blank");
  const invite = () => run(() => callFn("engagement-send", { engagement_id: e.id, kind: "invite" }).then(reload), e.sent_at ? "Invitation resent" : "Invitation sent");
  return (
    <div className="stack">
      {e.sent_at ? <div className="small">Invitation sent {day(e.sent_at)}{e.deposit_required ? " with the deposit invoice" : ""}.</div>
        : <p className="small" style={{ margin: 0 }}>One click emails the client from info@ with the link to their Solonos page{e.deposit_required ? " and the €1,000 deposit invoice" : ""}. They confirm their company details, the NDA is generated for them to sign, then the engagement letter follows.</p>}
      {nda ? (
        <div className="row wrap small">NDA v{nda.version} <Chip kind={nda.status === "signed" ? "ok" : "warn"}>{nda.status}</Chip> sent {day(nda.sent_at)}{nda.signed_at && ` · signed ${day(nda.signed_at)}`}
          {(nda.signed_pdf_path ?? nda.pdf_path) && <button className="btn" onClick={() => open(nda.signed_pdf_path ?? nda.pdf_path)}>Open PDF</button>}
          {nda.status === "signed" && !nda.signed_pdf_path && <button className="btn" disabled={busy} onClick={stamp}>Create signed copy</button>}
        </div>
      ) : e.sent_at ? <div className="muted small">NDA will be generated as soon as the client confirms their company details.</div> : null}
      <div className="row">
        <button className="btn primary" disabled={busy} onClick={invite}>{e.sent_at ? "Resend invitation" : "Send invitation"}</button>
        <a className="btn" href={`${PORTAL_URL}?as=${e.id}`} target="_blank" rel="noreferrer">Preview client's page</a>
      </div>
    </div>
  );
}

function DepositCard({ e, deposit, reload }) {
  const [run, busy] = useAction();
  const [ref, setRef] = useState("");
  const paid = () => run(async () => {
    await rpc("staff_mark_deposit_paid", { p_engagement: e.id, p_reference: ref || null });
    const { data: inv } = await supabase.from("engagement_invoices").select("id").eq("engagement_id", e.id).eq("seq", 0).maybeSingle();
    if (inv) await callFn("engagement-send", { kind: "receipt", invoice_id: inv.id });
    await reload();
  }, "Deposit marked paid, receipt emailed");
  const kind = { pending: "warn", claimed: "accent", paid: "ok", credited: "ok", kept: "", refunded: "" }[deposit?.status] ?? "";
  return (
    <Card title="€1,000 deposit" right={deposit && <Chip kind={kind}>{deposit.status === "claimed" ? "client says paid" : deposit.status}</Chip>}>
      {!deposit ? <span className="muted small">No deposit row.</span> : ["pending", "claimed"].includes(deposit.status) ? (
        <div className="stack">
          {deposit.status === "claimed" && <div className="note">Client clicked "I've paid" {ago(deposit.client_claimed_at)}{deposit.client_reference && ` · ref ${deposit.client_reference}`}. Check the bank, then confirm.</div>}
          <div className="row">
            <input placeholder="Bank reference (optional)" value={ref} onChange={(x) => setRef(x.target.value)} style={{ flex: 1, padding: 8, borderRadius: 8, border: "1px solid var(--border)" }} />
            <button className="btn primary" disabled={busy} onClick={paid}>Mark paid</button>
          </div>
          <span className="muted small">Non-refundable. Credited against Invoice 1 when the letter is signed.</span>
        </div>
      ) : (
        <span className="small">Received {day(deposit.paid_at)}{deposit.reference && ` · ref ${deposit.reference}`}{deposit.status === "credited" && " · credited against Invoice 1"}{deposit.status === "kept" && " · kept (declined)"}</span>
      )}
    </Card>
  );
}

function AgreementStep({ kind, label, agreements }) {
  const a = agreements.filter((x) => x.kind === kind).at(-1);
  return (
    <div className="stack">
      {a ? (
        <div className="small">{label} v{a.version}: <Chip kind={a.status === "signed" ? "ok" : "warn"}>{a.status}</Chip>{a.sent_at && ` sent ${day(a.sent_at)}`}{a.signed_at && ` · signed ${day(a.signed_at)}`}</div>
      ) : (
        <div className="note">Generating the {label} from the locked template and sending it to the portal arrives in slice 2. Until then this stage waits.</div>
      )}
    </div>
  );
}

function Call2Step({ e, reload }) {
  const [run, busy] = useAction();
  const [url, setUrl] = useState(e.call2_fathom_url ?? "");
  const [when, setWhen] = useState(e.call2_held_at ? e.call2_held_at.slice(0, 10) : new Date().toISOString().slice(0, 10));
  async function save() {
    await run(async () => {
      const { error } = await supabase.from("engagements").update({ call2_fathom_url: url || null, call2_held_at: new Date(when).toISOString() }).eq("id", e.id);
      if (error) throw new Error(error.message);
      await reload();
    }, "Call 2 recorded");
  }
  return (
    <div className="stack">

      </div>
      <div className="row">
        <button className="btn" disabled={busy} onClick={save}>{e.call2_held_at ? "Update Call 2" : "Record Call 2"}</button>
        {e.call2_held_at && <span className="muted small">recorded {day(e.call2_held_at)}</span>}
      </div>
    </div>
  );
}

function LetterCard({ e, reload, agreements }) {
  const [run, busy] = useAction();
  const [fee, setFee] = useState(e.fee ?? "");
  const [appr, setAppr] = useState(e.approaches ?? []);
  const toggle = (k) => setAppr((a) => (a.includes(k) ? a.filter((x) => x !== k) : [...a, k]));
  const letter = agreements.filter((a) => a.kind === "engagement_letter" && ["sent", "signed"].includes(a.status)).at(-1);
  const ndaSigned = agreements.some((a) => a.kind === "nda" && a.status === "signed");
  const saved = e.fee && Number(e.fee) === Number(fee) && JSON.stringify(e.approaches ?? []) === JSON.stringify(appr);
  const ready = saved && !!e.company_confirmed_at && ndaSigned;
  const autoRan = React.useRef(false);
  const open = async (path) => window.open(await signedUrl(path), "_blank");
  async function save() {
    await run(async () => {
      const { error } = await supabase.from("engagements").update({ fee: Number(fee), approaches: appr }).eq("id", e.id);
      if (error) throw new Error(error.message);
      await reload();
    }, "Terms saved");
  }
  // the letter goes out by itself the moment the three conditions are met (also from the client's page)
  useEffect(() => {
    if (!letter && ready && !autoRan.current) { autoRan.current = true; run(() => callFn("engagement-send", { engagement_id: e.id, kind: "letter" }).then(reload), "Engagement letter generated, signed and sent"); }
  }, [ready, letter]);
  const half = Math.min(Number(fee || 0) * 0.5, 5000);
  return (
    <Card title="Engagement letter" right={letter && <Chip kind={letter.status === "signed" ? "ok" : "warn"}>v{letter.version} {letter.status === "signed" ? "signed by both" : "sent, awaiting signature"}</Chip>}>
      <div className="stack">
        {letter ? (
          <div className="row wrap">
            <span className="small">Sent {day(letter.sent_at)}{letter.status === "signed" && `, signed by ${e.client_name} ${day(letter.signed_at)}`}. Fee {eur(e.fee)}.</span>
            {letter.status === "signed" && letter.signed_pdf_path && <button className="btn" onClick={() => open(letter.signed_pdf_path)}>Open signed letter</button>}
            {letter.status === "signed" && !letter.signed_pdf_path && <span className="muted small">Preparing the copy signed by both parties…</span>}
          </div>
        ) : (
          <>
            <div className="grid2">
              <Field label="Total fee (EUR, no VAT)"><input type="number" min="0" step="100" value={fee} onChange={(x) => setFee(x.target.value)} /></Field>
              <div className="note" style={{ alignSelf: "end" }}>
                Invoice 1 on signing: <strong>{eur(Math.max(half - (e.deposit_required ? 1000 : 0), 0))}</strong> · Invoice 2 before final report: <strong>{eur(Math.max(Number(fee || 0) - half, 0))}</strong>{e.deposit_required && " · €1,000 deposit credited"}
              </div>
            </div>
            <div className="stack" style={{ gap: 6 }}>
              {APPROACHES.map((a) => (
                <label key={a.key} className="check"><input type="checkbox" checked={appr.includes(a.key)} onChange={() => toggle(a.key)} />{a.label}</label>
              ))}
            </div>
            <div className="row wrap">
              <button className="btn primary" disabled={busy || !fee || appr.length === 0 || saved} onClick={save}>{saved ? "Terms saved" : "Save terms"}</button>
              <span className="muted small">
                Sent automatically once: {saved ? "✓" : "○"} fee saved · {ndaSigned ? "✓" : "○"} NDA signed · {e.company_confirmed_at ? "✓" : "○"} client confirmed details
              </span>
            </div>
          </>
        )}
      </div>
    </Card>
  );
}

/* ---------------------------------------------------------------- checklist */
function Checklist({ e, docs, reload }) {
  const [run, busy] = useAction();
  const [label, setLabel] = useState("");
  const [required, setRequired] = useState(true);
  const locked = !["deposit_pending", "nda_pending", "docs_pending", "review_pending", "proposal"].includes(e.stage);

  const add = () => run(async () => {
    const { error } = await supabase.from("client_documents").insert({ engagement_id: e.id, label, required });
    if (error) throw new Error(error.message);
    setLabel(""); await reload();
  });
  const remove = (id) => run(async () => {
    const { error } = await supabase.from("client_documents").delete().eq("id", id);
    if (error) throw new Error(error.message);
    await reload();
  });
  const received = (id) => run(async () => {
    const { data: me } = await supabase.auth.getUser();
    const { error } = await supabase.from("client_documents").update({ uploaded_at: new Date().toISOString(), uploaded_by: `staff:${me.user.email}` }).eq("id", id);
    if (error) throw new Error(error.message);
    await reload();
  }, "Marked received");

  const presets = ["Audited financial statements, last 3 years", "Management accounts, year to date", "Budget / forecast", "Debt and lease schedule", "Fixed asset register", "Cap table / shareholder register"];

  return (
    <Card title="Financials checklist" right={<span className="muted small">{docs.filter((d) => d.uploaded_at).length}/{docs.length} in</span>}>
      {docs.length === 0 && <p className="muted small" style={{ marginTop: 0 }}>What the client must upload. The stage moves on when every required item is in.</p>}
      <div className="stack" style={{ gap: 6 }}>
        {docs.map((d) => (
          <div key={d.id} className="row between small" style={{ padding: "6px 0", borderBottom: "1px solid var(--border-sub)" }}>
            <span>{d.uploaded_at ? "✓ " : "○ "}{d.label} {!d.required && <Chip>optional</Chip>}</span>
            <span className="row">
              {d.uploaded_at ? <span className="row"><span className="muted">{ago(d.uploaded_at)}{d.uploaded_by?.startsWith("staff:") && " · by staff"}</span>{d.storage_path && <button className="btn" onClick={async () => window.open(await signedUrl(d.storage_path), "_blank")}>Open</button>}</span> : (
                <>
                  <button className="btn" disabled={busy} onClick={() => received(d.id)} title="Client sent it another way">Mark received</button>
                  {!locked && <button className="btn" disabled={busy} onClick={() => remove(d.id)}>Remove</button>}
                </>
              )}
            </span>
          </div>
        ))}
      </div>
      {!locked && (
        <div className="stack" style={{ marginTop: 12 }}>
          <div className="row">
            <input list="presets" placeholder="Add an item, e.g. Audited FS 2025" value={label} onChange={(x) => setLabel(x.target.value)} style={{ flex: 1, padding: 8, borderRadius: 8, border: "1px solid var(--border)" }} />
            <datalist id="presets">{presets.map((p) => <option key={p} value={p} />)}</datalist>
            <label className="check"><input type="checkbox" checked={required} onChange={(x) => setRequired(x.target.checked)} />required</label>
            <button className="btn" disabled={!label || busy} onClick={add}>Add</button>
          </div>
          {docs.length === 0 && (
            <div className="row wrap">{presets.slice(0, 4).map((p) => <button key={p} className="btn" disabled={busy} onClick={() => { setLabel(p); }}>{p}</button>)}</div>
          )}
        </div>
      )}
    </Card>
  );
}

/* ---------------------------------------------------------------- decline */
function DeclineBox({ e, reload }) {
  const [run, busy] = useAction();
  const [open, setOpen] = useState(false);
  const [reason, setReason] = useState("");
  const decline = () => run(async () => {
    const { error } = await supabase.from("engagements").update({ declined_reason: reason }).eq("id", e.id);

    await rpc("staff_advance_engagement", { p_id: e.id, p_to: "declined" });

  return open ? (
    <Card title="Decline this engagement">
      <div className="stack">

        <div className="row">
          <button className="btn danger" disabled={busy || !reason} onClick={decline}>Decline (deposit is kept)</button>

        </div>
      </div>
    </Card>

            <div className="row">
              <a className="btn" href={`/ConsortiaValuationBuilder.html?eng=${e.id}${e.opportunity_id ? `&lead=${encodeURIComponent(e.opportunity_id)}` : ""}&v=${Date.now()}`} target="_blank" rel="noreferrer">Open Valuation Builder for this client</a>

/* ---------------------------------------------------------------- invoices */
function Invoices({ invoices, reload }) {
  const [run, busy] = useAction();

    <Card title="Invoices">

        <table className="table">

            {invoices.map((i) => (
              <tr key={i.id}>
                <td>
                  <div>{INVOICE_NAMES[i.seq]}</div>

                  {i.client_claimed_at && i.status === "issued" && <div className="small" style={{ color: "var(--accent)", fontWeight: 600 }}>Client reports payment {ago(i.client_claimed_at)}{i.client_reference && ` · ref ${i.client_reference}`}. Check the bank, then Mark paid.</div>}
                </td>
                <td style={{ textAlign: "right" }}>{money(i.amount, i.currency)}</td>
                <td style={{ textAlign: "right" }}>
                  <span className="row" style={{ justifyContent: "flex-end" }}>
                    {i.pdf_path && <button className="btn" onClick={() => open(i.pdf_path)}>PDF</button>}
                    {!i.pdf_path && i.seq > 0 && i.status !== "void" && <button className="btn primary" disabled={busy} onClick={() => makePdf(i.id)}>{i.seq === 1 ? "Send again" : "Create and send"}</button>}
                    {i.receipt_path && <button className="btn" onClick={() => open(i.receipt_path)}>Receipt</button>}
                    {i.status === "paid" && !i.receipt_path && <button className="btn" disabled={busy} onClick={() => receipt(i.id)}>Create receipt</button>}
                    {i.status === "issued" && i.seq > 0 ? <button className="btn" disabled={busy} onClick={() => paid(i.id)}>Mark paid</button> : <Chip kind={kind(i.status)}>{i.status}</Chip>}
                  </span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
      <p className="muted small" style={{ margin: "8px 0 0" }}>Invoice 1 goes out by itself when the letter is signed. Create and send Invoice 2 when the draft is approved. When a transfer lands, Mark paid sends the receipt.</p>
    </Card>
  );
}

/* ---------------------------------------------------------------- activity copy */
function describe(f, who = "Client") {
  const d = f.detail ?? {};
  switch (f.action) {
    case "engagement.created": return "Engagement created from lead";
    case "engagement.stage": return `Moved to ${stageLabel(d.to)}`;
    case "deposit.link_created": return "Stripe deposit link created";
    case "invite.sent": return `Invitation emailed${d.deposit ? " with the deposit invoice" : ""}`;
    case "nda.sent": return `NDA v${d.version} generated and emailed for signature`;
    case "letter.sent": return `Engagement letter v${d.version} emailed (fee ${eur(d.fee)})`;
    case "deposit.claimed": return `${who} says the deposit is paid${d.reference ? ` (ref ${d.reference})` : ""}`;
    case "invoice.claimed": return `${who} reports payment of ${INVOICE_NAMES[d.seq]}${d.reference ? ` (ref ${d.reference})` : ""}`;
    case "client.company_updated": return `${who} updated their company details`;
    case "client.company_confirmed": return `${who} confirmed their company details`;
    case "letter.drafted": return `Engagement letter draft v${d.version} created for review (fee ${eur(d.fee)})`;
    case "client.uploaded": return `${who} uploaded: ${d.label}`;
    case "deposit.paid": return `Deposit received by bank transfer${d.reference ? ` (${d.reference})` : ""}`;
    case "invoice.issued": return `${INVOICE_NAMES[d.seq]} issued, #${d.no}, ${eur(d.amount)}`;
    case "invoice.paid": return `${INVOICE_NAMES[d.seq]} paid`;
    case "agreement.signed": return `${d.kind === "nda" ? "NDA" : "Engagement letter"} v${d.version} signed by ${who}`;
    case "project.created": return `Project ${d.code} created`;
    case "project.stage": return `Project moved to ${d.to}`;
    default: return f.action;
  }
}

function PortalLogin() {

  return (
    <div className="login">

          </>
        ) : (
          <>

            <input type="email" required placeholder="your@email.com" value={email} onChange={(e) => setEmail(e.target.value)} />
            <Captcha onToken={setCaptcha} />
            {err && <p className="err">{err}</p>}

async function signedUrl(storagePath, seconds = 600) {
  const [bucket, ...rest] = storagePath.split("/");
  const { data, error } = await supabase.storage.from(bucket).createSignedUrl(rest.join("/"), seconds);
  if (error) throw new Error(error.message);
  return data.signedUrl;
}

/** Renders a .docx from storage inside the page (docx-preview) so the client reads what they sign. */
function DocxView({ storagePath }) {
  const ref = React.useRef(null);
  const [state, setState] = useState("loading");
  useEffect(() => {
    let dead = false;
    (async () => {
      try {
        const url = await signedUrl(storagePath);
        const blob = await (await fetch(url)).blob();
        const mod = await import("https://esm.sh/docx-preview@0.3.3");
        if (dead) return;
        ref.current.innerHTML = "";
        await mod.renderAsync(blob, ref.current, undefined, { inWrapper: false, ignoreWidth: true, ignoreHeight: true, useBase64URL: true });
        setState("ok");
      } catch (e) { setState("error: " + e.message); }
    })();
    return () => { dead = true; };
  }, [storagePath]);
  return (
    <div className="docx">
      {state === "loading" && <div className="muted small">Loading the document…</div>}
      {state.startsWith("error") && <div className="err">{state}</div>}
      <div ref={ref} />
    </div>
  );
}

/** Shows the PDF when we have one (converted by Word), otherwise renders the .docx. */
function AgreementView({ agreement }) {
  const [url, setUrl] = useState(null);

  useEffect(() => { setUrl(null); if (path) signedUrl(path, 3600).then(setUrl).catch(() => setUrl(null)); }, [path]);

  return <DocxView storagePath={agreement.docx_path} />;
}

/** Draw-your-signature box (mouse or finger). Exports a PNG data URL. */
function SignaturePad({ onChange }) {
  const ref = React.useRef(null);
  const drawing = React.useRef(false);
  const pos = (ev) => {
    const r = ref.current.getBoundingClientRect();
    const p = ev.touches ? ev.touches[0] : ev;
    return { x: (p.clientX - r.left) * (ref.current.width / r.width), y: (p.clientY - r.top) * (ref.current.height / r.height) };
  };
  const start = (ev) => { drawing.current = true; const c = ref.current.getContext("2d"); const { x, y } = pos(ev); c.beginPath(); c.moveTo(x, y); ev.preventDefault(); };
  const move = (ev) => { if (!drawing.current) return; const c = ref.current.getContext("2d"); c.lineWidth = 2.2; c.lineCap = "round"; c.strokeStyle = "#1a1a4a"; const { x, y } = pos(ev); c.lineTo(x, y); c.stroke(); ev.preventDefault(); };
  const end = () => { if (!drawing.current) return; drawing.current = false; onChange(ref.current.toDataURL("image/png")); };
  const clear = () => { const c = ref.current.getContext("2d"); c.clearRect(0, 0, ref.current.width, ref.current.height); onChange(null); };
  return (
    <div>
      <canvas ref={ref} width={600} height={180}
        style={{ width: "100%", maxWidth: 600, height: 180, background: "#fff", border: "1px dashed var(--border-dash)", borderRadius: 8, touchAction: "none", cursor: "crosshair" }}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
      <div className="row" style={{ marginTop: 6 }}><span className="muted small">Sign inside the box with your mouse or finger.</span><button type="button" className="btn" onClick={clear}>Clear</button></div>
    </div>
  );
}

function SignBox({ agreement, e, onSigned, label, preview }) {

  const [ok, setOk] = useState(false);
  const sign = () => run(async () => {
    await rpc("portal_sign_agreement", { p_agreement: agreement.id, p_name: name, p_title: title || null, p_ip: null, p_ua: navigator.userAgent, p_signature: sig });
    try { await callFn("engagement-send", { kind: "stamp", agreement_id: agreement.id }); } catch (_) { /* the stamped copy can be produced later by staff */ }
    await onSigned();
  }, `${label} signed. A copy signed by both parties is on its way to your inbox.`);
  if (agreement.status === "signed") return <div className="note">Signed on {day(agreement.signed_at)}. Thank you. {agreement.signed_pdf_path ? "The copy signed by both parties is shown above and has been emailed to you." : "The copy signed by both parties is being prepared; refresh this page in a moment."}</div>;
  return (

        <Field label="Title"><input value={title} onChange={(x) => setTitle(x.target.value)} placeholder="Director" /></Field>
      </div>
      <div style={{ margin: "12px 0 4px" }} className="small muted">Signature</div>
