function LetterCard({ e, reload, agreements }) {
  const [run, busy] = useAction();
  const [fee, setFee] = useState(e.fee ?? "");
  const [appr, setAppr] = useState(e.approaches ?? []);
  const toggle = (k) => setAppr((a) => (a.includes(k) ? a.filter((x) => x !== k) : [...a, k]));
  const letter = agreements.filter((a) => a.kind === "engagement_letter" && ["sent", "signed"].includes(a.status)).at(-1);
  const ndaSigned = agreements.some((a) => a.kind === "nda" && a.status === "signed");
  const saved = e.fee && Number(e.fee) === Number(fee) && JSON.stringify(e.approaches ?? []) === JSON.stringify(appr);
  const ready = saved && !!e.company_confirmed_at && ndaSigned;
  const autoRan = React.useRef(false);
  const open = async (path) => window.open(await signedUrl(path), "_blank");
  async function save() {
    await run(async () => {
      const { error } = await supabase.from("engagements").update({ fee: Number(fee), approaches: appr }).eq("id", e.id);
      if (error) throw new Error(error.message);
      await reload();
    }, "Terms saved");
  }
  // the letter goes out by itself the moment the three conditions are met (also from the client's page)
  useEffect(() => {
    if (!letter && ready && !autoRan.current) { autoRan.current = true; run(() => callFn("engagement-send", { engagement_id: e.id, kind: "letter" }).then(reload), "Engagement letter generated, signed and sent"); }
  }, [ready, letter]);
  const half = Math.min(Number(fee || 0) * 0.5, 5000);
  return (
    <Card title="Engagement letter" right={letter && <Chip kind={letter.status === "signed" ? "ok" : "warn"}>v{letter.version} {letter.status === "signed" ? "signed by both" : "sent, awaiting signature"}</Chip>}>
      <div className="stack">
        {letter ? (
          <div className="row wrap">
            <span className="small">Sent {day(letter.sent_at)}{letter.status === "signed" && `, signed by ${e.client_name} ${day(letter.signed_at)}`}. Fee {eur(e.fee)}.</span>
            {letter.status === "signed" && letter.signed_pdf_path && <button className="btn" onClick={() => open(letter.signed_pdf_path)}>Open signed letter</button>}
            {letter.status === "signed" && !letter.signed_pdf_path && <span className="muted small">Preparing the copy signed by both parties…</span>}
          </div>
        ) : (
          <>
            <div className="grid2">
              <Field label="Total fee (EUR, no VAT)"><input type="number" min="0" step="100" value={fee} onChange={(x) => setFee(x.target.value)} /></Field>
              <div className="note" style={{ alignSelf: "end" }}>
                Invoice 1 on signing: <strong>{eur(Math.max(half - (e.deposit_required ? 1000 : 0), 0))}</strong> · Invoice 2 before final report: <strong>{eur(Math.max(Number(fee || 0) - half, 0))}</strong>{e.deposit_required && " · €1,000 deposit credited"}
              </div>
            </div>
            <div className="stack" style={{ gap: 6 }}>
              {APPROACHES.map((a) => (
                <label key={a.key} className="check"><input type="checkbox" checked={appr.includes(a.key)} onChange={() => toggle(a.key)} />{a.label}</label>
              ))}
            </div>
            <div className="row wrap">
              <button className="btn primary" disabled={busy || !fee || appr.length === 0 || saved} onClick={save}>{saved ? "Terms saved" : "Save terms"}</button>
              <span className="muted small">
                Sent automatically once: {saved ? "✓" : "○"} fee saved · {ndaSigned ? "✓" : "○"} NDA signed · {e.company_confirmed_at ? "✓" : "○"} client confirmed details
              </span>
            </div>
          </>
        )}
      </div>
    </Card>
  );
}

/** Drop files here or click to pick them (several at once). */
function DropZone({ onFiles, busy, label = "Drop files here or click to choose" }) {

function ShareDocCard({ e, docs, reload }) {
  const [run, busy] = useAction();
  const [shared, setShared] = useState([]);
  const [label, setLabel] = useState("Valuation snapshot");
  const load = useCallback(async () => {
    const { data } = await supabase.from("documents").select("*").eq("engagement_id", e.id).eq("visibility", "client").order("created_at", { ascending: false });
    setShared(data ?? []);
  }, [e.id]);
  useEffect(() => { load(); }, [load]);
  const open = async (path) => window.open(await signedUrl(path), "_blank");
  // one file: shown to the client under the name typed; several files: each under its own file name
  async function upload(files) {
    const list = [...files].filter((f) => { if (f.size > 50 * 1024 * 1024) { alert(`${f.name} is over 50 MB and was skipped.`); return false; } return true; });
    if (!list.length) return;
    await run(async () => {
      for (const file of list) {
        const path = `${e.id}/${Date.now()}-${file.name}`;
        const { error } = await supabase.storage.from("deliverables").upload(path, file);
        if (error) throw new Error(error.message);
        const name = list.length === 1 && label.trim() ? label.trim() : file.name.replace(/\.[^.]+$/, "");
        const { error: e2 } = await supabase.from("documents").insert({ engagement_id: e.id, kind: "other", name, storage_path: `deliverables/${path}`, visibility: "client", uploaded_by: "staff" });
        if (e2) throw new Error(e2.message);
      }
      await load();
    }, list.length === 1 ? "Shared with the client" : `${list.length} files shared with the client`);
  }
  const fromClient = docs.filter((d) => d.uploaded_at);
  return (
    <Card title="Shared files" right={<span className="muted small">both directions</span>}>
      <div className="grid2">
        <div>
          <h3 style={{ marginBottom: 6 }}>From the client</h3>
          <div className="stack" style={{ gap: 6 }}>
            {fromClient.length === 0 && <span className="muted small">Nothing uploaded yet.</span>}
            {fromClient.map((d) => (
              <div key={d.id} className="row between small"><span>{d.label}<div className="muted">{fileNameOf(d.storage_path)} · {day(d.uploaded_at)}</div></span><button className="btn" onClick={() => open(d.storage_path)}>Open</button></div>
            ))}
          </div>
        </div>
        <div>
          <h3 style={{ marginBottom: 6 }}>From Consortia (client can see)</h3>
          <div className="stack" style={{ gap: 6 }}>
            {shared.length === 0 && <span className="muted small">Nothing yet.</span>}

/* ---------------------------------------------------------------- checklist */
function Checklist({ e, docs, reload }) {
  const [run, busy] = useAction();
  const [label, setLabel] = useState("");
  const [required, setRequired] = useState(true);
  const locked = !["deposit_pending", "nda_pending", "docs_pending", "review_pending", "proposal"].includes(e.stage);

  const add = () => run(async () => {
    const { error } = await supabase.from("client_documents").insert({ engagement_id: e.id, label, required });
    if (error) throw new Error(error.message);
    setLabel(""); await reload();
  });
  const remove = (id) => run(async () => {
    const { error } = await supabase.from("client_documents").delete().eq("id", id);
    if (error) throw new Error(error.message);
    await reload();
  });
  const received = (id) => run(async () => {
    const { data: me } = await supabase.auth.getUser();
    const { error } = await supabase.from("client_documents").update({ uploaded_at: new Date().toISOString(), uploaded_by: `staff:${me.user.email}` }).eq("id", id);
    if (error) throw new Error(error.message);
    await reload();
  }, "Marked received");

  // staff upload on the client's behalf: same bucket and path pattern as the portal, so the client sees it too
  const tooBig = (f) => { if (f.size > 50 * 1024 * 1024) { alert(`${f.name} is ${(f.size / 1048576).toFixed(0)} MB; the limit is 50 MB.`); return true; } return false; };
  const uploadFor = (d, file) => { if (!file || tooBig(file)) return; run(async () => {
    const { data: me } = await supabase.auth.getUser();
    const path = `${e.id}/${d.id}-${file.name}`;
    const { error } = await supabase.storage.from("client-uploads").upload(path, file, { upsert: true });
    if (error) throw new Error(error.message);
    const { error: e2 } = await supabase.from("client_documents").update({ storage_path: `client-uploads/${path}`, uploaded_at: new Date().toISOString(), uploaded_by: `staff:${me.user.email}` }).eq("id", d.id);
    if (e2) throw new Error(e2.message);
    await reload();
  }, `${d.label}: uploaded`); };
  const uploadMany = (files) => { const list = [...files].filter((f) => !tooBig(f)); if (!list.length) return; run(async () => {
    const { data: me } = await supabase.auth.getUser();
    for (const file of list) {
      const path = `${e.id}/extra-${Date.now()}-${file.name}`;
      const { error } = await supabase.storage.from("client-uploads").upload(path, file, { upsert: true });
      if (error) throw new Error(error.message);
      const { error: e2 } = await supabase.from("client_documents").insert({ engagement_id: e.id, label: file.name, required: false, storage_path: `client-uploads/${path}`, uploaded_at: new Date().toISOString(), uploaded_by: `staff:${me.user.email}` });
      if (e2) throw new Error(e2.message);
    }
    await reload();
  }, `${list.length} file${list.length === 1 ? "" : "s"} uploaded`); };
  const Pick = ({ onFile, children, multiple }) => (
    <label className="btn" style={{ cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1 }}>
      {children}
      <input type="file" multiple={multiple} disabled={busy} style={{ display: "none" }} onChange={(x) => { const fs = x.target.files; if (fs?.length) (multiple ? onFile(fs) : onFile(fs[0])); x.target.value = ""; }} />
    </label>
  );

  const presets = ["Audited financial statements, last 3 years", "Management accounts, year to date", "Budget / forecast", "Debt and lease schedule", "Fixed asset register", "Cap table / shareholder register"];

  return (
    <Card title="Financials checklist" right={<span className="muted small">{docs.filter((d) => d.uploaded_at).length}/{docs.length} in</span>}>
      {docs.length === 0 && <p className="muted small" style={{ marginTop: 0 }}>What the client must upload. The stage moves on when every required item is in.</p>}
      <div className="stack" style={{ gap: 6 }}>
        {docs.map((d) => (
          <div key={d.id} className="row between small" style={{ padding: "6px 0", borderBottom: "1px solid var(--border-sub)" }}>
            <span>{d.uploaded_at ? "✓ " : "○ "}{d.label} {!d.required && <Chip>optional</Chip>}</span>
            <span className="row">
              {d.uploaded_at ? <span className="row"><span className="muted">{ago(d.uploaded_at)}{d.uploaded_by?.startsWith("staff:") && " · by staff"}</span>{d.storage_path ? <button className="btn" onClick={async () => window.open(await signedUrl(d.storage_path), "_blank")}>Open</button> : <Pick onFile={(f) => uploadFor(d, f)}>Attach file</Pick>}</span> : (
                <>
                  <Pick onFile={(f) => uploadFor(d, f)}>Upload</Pick>
                  <button className="btn" disabled={busy} onClick={() => received(d.id)} title="Client sent it another way">Mark received</button>
                  {!locked && <button className="btn" disabled={busy} onClick={() => remove(d.id)}>Remove</button>}
                </>
              )}
            </span>
          </div>
        ))}
      </div>
      <div className="row between small" style={{ marginTop: 12 }}>
        <span className="muted">Got files by email? Upload them here; the client sees them on their page.</span>
        <Pick multiple onFile={uploadMany}>Upload files</Pick>
      </div>
      {!locked && (
        <div className="stack" style={{ marginTop: 12 }}>
          <div className="row">
            <input list="presets" placeholder="Add an item, e.g. Audited FS 2025" value={label} onChange={(x) => setLabel(x.target.value)} style={{ flex: 1, padding: 8, borderRadius: 8, border: "1px solid var(--border)" }} />
            <datalist id="presets">{presets.map((p) => <option key={p} value={p} />)}</datalist>
            <label className="check"><input type="checkbox" checked={required} onChange={(x) => setRequired(x.target.checked)} />required</label>
            <button className="btn" disabled={!label || busy} onClick={add}>Add</button>
          </div>
          {docs.length === 0 && (
            <div className="row wrap">{presets.slice(0, 4).map((p) => <button key={p} className="btn" disabled={busy} onClick={() => { setLabel(p); }}>{p}</button>)}</div>
          )}
        </div>
      )}
    </Card>
  );
}

/* ---------------------------------------------------------------- activity copy */
function describe(f, who = "Client") {
  const d = f.detail ?? {};
  switch (f.action) {
    case "engagement.created": return d.manual ? `Project created (${typeLabel(d.type)})` : "Project created from lead";
    case "email.sent": return `Email "${d.subject}" sent to ${d.to}${d.files?.length ? ` with ${d.files.length} file${d.files.length === 1 ? "" : "s"}` : ""}`;
    case "invoice.emailed": return `Invoice ${d.no} emailed to ${d.to}`;
    case "engagement.stage": return `Moved to ${stageLabel(d.to)}`;
    case "deposit.link_created": return "Stripe deposit link created";
    case "invite.sent": return `Invitation emailed${d.deposit ? " with the deposit invoice" : ""}`;
    case "nda.sent": return `NDA v${d.version} generated and emailed for signature`;
    case "letter.sent": return `Engagement letter v${d.version} emailed (fee ${eur(d.fee)})`;
    case "deposit.claimed": return `${who} says the deposit is paid${d.reference ? ` (ref ${d.reference})` : ""}`;
    case "invoice.claimed": return `${who} reports payment of ${INVOICE_NAMES[d.seq]}${d.reference ? ` (ref ${d.reference})` : ""}`;
    case "client.company_updated": return `${who} updated their company details`;
    case "client.company_confirmed": return `${who} confirmed their company details`;
    case "letter.drafted": return `Engagement letter draft v${d.version} created for review (fee ${eur(d.fee)})`;
    case "client.uploaded": return `${who} uploaded: ${d.label}`;
    case "deposit.paid": return `Deposit received by bank transfer${d.reference ? ` (${d.reference})` : ""}`;
    case "invoice.issued": return `${INVOICE_NAMES[d.seq]} issued, #${d.no}, ${eur(d.amount)}`;
    case "invoice.paid": return `${INVOICE_NAMES[d.seq]} paid`;
    case "agreement.signed": return `${d.kind === "nda" ? "NDA" : "Engagement letter"} v${d.version} signed by ${who}`;
    case "project.created": return `Project ${d.code} created`;
    case "project.stage": return `Project moved to ${d.to}`;
    default: return f.action;
  }
}

// The Valuation Builder is a standalone single-file app (public/valuation-builder.html) shown inside Solonos.
/** Order and hide board columns per the saved layout; columns the layout doesn't know keep their default place. */
function applyBoardLayout(cols, layout) {
  if (!layout) return cols;
  const order = layout.order ?? [], hidden = new Set(layout.hidden ?? []);
  const rank = (c, i) => { const k = order.indexOf(c.key); return k === -1 ? 1000 + i : k; };
  return cols.map((c, i) => ({ c, r: rank(c, i) })).sort((a, b) => a.r - b.r).map((x) => x.c).filter((c) => !hidden.has(c.key));
}

function BoardSettings() {
  const [run, busy] = useAction();
  const [rows, setRows] = useState(null);     // [{ key, title, hidden }]
  const [dirty, setDirty] = useState(false);
  useEffect(() => {
    (async () => {
      const [{ data: st }, { data: saved }] = await Promise.all([
        supabase.from("pipeline_stages").select("ghl_id,name,position").order("position"),
        supabase.from("app_settings").select("value").eq("key", "leads_board").maybeSingle(),
      ]);
      const base = [...(st ?? []).map((x) => ({ key: x.ghl_id, title: x.name })), { key: "__invited", title: "Invited" }, { key: "__engaged", title: "Engaged" }];
      const layout = saved?.value ?? null, hidden = new Set(layout?.hidden ?? []);
      const ordered = layout ? applyBoardLayout(base, { order: layout.order }) : base;
      setRows(ordered.map((r) => ({ ...r, hidden: hidden.has(r.key) })));
    })();
  }, []);
  const move = (i, d) => { const j = i + d; if (j < 0 || j >= rows.length) return; const n = [...rows]; [n[i], n[j]] = [n[j], n[i]]; setRows(n); setDirty(true); };
  const [drag, setDrag] = useState(null);       // index being dragged
  const [over, setOver] = useState(null);       // index under the pointer
  const dropAt = (to) => { if (drag == null || to == null || drag === to) { setDrag(null); setOver(null); return; } const n = [...rows]; const [m] = n.splice(drag, 1); n.splice(to, 0, m); setRows(n); setDirty(true); setDrag(null); setOver(null); };
  const toggle = (i) => { const n = [...rows]; n[i] = { ...n[i], hidden: !n[i].hidden }; setRows(n); setDirty(true); };
  const reset = () => { setRows([...rows].sort((a, b) => (a.key.startsWith("__") ? 1 : 0) - (b.key.startsWith("__") ? 1 : 0))); setDirty(true); };
  const save = () => run(async () => {
    const { data: me } = await supabase.auth.getUser();
    const value = { order: rows.map((r) => r.key), hidden: rows.filter((r) => r.hidden).map((r) => r.key) };
    const { error } = await supabase.from("app_settings").upsert({ key: "leads_board", value, updated_at: new Date().toISOString(), updated_by: me?.user?.id ?? null });
    if (error) throw new Error(error.message);
    setDirty(false);
  }, "Board layout saved");
  return (
    <Card title="Leads board columns" right={<span className="muted small">Changes Solonos only; GHL stays as it is</span>}>
      {!rows ? <span className="muted small">Loading…</span> : (
        <>
          <p className="muted small" style={{ margin: "0 0 12px" }}>Drag a row (by the ⠿ handle) to put the columns in the order you want them, left to right. Untick a column to hide it from the board; its leads stay in GHL and in Reports. Columns with no leads yet only show up once a lead arrives there.</p>
          <div className="stack" style={{ gap: 6 }}>
            {rows.map((r, i) => (
              <div key={r.key} className="row between" draggable
                onDragStart={(e) => { setDrag(i); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", r.key); }}
                onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (over !== i) setOver(i); }}
                onDragLeave={() => { if (over === i) setOver(null); }}
                onDrop={(e) => { e.preventDefault(); dropAt(i); }}
                onDragEnd={() => { setDrag(null); setOver(null); }}
                style={{ padding: "8px 10px", border: `1px solid ${over === i && drag !== i ? "var(--accent)" : "var(--border-sub)"}`, borderTop: over === i && drag != null && drag > i ? "3px solid var(--accent)" : undefined, borderBottom: over === i && drag != null && drag < i ? "3px solid var(--accent)" : undefined, borderRadius: 8, background: r.hidden ? "var(--sunken)" : "var(--surface)", flexWrap: "nowrap", opacity: drag === i ? 0.4 : 1, cursor: "grab" }}>
                <label className="row" style={{ gap: 10, flexWrap: "nowrap", minWidth: 0 }}>
                  <span className="muted" style={{ fontSize: 18, lineHeight: 1, cursor: "grab", userSelect: "none" }} title="Drag to reorder">⠿</span>
                  <input type="checkbox" checked={!r.hidden} onChange={() => toggle(i)} />
                  <span style={{ opacity: r.hidden ? 0.5 : 1, fontWeight: 500 }}>{r.title}</span>
                  {r.key.startsWith("__") && <span className="muted small">Solonos</span>}
                </label>
                <span className="row" style={{ gap: 4, flexWrap: "nowrap" }}>
                  <button className="btn" disabled={i === 0} onClick={() => move(i, -1)} aria-label={`Move ${r.title} up`}>↑</button>
                  <button className="btn" disabled={i === rows.length - 1} onClick={() => move(i, 1)} aria-label={`Move ${r.title} down`}>↓</button>
                </span>
              </div>
            ))}
          </div>
          <div className="row" style={{ marginTop: 14 }}>
            <button className="btn primary" disabled={busy || !dirty} onClick={save}>Save layout</button>
            <button className="btn" disabled={busy} onClick={reset}>GHL order</button>
            {dirty && <span className="muted small">Unsaved changes</span>}
          </div>
        </>
      )}
    </Card>
  );
}

async function signedUrl(storagePath, seconds = 600) {
  const [bucket, ...rest] = storagePath.split("/");
  const { data, error } = await supabase.storage.from(bucket).createSignedUrl(rest.join("/"), seconds);
  if (error) throw new Error(error.message);
  return data.signedUrl;
}

/** Renders a .docx from storage inside the page (docx-preview) so the client reads what they sign. */
function DocxView({ storagePath }) {
  const ref = React.useRef(null);
  const [state, setState] = useState("loading");
  useEffect(() => {
    let dead = false;
    (async () => {
      try {
        const url = await signedUrl(storagePath);
        const blob = await (await fetch(url)).blob();
        const mod = await import("https://esm.sh/docx-preview@0.3.3");
        if (dead) return;
        ref.current.innerHTML = "";
        await mod.renderAsync(blob, ref.current, undefined, { inWrapper: false, ignoreWidth: true, ignoreHeight: true, useBase64URL: true });
        setState("ok");
      } catch (e) { setState("error: " + e.message); }
    })();
    return () => { dead = true; };
  }, [storagePath]);
  return (
    <div className="docx">
      {state === "loading" && <div className="muted small">Loading the document…</div>}
      {state.startsWith("error") && <div className="err">{state}</div>}
      <div ref={ref} />
    </div>
  );
}

/** Draw-your-signature box (mouse or finger). Exports a PNG data URL. */
function SignaturePad({ onChange }) {
  const ref = React.useRef(null);
  const drawing = React.useRef(false);
  const pos = (ev) => {
    const r = ref.current.getBoundingClientRect();
    const p = ev.touches ? ev.touches[0] : ev;
    return { x: (p.clientX - r.left) * (ref.current.width / r.width), y: (p.clientY - r.top) * (ref.current.height / r.height) };
  };
  const start = (ev) => { drawing.current = true; const c = ref.current.getContext("2d"); const { x, y } = pos(ev); c.beginPath(); c.moveTo(x, y); ev.preventDefault(); };
  const move = (ev) => { if (!drawing.current) return; const c = ref.current.getContext("2d"); c.lineWidth = 2.2; c.lineCap = "round"; c.strokeStyle = "#1a1a4a"; const { x, y } = pos(ev); c.lineTo(x, y); c.stroke(); ev.preventDefault(); };
  const end = () => { if (!drawing.current) return; drawing.current = false; onChange(ref.current.toDataURL("image/png")); };
  const clear = () => { const c = ref.current.getContext("2d"); c.clearRect(0, 0, ref.current.width, ref.current.height); onChange(null); };
  return (
    <div>
      <canvas ref={ref} width={600} height={180}
        style={{ width: "100%", maxWidth: 600, height: 180, background: "#fff", border: "1px dashed var(--border-dash)", borderRadius: 8, touchAction: "none", cursor: "crosshair" }}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
      <div className="row" style={{ marginTop: 6 }}><span className="muted small">Sign inside the box with your mouse or finger.</span><button type="button" className="btn" onClick={clear}>Clear</button></div>
    </div>
  );
}

      supabase.from("documents").select("*").eq("engagement_id", eng.id).eq("visibility", "client").order("created_at", { ascending: false }),
      supabase.from("activity_log").select("*").eq("engagement_id", eng.id).eq("visible_to_client", true).order("created_at", { ascending: false }).limit(20),
    ]);
    setAgreements(a.data ?? []); setDocs(d.data ?? []); setDeposit(dep.data); setInvoices(inv.data ?? []); setShared(sh.data ?? []); setFeed(f.data ?? []);

    if (eng) return;      // 3.23: nothing is generated or sent from the client's page by itself

      try { await callFn("engagement-send", { engagement_id: eng.id, kind: "nda" }); await load(); return; } catch (_) { /* staff can trigger it */ }

    if (!previewId && ndaOk && eng.company_confirmed_at && eng.fee && !letterExists) {
      try { await callFn("engagement-send", { engagement_id: eng.id, kind: "letter" }); await load(); } catch (_) { /* staff can send it manually */ }
    }
  }, [previewId]);
  useEffect(() => { load(); }, [load]);

  if (e === undefined) return null;
  if (e === null && !previewId) return <PortalNoEngagement session={session} />;

const ACCEPT = ".pdf,.xlsx,.xls,.csv,.docx,.doc,.pptx,.png,.jpg,.jpeg,.zip";
const MAX_MB = 50;
const fileNameOf = (path) => (path ? path.split("/").pop().replace(/^[0-9a-f-]{36}-/, "") : "");

function UploadStep({ e, docs, reload, preview }) {
  const [run, busy] = useAction();
  async function upload(d, file) {
    if (file.size > MAX_MB * 1024 * 1024) { alert(`That file is ${(file.size / 1048576).toFixed(0)} MB; the limit is ${MAX_MB} MB.`); return; }
    await run(async () => {
      const path = `${e.id}/${d.id}-${file.name}`;
      const { error } = await supabase.storage.from("client-uploads").upload(path, file, { upsert: true });
      if (error) throw new Error(error.message);
      await rpc("portal_mark_uploaded", { p_doc: d.id, p_storage_path: `client-uploads/${path}` });
      await reload();
    }, `${d.label}: uploaded`);
  }
  async function remove(d) {
    await run(async () => {
      if (d.storage_path) await supabase.storage.from("client-uploads").remove([d.storage_path.replace(/^client-uploads\//, "")]);
      await rpc("portal_remove_upload", { p_doc: d.id });
      await reload();
    }, "Removed. Upload a new file when ready.");
  }
  async function uploadMany(files) {
    const list = [...files].filter((f) => f.size <= MAX_MB * 1024 * 1024);
    if (list.length !== files.length) alert(`Some files were skipped: the limit is ${MAX_MB} MB each.`);
    await run(async () => {
      for (const file of list) {
        const path = `${e.id}/extra-${Date.now()}-${file.name}`;
        const { error } = await supabase.storage.from("client-uploads").upload(path, file, { upsert: true });
        if (error) throw new Error(error.message);
        await rpc("portal_add_upload", { p_engagement: e.id, p_label: file.name, p_storage_path: `client-uploads/${path}` });
      }
      await reload();
    }, `${list.length} file${list.length === 1 ? "" : "s"} uploaded`);
  }
  const done = docs.filter((d) => d.uploaded_at).length;
  return (
    <>
      <div className="pagehead"><div><h1>Upload your documents</h1><p>Use the lines below for the documents we asked for, or add several files at once with the button under the list. Accepted: PDF, Excel (xlsx/xls/csv), Word, PowerPoint, images or a zip, up to {MAX_MB} MB each. Everything is covered by the NDA.</p></div></div>
      <Card title="Your documents" right={<span className="muted small">{done}/{docs.length} received</span>} style={{ maxWidth: 760 }}>
        <div className="stack" style={{ gap: 0 }}>
          {docs.map((d) => (
            <div key={d.id} style={{ padding: "10px 0", borderBottom: "1px solid var(--border-sub)" }}>
              <div className="row between">
                <span>{d.uploaded_at ? <Chip kind="ok">received</Chip> : <Chip kind="warn">{d.required ? "needed" : "optional"}</Chip>} <span style={{ marginLeft: 6 }}>{d.label}</span></span>
                <span className="row">
                  {d.uploaded_at && <button className="btn" disabled={preview || busy} onClick={() => remove(d)}>Remove</button>}
                  <label className="btn" style={{ cursor: preview ? "default" : "pointer", opacity: preview ? .5 : 1 }}>{d.uploaded_at ? "Replace" : "Upload"}<input type="file" accept={ACCEPT} style={{ display: "none" }} disabled={preview || busy} onChange={(x) => x.target.files[0] && upload(d, x.target.files[0])} /></label>
                </span>
              </div>
              {d.uploaded_at && <div className="muted small" style={{ marginTop: 4 }}>📄 {fileNameOf(d.storage_path)} · uploaded {day(d.uploaded_at)}</div>}
            </div>
          ))}
          {docs.length === 0 && <span className="muted small">The document list will appear here once we've set it up.</span>}
        </div>
        <div className="row" style={{ marginTop: 14 }}>
          <label className="btn primary" style={{ cursor: preview ? "default" : "pointer", opacity: preview ? .5 : 1 }}>{busy ? "Uploading…" : "Add several files at once"}<input type="file" multiple accept={ACCEPT} style={{ display: "none" }} disabled={preview || busy} onChange={(x) => x.target.files.length && uploadMany(x.target.files)} /></label>
          <span className="muted small">Select many files in the dialog; each appears as its own line.</span>
        </div>
      </Card>
    </>
  );
}

const FUNNEL_START = "2026-08-15";   // the day this funnel went live; "All time" starts here and older Meta spend is ignored
const isoDay = (d) => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setUTCDate(x.getUTCDate() + n); return x; };
/** Period pill → { since, until } as YYYY-MM-DD (until inclusive), plus a label. */
function periodRange(p) {
  const today = new Date();
  if (p === "7") return { since: isoDay(addDays(today, -6)), until: isoDay(today), label: "Last 7 days" };
  if (p === "30") return { since: isoDay(addDays(today, -29)), until: isoDay(today), label: "Last 30 days" };
  if (p === "month") {
    const first = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth() - 1, 1));
    const last = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 0));
    return { since: isoDay(first), until: isoDay(last), label: first.toLocaleDateString("en-GB", { month: "long", year: "numeric", timeZone: "UTC" }) };
  }
  return { since: FUNNEL_START, until: isoDay(today), label: "Since 15 Aug 2026" };
}
const usd = (n) => money(n, "USD");
const pct = (n) => (n == null ? "–" : `${Math.round(n)}%`);
const per = (amount, count, ccy = "EUR") => (count > 0 ? money(amount / count, ccy) : "–");
const whyLost = (j) => Object.entries(j ?? {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${v}`).join(" · ");

/** Loads everything the Reports screen and the Dashboard show, for one period. */
function useReportData(period, level = "campaign") {
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");
  const [syncing, setSyncing] = useState(false);
  const range = periodRange(period);
  const load = useCallback(async () => {
    setErr("");
    try {
      const [headline, funnel, ads, ghl] = await Promise.all([
        rpc("report_headline", { p_since: range.since, p_until: range.until }),
        rpc("report_funnel", { p_since: range.since, p_until: `${range.until}T23:59:59Z` }),
        rpc("report_ads", { p_since: range.since, p_until: range.until, p_level: level }),
        callFn("meta-ads", { action: "ghl_funnel", since: range.since, until: range.until }).catch(() => null),
      ]);
      setData({ headline, funnel, ads, ghl: ghl?.rows ?? [] });
    } catch (e) { setErr(e.message); }
  }, [range.since, range.until, level]);

  // pull fresh Meta numbers at most every 6 hours, then reload
  const refresh = useCallback(async (days = 35) => {
    setSyncing(true);
    try { await callFn("meta-ads", { action: "refresh", days }); await load(); }
    catch (e) { setErr(`Meta refresh failed: ${e.message}`); }
    finally { setSyncing(false); }
  }, [load]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    supabase.from("meta_insights_daily").select("synced_at").order("synced_at", { ascending: false }).limit(1).maybeSingle()
      .then(({ data: row }) => {
        const stale = !row || Date.now() - new Date(row.synced_at).getTime() > 6 * 36e5;
        if (stale) refresh();
      });
  }, []);   // eslint-disable-line react-hooks/exhaustive-deps

  return { data, err, syncing, refresh, range, reload: load };
}

function PeriodPills({ period, setPeriod }) {

            {ghlRows.map((r, i) => (
              <tr key={r.stage_id}>
                <td>{r.stage_name} <span className="muted small">(GHL only, before the board)</span></td>
                {bar(r.reached)}
                <td className="num">{r.reached}</td>
                <td className="num">{i === 0 ? "–" : pct(ghlRows[i - 1].reached > 0 ? 100 * r.reached / ghlRows[i - 1].reached : null)}</td>
                <td className="num">{r.lost_here ?? "–"}</td>
                <td className="num ghost">not tracked</td>
                <td className="ghost">{i === 0 ? "GHL keeps no reason" : ""}</td>
              </tr>
            ))}
            {funnel.map((r, i) => (
              <tr key={r.stage_id} style={i === funnel.length - 1 ? { fontWeight: 600 } : undefined}>
                <td>{r.stage_name}</td>
                {bar(r.reached)}
                <td className="num">{r.reached}</td>
                <td className="num">{i === 0 ? pct(lastGhl > 0 ? 100 * r.reached / lastGhl : null) : pct(r.conversion)}</td>
                <td className="num">{r.lost_here}</td>
                <td className="num">{r.avg_days ?? "–"}</td>
                <td>{whyLost(r.why_lost) || ""}</td>
              </tr>
            ))}
            {funnel.length === 0 && ghlRows.length === 0 && <tr><td colSpan="7" className="muted">No leads in this period.</td></tr>}
          </tbody>
        </table>
        {funnel.length > 0 && ghlRows.length > 0 && ghlRows[0].reached > 0 && (
          <p className="muted small" style={{ margin: "10px 0 0" }}>
            {funnel[funnel.length - 1].stage_name}: {funnel[funnel.length - 1].reached} of {ghlRows[0].reached} leads ({pct(100 * funnel[funnel.length - 1].reached / ghlRows[0].reached)}).
            Stage history is recorded from 17 Sep 2026; "Avg days" and "Why lost" fill in as leads move from then on.
          </p>
        )}
      </Card>

      <Card title={<>Ads <span className="src meta">Meta</span> <span className="muted small" style={{ fontWeight: 400 }}>spend and leads</span> <span className="src ghl">GHL</span> <span className="muted small" style={{ fontWeight: 400 }}>calls</span> <span className="src sol">Solonos</span> <span className="muted small" style={{ fontWeight: 400 }}>engagements and fees</span></>}
        right={<div className="pills">{[["campaign", "Campaign"], ["adset", "Ad set"], ["ad", "Ad"]].map(([k, l]) => <button key={k} className={level === k ? "on" : ""} onClick={() => setLevel(k)}>{l}</button>)}</div>}>
        <div style={{ overflowX: "auto" }}>
          <table className="table">
            <thead><tr><th>{level === "campaign" ? "Campaign" : level === "adset" ? "Ad set" : "Ad"}</th><th>Status</th><th className="num">Spend</th><th className="num">In EUR</th><th className="num">Impressions</th><th className="num">Clicks</th><th className="num">Leads</th><th className="num">Cost / lead</th><th className="num">Calls booked</th><th className="num">Cost / call</th><th className="num">Engagements</th><th className="num">Fees signed</th><th className="num">Return</th></tr></thead>
            <tbody>
              {ads.map((r) => (
                <tr key={r.meta_id}>
                  <td>{r.name}{level !== "campaign" && <div className="muted small">{r.campaign_name}</div>}</td>
                  <td>{r.status && <Chip kind={r.status === "ACTIVE" ? "ok" : ""}>{r.status === "ACTIVE" ? "Active" : r.status === "PAUSED" ? "Paused" : r.status.toLowerCase()}</Chip>}</td>
                  <td className="num">{usd(r.spend_usd)}</td><td className="num">{eur(r.spend_eur)}</td>
                  <td className="num">{Number(r.impressions).toLocaleString("en-GB")}</td><td className="num">{Number(r.clicks).toLocaleString("en-GB")}</td>
                  <td className="num">{r.leads}</td><td className="num">{per(r.spend_usd, r.leads, "USD")}</td>
                  <td className="num">{r.calls_booked}</td><td className="num">{per(r.spend_usd, r.calls_booked, "USD")}</td><td className="num">{r.engagements}</td><td className="num">{eur(r.fees_eur)}</td><td className="num">{retOf(r)}</td>
                </tr>
              ))}
              {ads.length > 0 && (
                <tr className="total">
                  <td>All</td><td></td><td className="num">{usd(tot.spend_usd)}</td><td className="num">{eur(tot.spend_eur)}</td>
                  <td className="num">{tot.impressions.toLocaleString("en-GB")}</td><td className="num">{tot.clicks.toLocaleString("en-GB")}</td>
                  <td className="num">{tot.leads}</td><td className="num">{per(tot.spend_usd, tot.leads, "USD")}</td>
                  <td className="num">{tot.calls_booked}</td><td className="num">{per(tot.spend_usd, tot.calls_booked, "USD")}</td><td className="num">{tot.engagements}</td><td className="num">{eur(tot.fees_eur)}</td><td className="num">{retOf(tot)}</td>
                </tr>
              )}
              {ads.length === 0 && <tr><td colSpan="13" className="muted">{data ? "No spend in this period." : "Loading…"}</td></tr>}
            </tbody>
          </table>
        </div>
        <p className="muted small" style={{ margin: "10px 0 0" }}>Rows without spend in the period are hidden. Calls, engagements and fees are matched through the ad attribution GHL stores on each contact. Meta's lead count and GHL's will differ; that gap is normal.</p>
      </Card>
    </>
  );
}

// ===================== pages/Dashboard.jsx =====================
function Dashboard() {
  const [period, setPeriod] = useState("30");
  const { data, err, syncing, range } = useReportData(period);
  const funnel = data?.funnel ?? [];
  const ghl = data?.ghl ?? [];
  const chain = [...ghl.map((r) => [r.stage_name, r.reached]), ...funnel.map((r) => [r.stage_name, r.reached])];
  return (
    <>
      <div className="pagehead">
        <div><h1>Dashboard</h1><p>{range.label}. {syncing ? "Updating from Meta…" : ""}</p></div>
        <PeriodPills period={period} setPeriod={setPeriod} />
      </div>
      {err && <div className="note" style={{ color: "var(--danger)", marginBottom: 14 }}>{err}</div>}
      <Headline h={data?.headline} range={range} />
      <TodayBox />
      <Card title="Funnel" right={<NavLink to="/app/reports" className="btn">Open reports</NavLink>}>
        {chain.length === 0 ? <span className="muted">No leads in this period.</span> : (
          <div className="row wrap" style={{ gap: 6 }}>
            {chain.map(([name, n], i) => (
              <Fragment key={name}>
                {i > 0 && <span className="muted">→</span>}
                <span className="chip" style={{ fontSize: 12, padding: "4px 10px" }}><strong>{n}</strong> {name}</span>
              </Fragment>
            ))}
          </div>
        )}
      </Card>
    </>
  );
}

// ===================== App.jsx =====================
const NAV = [
  ["Dashboard", "/app/dashboard"],
  ["Leads", "/app/leads"],
  ["Valuation Builder", "/app/valuation-builder"],
  ["Clients", "/app/clients", 5],
  ["Projects", "/app/projects"],
  ["Documents", "/app/documents", 5],
  ["Time", "/app/time", 4],
  ["Invoices", "/app/invoices", 3],
  ["Tasks", "/app/tasks"],
  ["OneDrive", "/app/onedrive", null, "partner"],
  ["Reports", "/app/reports"],
  ["Settings", "/app/settings"],
];

function SetPassword() {
  const [open, setOpen] = useState(false);
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState("");
  async function save() {
    if (pw.length < 8) { setMsg("At least 8 characters."); return; }
    const { error } = await supabase.auth.updateUser({ password: pw });
    setMsg(error ? error.message : "Password saved. Use it next time you sign in.");
    if (!error) { setPw(""); setTimeout(() => { setOpen(false); setMsg(""); }, 2500); }
  }
  if (!open) return <button onClick={() => setOpen(true)} style={{ marginRight: 6 }}>Set password</button>;
  return (
    <div style={{ margin: "6px 0" }}>
      <input type="password" placeholder="New password" value={pw} onChange={(e) => setPw(e.target.value)}
        style={{ width: "100%", padding: 6, borderRadius: 6, border: "1px solid rgba(255,255,255,.4)", background: "rgba(255,255,255,.1)", color: "var(--on)", fontSize: 12, marginBottom: 6 }} />
      <button onClick={save} style={{ marginRight: 6 }}>Save</button>
      <button onClick={() => { setOpen(false); setMsg(""); }}>Cancel</button>
      {msg && <div style={{ fontSize: 11, marginTop: 6 }}>{msg}</div>}
    </div>
  );
}

function Shell({ session, staff, signOut }) {
  const [menu, setMenu] = useState(false);
  useEffect(() => { registerSw(); }, []);
  const loc = useLocation();
  useEffect(() => { setMenu(false); }, [loc.pathname]);
  // role "user" (e.g. Margarita): only the Projects section, which is the engagements list and each engagement's page
  const limited = staff?.role === "user";
  return (
    <div className="shell">
      <nav className={`sidebar${menu ? " open" : ""}`}>
        <div className="wordmark">Solonos</div>
        <button className="burger" aria-label={menu ? "Close menu" : "Open menu"} aria-expanded={menu} onClick={() => setMenu((m) => !m)}>{menu ? "✕" : "☰"}</button>
        <div className="menu">
        <Bell />
        {limited ? <NavLink to="/app/projects" className={({ isActive }) => (isActive ? "active" : "")}>Projects</NavLink> : <>
        <a href="/app/projects" title="Open a project and click 'Preview client's page'">Client portal <span className="soon">via project</span></a>
        {NAV.filter(([, , , role]) => !role || staff?.role === role).map(([label, to, slice]) => (
          <NavLink key={to} to={to} className={({ isActive }) => (isActive ? "active" : "")}>
            {label}{slice && <span className="soon">slice {slice}</span>}
          </NavLink>
        ))}
        </>}
        <div className="foot">
          {staff?.full_name ?? session.user.email}<br />
          <span style={{ opacity: .7 }}>{staff?.role}</span><br />
          <SetPassword />
          <button onClick={signOut}>Sign out</button>
          <div style={{ opacity: .5, fontSize: 10, marginTop: 8 }}>Solonos {APP_VERSION}</div>
        </div>
        </div>
      </nav>
      <main className="main">
        {limited ? (
        <Routes>
          <Route path="/app/projects" element={<Engagements />} />
          <Route path="/app/projects/:id" element={<EngagementDetail />} />
          <Route path="/app/engagements/:id" element={<EngagementDetail />} />
          <Route path="*" element={<Navigate to="/app/projects" replace />} />
        </Routes>
        ) : (
        <Routes>
          <Route path="/app/dashboard" element={<Dashboard />} />
          <Route path="/app/reports" element={<Reports />} />
          <Route path="/app/leads" element={<Leads />} />
          <Route path="/app/engagements" element={<Engagements />} />
          <Route path="/app/engagements/:id" element={<EngagementDetail />} />
          <Route path="/app/valuation-builder" element={<ValuationBuilder />} />
          <Route path="/app/settings" element={<Settings />} />
          <Route path="/app/tasks" element={<Tasks />} />
          <Route path="/app/projects" element={<Engagements />} />
          <Route path="/app/projects/:id" element={<EngagementDetail />} />
          <Route path="/app/onedrive" element={staff?.role === "partner" ? <OneDrivePage /> : <Navigate to="/app/leads" replace />} />
          <Route path="/app/*" element={<Soon />} />
          <Route path="*" element={<Navigate to="/app/leads" replace />} />
        </Routes>
        )}
      </main>
    </div>
  );
}

/** Bell: client actions across all engagements, unread since the last time you opened it. */
function Bell() {
  const [items, setItems] = useState([]);
  const [open, setOpen] = useState(false);
  const [seen, setSeen] = useState(() => localStorage.getItem("solonos.bellSeen") ?? "1970-01-01");
  const nav = useNavigate();
  const load = useCallback(async () => {
    const { data } = await supabase.from("activity_log").select("id, engagement_id, actor, action, detail, created_at")
      .or("action.like.client.%,action.eq.agreement.signed,action.eq.deposit.claimed,action.eq.invoice.claimed")
      .order("created_at", { ascending: false }).limit(25);
    const rows = (data ?? []).filter((r) => String(r.actor).includes("@") && !/consortiaadvisory\.com$/i.test(r.actor));
    const ids = [...new Set(rows.map((r) => r.engagement_id))];
    const { data: engs } = ids.length ? await supabase.from("engagements").select("id, client_name, company_name").in("id", ids) : { data: [] };
    const byId = Object.fromEntries((engs ?? []).map((e) => [e.id, e]));
    setItems(rows.map((r) => ({ ...r, eng: byId[r.engagement_id] })));
  }, []);
  useEffect(() => { load(); const t = setInterval(load, 60 * 1000); return () => clearInterval(t); }, [load]);
  const unread = items.filter((r) => r.created_at > seen).length;
  const openIt = () => { setOpen(!open); if (!open) { const now = new Date().toISOString(); localStorage.setItem("solonos.bellSeen", now); setSeen(now); } };
  return (
    <div style={{ position: "relative", padding: "0 10px 8px" }}>
      <button onClick={openIt} style={{ background: unread ? "var(--on)" : "rgba(255,255,255,.12)", color: unread ? "var(--brand)" : "var(--on)", border: 0, borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontSize: 12, fontWeight: 600, width: "100%" }}>
        🔔 {unread ? `${unread} new` : "Notifications"}
      </button>
      {open && (
        <div style={{ position: "absolute", left: 10, top: 36, width: 340, background: "var(--surface)", color: "var(--text)", border: "1px solid var(--border)", borderRadius: 12, boxShadow: "0 10px 30px rgba(0,0,0,.25)", zIndex: 40, maxHeight: 420, overflowY: "auto" }}>
          {items.length === 0 && <div className="muted small" style={{ padding: 12 }}>No client activity yet.</div>}
          {items.map((r) => (
            <div key={r.id} onClick={() => { setOpen(false); nav(`/app/projects/${r.engagement_id}`); }} style={{ padding: "10px 12px", borderBottom: "1px solid var(--border-sub)", cursor: "pointer", fontSize: 12 }}>
              <div>{describe(r, r.eng?.client_name ?? r.actor)}</div>
              <div className="muted">{r.eng?.company_name || ""} · {ago(r.created_at)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function NewVersionBanner() {
  const [latest, setLatest] = useState(null);
  useEffect(() => {
    const check = async () => {
      try {
        const t = await (await fetch(`/index.html?fresh=${Date.now()}`, { cache: "no-store" })).text();
        const m = t.match(/APP_VERSION = "([^"]+)"/);
        if (m && m[1] !== APP_VERSION) setLatest(m[1]);
      } catch (_) {}
    };
    check(); const id = setInterval(check, 5 * 60 * 1000); return () => clearInterval(id);
  }, []);
  if (!latest) return null;
  return (
    <div style={{ position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", zIndex: 60, background: "var(--accent)", color: "var(--on)", padding: "8px 14px", borderRadius: 10, fontSize: 13, boxShadow: "0 6px 24px rgba(0,0,0,.2)" }}>
      Solonos {latest} is available (you have {APP_VERSION}). <button onClick={() => window.location.reload(true)} style={{ marginLeft: 8, background: "var(--on)", color: "var(--accent)", border: 0, borderRadius: 6, padding: "4px 10px", fontWeight: 600, cursor: "pointer" }}>Reload</button>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(undefined);
  const [staff, setStaff] = useState(null);
  const nav = useNavigate();
  const pathname = useLocation().pathname;
  const isPortal = pathname.startsWith("/portal");

  useEffect(() => {
    if (!configured) return;
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session || isPortal) { setStaff(null); return; }
    supabase.from("staff").select("full_name, role").eq("user_id", session.user.id).maybeSingle()
      .then(({ data }) => setStaff(data ?? false));
  }, [session, isPortal]);

  if (!configured) return (
    <div className="login"><div className="box"><h1>Not connected</h1><p>Supabase URL or key missing at the top of index.html.</p></div></div>
  );
  if (session === undefined) return null;

  if (isPortal) {
    if (!session) return <PortalLogin />;
    return <ToastProvider><Portal session={session} /></ToastProvider>;
  }

  if (!session) return <Login />;
  if (pathname === "/reset") return <ResetPassword />;
  if (staff === null) return null;
  if (staff === false) return (
    <div className="login"><div className="box">
      <h1>Not staff</h1>
      <p>{session.user.email} is signed in but isn't in the staff table. If you're a client, your page is at <a href="/portal" style={{ color: "var(--on)" }}>solonos.io/portal</a>.</p>
      <button className="btn primary" onClick={() => logout("/")}>Sign out</button>
    </div></div>
  );

  return (
    <ToastProvider>
      <NewVersionBanner />
      <Shell session={session} staff={staff} signOut={() => logout("/")} />
    </ToastProvider>
  );
}

// ===================== boot =====================
ReactDOM.createRoot(document.getElementById("root")).render(
  <BrowserRouter><App /></BrowserRouter>
);
</script>
