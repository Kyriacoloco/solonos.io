<!-- Solonos hook: when opened from a lead/engagement (?lead=... / ?eng=...), Print also saves a PDF onto that record -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";
const qs = new URLSearchParams(location.search);
const lead = qs.get("lead"), eng = qs.get("eng");
if (lead || eng) {
  const supabase = createClient("https://uirbiqfkgnfnfugfclmu.supabase.co", "sb_publishable_hrhOfXXHVMivsY0rritFKQ_WhQE2TIl", { auth: { flowType: "implicit" } });
  const bar = document.createElement("div");
  bar.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:99999;background:#800020;color:#FAF3E9;padding:10px 14px;border-radius:10px;font:600 13px Inter,system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center";
  bar.className = "no-print";
  bar.innerHTML = '<span>Solonos: linked to ' + (eng ? "the engagement" : "the lead") + '</span><button id="solonosSave" style="background:#0C4767;color:#FAF3E9;border:0;border-radius:8px;padding:7px 12px;font:600 12px Inter,sans-serif;cursor:pointer">Save PDF to Solonos</button>';
  document.body.appendChild(bar);
  const status = (t) => { bar.firstChild.textContent = t; };
  async function save() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { status("Sign in to Solonos first (same browser), then try again"); return; }
    status("Saving PDF…");
    // apply the builder's print layout while capturing, so every report page renders (not just the visible tab)
    const css = document.createElement("style");
    css.textContent = `
      html.solonos-capture .no-print { display: none !important; }
      html.solonos-capture, html.solonos-capture body { background: #fff !important; height: auto !important; overflow: visible !important; }
      html.solonos-capture .app-root { display: block !important; height: auto !important; background: #fff !important; }
      html.solonos-capture .report-pane { overflow: visible !important; padding: 0 !important; height: auto !important; }
      html.solonos-capture #report { width: 794px !important; margin: 0 !important; }
      html.solonos-capture #report .page { display: block !important; width: 794px !important; min-height: 1123px !important; height: 1123px !important;
        margin: 0 !important; box-shadow: none !important; overflow: hidden !important; page-break-after: always; break-after: page; }
      html.solonos-capture #report .page:last-child { page-break-after: auto; break-after: auto; }
      html.solonos-capture .page-fill { min-height: 1123px !important; }`;
    document.head.appendChild(css);
    document.documentElement.classList.add("solonos-capture");
    window.scrollTo(0, 0);
    try {
      const target = document.querySelector("#report") || document.getElementById("root") || document.body;
      await new Promise((r) => setTimeout(r, 300));
      const blob = await html2pdf().set({
        margin: 0, filename: "Valuation-Builder.pdf",
        image: { type: "jpeg", quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, windowWidth: 794, scrollX: 0, scrollY: 0, ignoreElements: (el) => el.classList && el.classList.contains("no-print") },
        jsPDF: { unit: "px", format: [794, 1123], orientation: "portrait", hotfixes: ["px_scaling"] },
        pagebreak: { mode: ["css"], after: ".page" },
      }).from(target).outputPdf("blob");
      document.documentElement.classList.remove("solonos-capture"); css.remove();
      const stamp = new Date();
      const name = "Valuation Builder - " + stamp.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
      const folder = eng ? eng : ("leads/" + lead);
      const path = folder + "/" + Date.now() + "-Valuation-Builder.pdf";
      const { error } = await supabase.storage.from("deliverables").upload(path, blob, { contentType: "application/pdf" });
      if (error) throw new Error(error.message);
      const row = { kind: "valuation_builder", name, storage_path: "deliverables/" + path, uploaded_by: "staff", visibility: eng ? "client" : "internal" };
      if (eng) row.engagement_id = eng;
      if (lead) row.opportunity_id = lead;
      const { error: e2 } = await supabase.from("documents").insert(row);
      if (e2) throw new Error(e2.message);
      status("Saved to Solonos ✓");
    } catch (e) { document.documentElement.classList.remove("solonos-capture"); css.remove(); status("Save failed: " + e.message); }
  }
  document.getElementById("solonosSave").addEventListener("click", save);
  const originalPrint = window.print.bind(window);
  window.print = async () => { await save(); originalPrint(); };
}
</script>
